# ipkg.yaml - IP 仓库管理配置（统一建仓）
# 当前仓库 = 统一 IP 仓（monorepo）
schema_version: "2.0"

# GitHub 配置
github:
  # GitHub 组织或用户名
  org: boyangwang1991-design
  # 认证方式：ssh-key | token
  auth: ssh-key
  # GitHub Token 环境变量名（当 auth = token 时使用）
  # token_env: GITHUB_TOKEN
  # 统一仓名（当前仓库）
  unified_repo: aixsilicon_ip_repo

# FuseSoC 配置（VLNV 命名空间）
fusesoc:
  # VLNV 前缀
  vendor: boyangwang1991-design
  library: ip
  # Core 文件输出目录（相对于 IP 版本目录）
  cores_dir: fusesoc

# 发布配置
publish:
  # 发布类型：formal | candidate | snapshot
  default_class: formal
  # 是否自动创建 Git tag
  auto_tag: true
  # 是否自动推送到 GitHub
  auto_push: true
  # tag 是否带 IP 前缀（统一仓多 IP 时避免冲突）：<ip>-v<version>
  tag_with_ip: true
  # 发布前检查项
  checks:
    - g5_pass        # 要求 G5 门禁通过
    - valid_manifest # 要求 manifest.yaml 有效
    - files_hash_ok  # 要求工作区文件 SHA-256 与 manifest 一致

# IP 包模板配置
template:
  # 许可证类型：MIT | Apache-2.0 | BSD-3-Clause | Proprietary
  license: Apache-2.0
  # 是否生成 CHANGELOG.md
  changelog: true
  # README 模板：default | minimal | detailed
  readme_template: default
