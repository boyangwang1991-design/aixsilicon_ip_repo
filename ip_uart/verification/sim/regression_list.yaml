# =============================================================================
# regression_list.yaml - UART 回归列表
# 来源：docs/verification/test_matrix.md（smoke + regression + extended 全部分组）
# =============================================================================

smoke:
  description: "快速冒烟测试，每次提交前运行（test_matrix 中 tier: smoke）"
  tests:
    - tc_uart_smoke

regression:
  description: "完整功能/边界/错误注入/寄存器回归（test_matrix 中 tier: regression）"
  tests:
    - tc_uart_tx_rx
    - tc_uart_error
    - tc_uart_fifo
    - tc_uart_csr

extended:
  description: "性能/安全扩展回归（test_matrix 中 tier: extended）"
  tests:
    - tc_uart_perf
    - tc_uart_alert
