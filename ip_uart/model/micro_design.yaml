schema_version: '1.0'
ip_name: UART
modules:
- id: LLD.MOD.UART.TOP
  hld_ref: HLD.MOD.L1.UART.TOP
  fsm: []
  datapath:
    pipeline_stages:
    - stage: S0
      name: Integration
      operation: 顶层连接寄存器堆、核心、alert、中断输出
    backpressure:
      type: none
      mechanism: TL-UL 握手由 uart_reg_top 处理
  cdc: []
  reset:
  - signal: rst_ni
    polarity: active_low
    reset_value: 0
    reset_type: async
  interrupt:
  - id: LLD.IRQ.UART.TOP.TX_WATERMARK
    name: intr_tx_watermark_o
    trigger: TX FIFO 低于 TXILVL
    clear: 电平型（FIFO 状态恢复）
    maskable: true
    priority: 1
  - id: LLD.IRQ.UART.TOP.TX_EMPTY
    name: intr_tx_empty_o
    trigger: TX FIFO 空
    clear: 电平型（FIFO 非空）
    maskable: true
    priority: 1
  - id: LLD.IRQ.UART.TOP.RX_WATERMARK
    name: intr_rx_watermark_o
    trigger: RX FIFO 高于 RXILVL
    clear: 电平型（FIFO 状态恢复）
    maskable: true
    priority: 1
- id: LLD.MOD.UART.REG_TOP
  hld_ref: HLD.MOD.L1.UART.REG_TOP
  fsm: []
  datapath:
    pipeline_stages:
    - stage: S0
      name: CSR Access
      operation: TL-UL 从接口译码、14 寄存器读写、中断逻辑、BUS.INTEGRITY 检测
    backpressure:
      type: valid_ready
      mechanism: TL-UL 握手
  cdc: []
  reset:
  - signal: rst_ni
    polarity: active_low
    reset_value: 0
    reset_type: async
  interrupt:
  - id: LLD.IRQ.UART.REG_TOP.INTR
    name: intr_*_o
    trigger: INTR_STATE & INTR_ENABLE
    clear: W1C（事件型）/ 电平恢复（电平型）
    maskable: true
    priority: 1
- id: LLD.MOD.UART.CORE
  hld_ref: HLD.MOD.L1.UART.CORE
  fsm:
  - id: LLD.FSM.UART.CORE.BREAK
    name: Break Detection FSM
    encoding_style: auto
    reset_state: BRK_CHK
    states:
    - name: BRK_CHK
    - name: BRK_WAIT
    transitions:
    - from: BRK_CHK
      to: BRK_WAIT
      condition: 连续低达到 RXBLVL 阈值
    - from: BRK_WAIT
      to: BRK_CHK
      condition: 收到非全零字符或线恢复
    illegal_state_handling: return_to_reset
  datapath:
    pipeline_stages:
    - stage: S0
      name: BaudDiv
      operation: NCO 16 位累加产生 16x baud tick
    - stage: S1
      name: FifoCtrl
      operation: TX/RX FIFO 读写控制与水位检测
    - stage: S2
      name: EventGen
      operation: 中断事件产生（watermark/empty/done/overflow/err/timeout）
    backpressure:
      type: fifo
      mechanism: FIFO 满/空控制反压
  cdc: []
  reset:
  - signal: rst_ni
    polarity: active_low
    reset_value: 0
    reset_type: async
  interrupt:
  - id: LLD.IRQ.UART.CORE.TX_DONE
    name: intr_tx_done_o
    trigger: TX FIFO 变空且末字节发送完成
    clear: W1C
    maskable: true
    priority: 2
  - id: LLD.IRQ.UART.CORE.RX_OVERFLOW
    name: intr_rx_overflow_o
    trigger: RX FIFO 满时收到新字符
    clear: W1C
    maskable: true
    priority: 2
  - id: LLD.IRQ.UART.CORE.RX_FRAME_ERR
    name: intr_rx_frame_err_o
    trigger: 停止位不为 1
    clear: W1C
    maskable: true
    priority: 2
  - id: LLD.IRQ.UART.CORE.RX_BREAK_ERR
    name: intr_rx_break_err_o
    trigger: break 条件检测
    clear: W1C
    maskable: true
    priority: 2
  - id: LLD.IRQ.UART.CORE.RX_TIMEOUT
    name: intr_rx_timeout_o
    trigger: RX FIFO 超时未取走
    clear: W1C
    maskable: true
    priority: 2
  - id: LLD.IRQ.UART.CORE.RX_PARITY_ERR
    name: intr_rx_parity_err_o
    trigger: 奇偶位极性错误
    clear: W1C
    maskable: true
    priority: 2
- id: LLD.MOD.UART.TX
  hld_ref: HLD.MOD.L1.UART.TX
  fsm:
  - id: LLD.FSM.UART.TX.MAIN
    name: TX Shift FSM
    encoding_style: auto
    reset_state: IDLE
    states:
    - name: IDLE
    - name: SHIFT
    transitions:
    - from: IDLE
      to: SHIFT
      condition: 有数据且 TX 使能
    - from: SHIFT
      to: IDLE
      condition: 帧发送完成
    illegal_state_handling: return_to_reset
  datapath:
    pipeline_stages:
    - stage: S0
      name: ShiftOut
      operation: 逐位输出 START+8 数据+（奇偶）+STOP
    backpressure:
      type: none
      mechanism: 按 bit-time 移位
  cdc: []
  reset:
  - signal: rst_ni
    polarity: active_low
    reset_value: 0
    reset_type: async
  interrupt: []
- id: LLD.MOD.UART.RX
  hld_ref: HLD.MOD.L1.UART.RX
  fsm:
  - id: LLD.FSM.UART.RX.MAIN
    name: RX Sampling FSM
    encoding_style: auto
    reset_state: IDLE
    states:
    - name: IDLE
    - name: SAMPLE
    transitions:
    - from: IDLE
      to: SAMPLE
      condition: 检测到起始位（低电平）
    - from: SAMPLE
      to: IDLE
      condition: 帧采样完成或毛刺中止
    illegal_state_handling: return_to_reset
  datapath:
    pipeline_stages:
    - stage: S0
      name: Oversample
      operation: 16x 过采样 + 中点采样
    - stage: S1
      name: ErrCheck
      operation: 帧/奇偶错误检测
    backpressure:
      type: none
      mechanism: 按 bit-time 采样
  cdc: []
  reset:
  - signal: rst_ni
    polarity: active_low
    reset_value: 0
    reset_type: async
  interrupt: []
- id: LLD.MOD.UART.APB2TLUL
  hld_ref: HLD.MOD.L1.UART.APB2TLUL
  fsm:
  - id: LLD.FSM.UART.APB2TLUL.MAIN
    name: APB2TLUL Bridge FSM
    encoding_style: auto
    reset_state: IDLE
    states:
    - name: IDLE
    - name: SETUP
    - name: ACCESS
    - name: WAIT_TL
    - name: RESP
    transitions:
    - from: IDLE
      to: SETUP
      condition: psel && !penable
    - from: SETUP
      to: ACCESS
      condition: penable
    - from: ACCESS
      to: WAIT_TL
      condition: 发起 TL-UL 请求
    - from: WAIT_TL
      to: RESP
      condition: TL-UL 响应返回
    - from: RESP
      to: IDLE
      condition: 返回 pready/pslverr
    illegal_state_handling: return_to_reset
  datapath:
    pipeline_stages:
    - stage: S0
      name: APBDecode
      operation: 解析 APB 事务（paddr/pwrite/pwdata）
    - stage: S1
      name: TLGen
      operation: 生成 TL-UL A/D 通道请求
    - stage: S2
      name: RespGen
      operation: 生成 pready/pslverr/prdata
    backpressure:
      type: handshake
      mechanism: APB pready 反压等待 TL-UL 响应
  cdc: []
  reset:
  - signal: rst_ni
    polarity: active_low
    reset_value: 0
    reset_type: async
  interrupt: []
