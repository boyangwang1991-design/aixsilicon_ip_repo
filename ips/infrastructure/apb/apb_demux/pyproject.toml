[project]
name = "apb-demux-workspace"
version = "1.0.0"
description = "APB Demux（1→N APB Router）的 RTL/IP 项目工作区"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
]
verification = [
    "numpy>=1.24.0",
]
registers = [
    "peakrdl>=1.5.0",
    "peakrdl-regblock>=1.3.1",
    "peakrdl-html>=2.12.0",
    "peakrdl-cheader>=1.1.0",
    "peakrdl-ipxact>=3.5.0",
    "pyslang>=11.0.0",
]

[tool.uv]
package = false
