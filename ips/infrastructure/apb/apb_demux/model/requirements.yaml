  applicability: null
  verify_method:
  - simulation
  description: APB4 profile 下，上游接口应额外提供 `PSTRB`、`PPROT` 信号。APB3 profile 下 这些信号应裁剪。
  acceptance_criteria:
  - APB4 配置下 `PSTRB`/`PPROT` 信号存在并正确参与路由。
  trace:
    hld_ref: []
    test_ref: []
