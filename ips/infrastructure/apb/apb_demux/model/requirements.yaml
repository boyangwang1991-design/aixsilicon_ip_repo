  description: IP 应提供可参数化的下游端口数量 `NUM_SLAVES`，默认值为 4，用于确定下游 APB Master-facing interface 的数量。
  acceptance_criteria:
  - '`NUM_SLAVES = 1/2/4/8/16` 均可合法实例化；'
  - 下游端口数量与参数一致。
