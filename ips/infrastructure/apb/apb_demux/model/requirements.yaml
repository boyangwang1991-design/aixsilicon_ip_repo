  description: IP 应提供可参数化的下游端口基地址数组 `BASE_ADDR[NUM_SLAVES]`，每个下游端口 拥有独立的基地址。
  acceptance_criteria:
  - 每个下游端口可配置独立基地址；
  - 基地址数组长度与 `NUM_SLAVES` 一致。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.APB_DEMUX.02.002
  category: CFG
  feature: addr_mask
  priority: P0
