  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: 以下请求信号允许广播至所有下游 ports：`PADDR`、`PENABLE`、`PWRITE`、`PWDATA`、 `PSTRB`、`PPROT`。
  acceptance_criteria:
  - 广播信号对所有下游端口一致。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.02.002
  category: FUNC
  feature: request_routing
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - formal
  description: 只有地址命中的下游 port 可以接收到有效 `PSEL`，即 `M_PSEL[i] = upstream_PSEL & hit[i]`。未选中下游 port 的 `M_PSEL = 0`。
  acceptance_criteria:
  - 命中端口 `M_PSEL` 有效，未命中端口 `M_PSEL` 无效；
  - '`M_PSEL` 满足 onehot0 约束。'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.02.003
  category: FUNC
  feature: request_routing
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - assertion
  description: '`M_PENABLE` 必须符合 APB protocol timing，不得产生 `PENABLE=1, PSEL=0` 的非法 下游 transaction。实现可通过 `M_PENABLE[i] = upstream_PENABLE`
    配合 `M_PSEL[i]` 使用。'
  acceptance_criteria:
  - 任意时刻不出现 `M_PENABLE=1` 且 `M_PSEL=0` 的组合；
  - APB 断言检查通过。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.03.001
  category: FUNC
  feature: transaction_behavior
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - assertion
  description: IP 不得改变标准 APB transaction semantics。APB transaction 应包含 SETUP PHASE （`PSEL=1, PENABLE=0`）与 ACCESS PHASE（`PSEL=1,
    PENABLE=1`）。
  acceptance_criteria:
  - 上游与下游均观察标准 SETUP/ACCESS 两相时序。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.03.002
  category: FUNC
  feature: transaction_behavior
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - assertion
  description: 当下游 `PREADY=0` 时，IP 必须保持 transaction 处于 ACCESS phase；wait-state 期间下游 selection 与返回 response source 不得改变。
  acceptance_criteria:
  - '`PREADY=0` 时 `PSEL`/`PENABLE` 保持稳定；'
  - wait-state 期间被选端口不变。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.04.001
  category: FUNC
  feature: response_routing
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: 被选中下游 port 的 `PRDATA`、`PREADY`、`PSLVERR` 必须返回至 upstream。未选中 下游 port 的 response 不得影响 upstream response。
  acceptance_criteria:
  - 读取访问返回正确数据；
  - 未选中端口响应被屏蔽。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.04.002
  category: FUNC
  feature: response_routing
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: 当下游返回 `PSLVERR=1` 时，IP 必须向 upstream 透传 error response，不得屏蔽 下游 APB error。
  acceptance_criteria:
  - 下游 `PSLVERR=1` 时上游观察到 `PSLVERR=1`。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.05.001
  category: FUNC
  feature: decode_error
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - formal
  description: 若 `PSEL=1` 但当前 `PADDR` 未匹配任何下游 port，必须产生 Decode Error。
  acceptance_criteria:
  - 未命中地址访问产生 Decode Error 响应。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.05.002
  category: FUNC
  feature: decode_error
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: Decode Miss 推荐响应为 `PREADY=1, PSLVERR=1, PRDATA=0`，即立即结束 transaction。
  acceptance_criteria:
  - Decode Miss 时上游观察到 `PREADY=1, PSLVERR=1, PRDATA=0`。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.05.003
  category: FUNC
  feature: decode_error
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - assertion
  description: Decode Miss 不允许无限等待，禁止 `PREADY=0 forever`，否则可能导致整个 APB fabric hang。
  acceptance_criteria:
  - Decode Miss 时 transaction 在有限周期内完成。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.06.001
  category: FUNC
  feature: address_remap
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: '`ADDR_REMAP_ENABLE=0` 时，`M_PADDR[i] = PADDR`（透传）。'
