- id: LRS.FUNC.APB_DEMUX.06.002
  category: FUNC
  feature: address_remap
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: '`ADDR_REMAP_ENABLE=1` 时，`M_PADDR[i] = PADDR - BASE_ADDR[i]`，使下游看到 local offset 地址。例如上游 `0x4000_0120` → 下游
