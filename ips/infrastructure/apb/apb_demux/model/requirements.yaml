    test_ref: []
- id: LRS.INTF.APB_DEMUX.03.001
  category: INTF
  feature: clock_reset
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - review
  description: IP 应使用单一 `PCLK` 时钟域，上游与所有下游端口共享同一时钟。本 IP 不提供 跨时钟域访问能力。
  acceptance_criteria:
  - 所有端口共享单一 `PCLK`；
  - 跨时钟访问应通过独立 APB CDC Bridge 完成（out of scope）。
