    hld_ref: []
    test_ref: []
- id: LRS.INTF.APB_DEMUX.03.002
  category: INTF
  feature: clock_reset
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: IP 应使用 `PRESETn` 作为复位输入，复位期间所有下游 `M_PSEL[i]` 应保持无效。
  acceptance_criteria:
  - Reset 期间无有效下游 transaction 产生。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.01.001
  category: FUNC
  feature: address_decode
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: 每个下游 APB port 应具有独立的地址映射区域，由 `BASE_ADDR[i]` 与 `ADDR_MASK[i]` 定义。
  acceptance_criteria:
  - 每个下游端口拥有独立非重叠的地址窗口。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.01.002
  category: FUNC
  feature: address_decode
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - formal
  description: 地址译码应基于当前 APB transaction 的 `PADDR`，命中条件为 `hit[i] = (PADDR & ADDR_MASK[i]) == (BASE_ADDR[i] & ADDR_MASK[i])`。
  acceptance_criteria:
  - 合法地址访问命中唯一正确的下游端口。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.01.003
  category: FUNC
  feature: address_decode
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  - formal
  description: 任意合法地址最多只能命中一个下游 port，即 `$onehot0(hit)` 必须成立。地址 overlap 应优先通过静态配置检查发现。
  acceptance_criteria:
  - 任意地址访问 `hit` 向量满足 onehot0；
  - 地址重叠配置被配置校验拒绝。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.01.004
  category: FUNC
  feature: address_decode
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - review
  - static
  description: 地址区域应满足 `size = power-of-two` 且 `base aligned to size`，以简化 decoder 逻辑。
  acceptance_criteria:
  - 配置校验检查 power-of-two 窗口与基地址对齐。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.01.005
  category: FUNC
  feature: address_decode
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - review
  description: 对于合法配置，地址译码应尽量减少无意义地址位比较。综合结果不应人为引入完整 地址加减比较路径。
  acceptance_criteria:
  - 综合报告显示 decoder 逻辑深度合理，无非必要全位宽比较。
  trace:
    hld_ref: []
    test_ref: []
