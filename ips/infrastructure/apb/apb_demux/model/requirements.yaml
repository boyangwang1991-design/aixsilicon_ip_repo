  - assertion
  description: IP 对每个下游端口应表现为 APB Master，提供信号：`M_PADDR[i]`、`M_PSEL[i]`、 `M_PENABLE[i]`、`M_PWRITE[i]`、`M_PWDATA[i]`、`M_PRDATA[i]`、`M_PREADY[i]`、
    `M_PSLVERR[i]`，其中 `i = 0 ... NUM_SLAVES-1`。
  acceptance_criteria:
  - 每个下游端口信号完整且符合 APB Master 时序；
  - 下游端口数量等于 `NUM_SLAVES`。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.APB_DEMUX.02.002
  category: INTF
  feature: downstream_apb_interface
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: APB4 profile 下，每个下游接口应额外提供 `M_PSTRB[i]`、`M_PPROT[i]` 信号。
