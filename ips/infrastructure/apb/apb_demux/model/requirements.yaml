- id: LRS.FUNC.APB_DEMUX.08.002
  category: FUNC
  feature: response_register
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: '`OUTPUT_REGISTER=1` 时，可通过插入 APB wait-state 增加一个或多个周期响应延迟， 但不得违反 APB protocol。该特性主要用于大 `NUM_SLAVES`、高频设计与 response
