  description: IP 对上游应表现为 APB Slave，提供信号：`PCLK`、`PRESETn`、`PADDR`、`PSEL`、 `PENABLE`、`PWRITE`、`PWDATA`、`PRDATA`、`PREADY`、`PSLVERR`。
  acceptance_criteria:
  - 上游接口信号完整且符合 APB 协议时序。
  trace:
    hld_ref: []
    test_ref: []
