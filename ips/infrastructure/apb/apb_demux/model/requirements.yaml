  - static
  description: IP 应提供可参数化的地址掩码数组 `ADDR_MASK[NUM_SLAVES]`，用于定义每个下游 端口的地址窗口。
  acceptance_criteria:
  - 每个下游端口可配置独立地址掩码；
  - 地址掩码数组长度与 `NUM_SLAVES` 一致；
  - 推荐内部转换为 `BASE_ADDR + ADDR_MASK` 形式进行地址译码。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.APB_DEMUX.03.001
  category: CFG
  feature: addr_remap_enable
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: IP 应提供可参数化的地址重映射使能 `ADDR_REMAP_ENABLE`，默认值为 0。开启时， 下游 `M_PADDR[i]` 为 `PADDR - BASE_ADDR[i]`（静态 offset）；关闭时
    `M_PADDR[i] = PADDR`。
  acceptance_criteria:
  - '`ADDR_REMAP_ENABLE = 0` 时 `M_PADDR[i] = PADDR`；'
  - '`ADDR_REMAP_ENABLE = 1` 时 `M_PADDR[i] = PADDR - BASE_ADDR[i]`；'
  - 地址重映射为静态配置，V1.0 不支持 runtime programmable remap。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.APB_DEMUX.03.002
  category: CFG
  feature: timeout_enable
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: IP 应提供可参数化的超时使能 `TIMEOUT_ENABLE`，默认值为 0。当 `TIMEOUT_ENABLE=1` 且下游 `PREADY` 持续为 0 达到 `TIMEOUT_CYCLES` 周期时，IP
    应终止 transaction 并向 upstream 返回 `PREADY=1, PSLVERR=1`。
  acceptance_criteria:
  - '`TIMEOUT_ENABLE=0` 时不引入有效 timeout counter 逻辑；'
  - '`TIMEOUT_ENABLE=1` 且 `TIMEOUT_CYCLES>0` 时超时行为正确。'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.APB_DEMUX.03.003
  category: CFG
  feature: timeout_cycles
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: IP 应提供可参数化的超时周期 `TIMEOUT_CYCLES`。当 `TIMEOUT_ENABLE=1` 时， `TIMEOUT_CYCLES` 必须大于 0。
  acceptance_criteria:
  - '`TIMEOUT_ENABLE=1` 时 `TIMEOUT_CYCLES > 0` 校验通过；'
  - '`TIMEOUT_CYCLES=0` 且 `TIMEOUT_ENABLE=1` 时配置校验应报错。'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.APB_DEMUX.03.004
  category: CFG
  feature: output_register
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: IP 应提供可参数化的响应寄存器使能 `OUTPUT_REGISTER`，默认值为 0。开启时可通过 插入 APB wait-state 增加响应延迟以优化 timing。
  acceptance_criteria:
  - '`OUTPUT_REGISTER=0` 时采用低延迟组合响应路径；'
  - '`OUTPUT_REGISTER=1` 时响应延迟增加但不得违反 APB protocol。'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.APB_DEMUX.04.001
  category: CFG
  feature: apb_profile
  priority: P0
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: IP 应支持 APB3 与 APB4 两种协议 profile。APB4 时额外提供 `PSTRB`、`PPROT` 信号通路；APB3 时相关逻辑应裁剪。
  acceptance_criteria:
  - APB4 profile 下 `PSTRB`/`PPROT` 正确透传；
  - APB3 profile 下无 `PSTRB`/`PPROT` 数据通路残留。
  trace:
    hld_ref: []
    test_ref: []
