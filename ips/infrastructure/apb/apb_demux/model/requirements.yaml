  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_DEMUX.08.001
  category: FUNC
  feature: response_register
  priority: P1
  status: active
  source_ref: []
  applicability: null
  verify_method:
  - simulation
  description: '`OUTPUT_REGISTER=0`（默认）时，应采用低延迟组合 response path。'
