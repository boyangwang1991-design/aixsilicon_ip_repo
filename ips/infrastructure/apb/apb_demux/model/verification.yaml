- id: FL.FUNC.APB_DEMUX.05
  name: decode_error
  description: Decode Miss 检测、错误响应、不挂死
  priority: P0
  req_ref:
  - LRS.FUNC.APB_DEMUX.05.001
  - LRS.FUNC.APB_DEMUX.05.002
  - LRS.FUNC.APB_DEMUX.05.003
