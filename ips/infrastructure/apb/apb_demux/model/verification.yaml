schema_version: '2.0'
ip_name: apb_demux
verification_level: regression
status: draft
delivery_model: parameterized
lrs_baseline: LRS-APB_DEMUX-V100
hld_baseline: HLD-APB_DEMUX-V100
lld_baseline: LLD-APB_DEMUX-V100
features:
- id: FL.INTF.APB_DEMUX.01
  name: apb_interface
  description: 上游/下游 APB 接口、APB3/APB4 profile、单时钟与复位接口
  priority: P0
  req_ref:
  - LRS.INTF.APB_DEMUX.01.001
  - LRS.INTF.APB_DEMUX.01.002
  - LRS.INTF.APB_DEMUX.02.001
  - LRS.INTF.APB_DEMUX.02.002
  - LRS.INTF.APB_DEMUX.03.001
  - LRS.INTF.APB_DEMUX.03.002
  - LRS.CFG.APB_DEMUX.04.001
  design_ref: []
  testcases:
  - id: TC.INTF.APB_DEMUX.01.001.SAN
    name: sanity_read_write
    type: directed
    coverage_type: functional
    description: 验证每个下游端口基础读写事务正确路由
    preconditions: 复位释放，NUM_SLAVES=4
    stimulus: 对每个端口发起单次读、单次写
    expected_result: 命中端口收到事务，上游收到一致 PRDATA/无错误
    timeout_policy: 10000 周期
    priority: P0
    tier: smoke
    feature_ref:
    - FL.INTF.APB_DEMUX.01
    implementation: verification/tc/tc_sanity.sv
  - id: TC.INTF.APB_DEMUX.01.002.APB4
    name: apb4_extensions
    type: directed
    coverage_type: functional
    description: 验证 APB4 profile 下 PSTRB/PPROT 透传与字节写入
    preconditions: APB_PROFILE=APB4
    stimulus: 字节/半字写（PSTRB 部分使能）+ PPROT 变化
    expected_result: PSTRB/PPROT 正确透传；APB3 下无相关通路
    timeout_policy: 20000 周期
    priority: P0
    tier: extended
    feature_ref:
    - FL.INTF.APB_DEMUX.01
    implementation: verification/tc/tc_apb4.sv
  coverage:
  - id: COV.FUNC.APB_DEMUX.09
    name: apb4_cov
    type: functional
    feature_ref:
    - FL.INTF.APB_DEMUX.01
    description: APB4 PSTRB/PPROT 活动覆盖
  assertions: []
  config_coverage: []
- id: FL.CFG.APB_DEMUX.01
  name: parameters
  description: 核心参数、地址映射数组、配置合法性校验、参数化复用
  priority: P0
  req_ref:
  - LRS.CFG.APB_DEMUX.01.001
  - LRS.CFG.APB_DEMUX.01.002
  - LRS.CFG.APB_DEMUX.01.003
  - LRS.CFG.APB_DEMUX.02.001
  - LRS.CFG.APB_DEMUX.02.002
  - LRS.CONS.APB_DEMUX.01.001
  - LRS.CONS.APB_DEMUX.01.002
  - LRS.CONS.APB_DEMUX.01.003
  - LRS.CONS.APB_DEMUX.01.004
  - LRS.CONS.APB_DEMUX.01.005
  - LRS.CONS.APB_DEMUX.01.006
  - LRS.CONS.APB_DEMUX.02.001
  - LRS.CONS.APB_DEMUX.02.002
  design_ref: []
  testcases:
  - id: TC.FUNC.APB_DEMUX.01.002.PARAM
    name: num_slaves_sweep
    type: randomized
    coverage_type: functional
    description: 验证 NUM_SLAVES 1/2/4/8/16 各参数组合下功能正确
    preconditions: NUM_SLAVES 参数扫描
    stimulus: 随机地址/数据读写序列
    expected_result: 所有参数组合下译码/路由/响应正确
    timeout_policy: 50000 周期
    priority: P0
    tier: regression
    feature_ref:
    - FL.CFG.APB_DEMUX.01
    implementation: verification/tc/tc_num_slaves_sweep.sv
  coverage:
  - id: COV.FUNC.APB_DEMUX.08
    name: num_slaves_cov
    type: functional
    feature_ref:
    - FL.CFG.APB_DEMUX.01
    description: NUM_SLAVES 参数组合覆盖（1/2/4/8/16）
  assertions: []
  config_coverage: []
- id: FL.FUNC.APB_DEMUX.01
  name: address_decode
  description: 地址译码正确性、单端口命中、对齐优化
  priority: P0
  req_ref:
  - LRS.FUNC.APB_DEMUX.01.001
  - LRS.FUNC.APB_DEMUX.01.002
  - LRS.FUNC.APB_DEMUX.01.003
  - LRS.FUNC.APB_DEMUX.01.004
  - LRS.FUNC.APB_DEMUX.01.005
  design_ref: []
  testcases:
  - id: TC.FUNC.APB_DEMUX.01.001.DEC
    name: address_decode_ports
    type: directed
    coverage_type: functional
    description: 验证地址译码：每个端口命中唯一正确端口，边界地址
    preconditions: NUM_SLAVES=4，地址窗口 0x4000_0000/0x4000_1000/0x4000_2000/0x4000_3000
    stimulus: 覆盖每个端口基地址/末尾/边界外 1 地址的读写
    expected_result: 命中唯一正确端口；边界外命中相邻端口或 decode miss
    timeout_policy: 20000 周期
    priority: P0
    tier: regression
    feature_ref:
    - FL.FUNC.APB_DEMUX.01
    implementation: verification/tc/tc_address_decode.sv
  coverage:
  - id: COV.FUNC.APB_DEMUX.01
    name: direction_cov
    type: functional
    feature_ref:
    - FL.FUNC.APB_DEMUX.01
    description: 事务方向覆盖（read/write）
  - id: COV.FUNC.APB_DEMUX.02
    name: port_cov
    type: functional
    feature_ref:
    - FL.FUNC.APB_DEMUX.01
    description: 命中端口覆盖（每个下游端口被访问）
  assertions:
  - id: ASR.APB_DEMUX.01.003
    name: decode_correct
    property: 命中一个地址区域时只能选择对应下游 port
    feature_ref:
    - FL.FUNC.APB_DEMUX.01
    description: 译码正确性
    severity: error
  config_coverage: []
- id: FL.FUNC.APB_DEMUX.02
  name: request_routing
  description: 请求信号广播、PSEL 命中门控、PENABLE 时序合规
  priority: P0
  req_ref:
  - LRS.FUNC.APB_DEMUX.02.001
  - LRS.FUNC.APB_DEMUX.02.002
  - LRS.FUNC.APB_DEMUX.02.003
  design_ref: []
  testcases:
  - id: TC.FUNC.APB_DEMUX.02.001.PSEL
    name: psel_onehot
    type: directed
    coverage_type: functional
    description: 验证任意地址访问 M_PSEL 满足 onehot0，未命中端口 PSEL=0
    preconditions: NUM_SLAVES=4
    stimulus: 随机地址序列访问
    expected_result: $onehot0(M_PSEL) 恒成立；未选中端口 PSEL=0
    timeout_policy: 20000 周期
    priority: P0
    tier: regression
    feature_ref:
    - FL.FUNC.APB_DEMUX.02
    implementation: verification/tc/tc_psel_onehot.sv
  coverage: []
  assertions:
  - id: ASR.APB_DEMUX.01.001
    name: psel_onehot0
    property: $onehot0(m_psel)
    feature_ref:
    - FL.FUNC.APB_DEMUX.02
    description: 任意时刻下游 M_PSEL 为 onehot 或全零
    severity: error
  - id: ASR.APB_DEMUX.01.005
    name: penable_psel_legal
    property: ~(M_PENABLE[i] && ~M_PSEL[i])
    feature_ref:
    - FL.FUNC.APB_DEMUX.02
    description: 禁止 PENABLE=1 且 PSEL=0 的非法下游事务
    severity: error
  config_coverage: []
- id: FL.FUNC.APB_DEMUX.03
  name: transaction_behavior
  description: APB 事务语义保持、wait-state 保持、低延迟
  priority: P0
  req_ref:
  - LRS.FUNC.APB_DEMUX.03.001
  - LRS.FUNC.APB_DEMUX.03.002
  - LRS.PERF.APB_DEMUX.01.001
  design_ref: []
  testcases:
  - id: TC.FUNC.APB_DEMUX.03.001.WAIT
    name: wait_states
    type: randomized
    coverage_type: functional
    description: 验证下游任意 wait-state 下事务完成且 selection 稳定
    preconditions: 复位释放
    stimulus: 各端口配置随机 wait，上游发起读写
    expected_result: wait 期间 PSEL/PENABLE/响应源稳定，最终完成
    timeout_policy: 30000 周期
    priority: P0
    tier: regression
    feature_ref:
    - FL.FUNC.APB_DEMUX.03
    implementation: verification/tc/tc_wait_states.sv
  coverage:
  - id: COV.FUNC.APB_DEMUX.03
    name: wait_cov
    type: functional
    feature_ref:
    - FL.FUNC.APB_DEMUX.03
    description: wait-state 周期数覆盖（0/1/多周期）
  assertions:
  - id: ASR.APB_DEMUX.01.002
    name: wait_stable
    property: ACCESS phase && PREADY==0 期间 PADDR/PWRITE/PWDATA/PSTRB/PPROT/selected_slave
      稳定
    feature_ref:
    - FL.FUNC.APB_DEMUX.03
    description: wait-state 期间请求信号与选中端口保持稳定
    severity: error
  config_coverage: []
- id: FL.FUNC.APB_DEMUX.04
