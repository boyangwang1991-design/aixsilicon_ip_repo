- id: HLD.CONSTRAINT.APB_DEMUX.SINGLE_CLK
  constraint: 所有逻辑在单一 PCLK 域，无 CDC
  status: enforced
  req_ref:
  - LRS.INTF.APB_DEMUX.03.001
  - LRS.RESET.APB_DEMUX.01.001
  applicability:
    expr: 'true'
