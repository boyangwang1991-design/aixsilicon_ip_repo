  priority: P0
  status: active
  source_ref:
  - REQ-PAR-001
  applicability:
    expr: 'true'
  verify_method:
  - static
  - simulation
  description: CSR_SIZE 固定按 `0x1000 + NUM_PORTS × 0x400` 字节推导；所有区间使用扩展位宽计算结束地址，不允许截断或回绕。
  acceptance_criteria:
  - 应满足：CSR_SIZE 固定按 `0x1000 + NUM_PORTS × 0x400` 字节推导；所有区间使用扩展位宽计算结束地址，不允许截断或回绕。
  - 对边界值、非 2 幂、零值与越界配置执行检查；合法配置接受，违反本条的配置必须失败。
  trace:
    hld_ref: []
    test_ref: []
