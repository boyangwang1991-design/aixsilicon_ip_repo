  - pop
  - push
fsms:
- id: LLD.FSM.APB_SECURE_DEMUX.TRANSACTION
  module_ref: LLD.MOD.APB_SECURE_DEMUX.FRONTEND
  encoding: binary
  states:
  - IDLE
  - LOCAL
  - REG_SETUP
  - ACCESS
  reset_state: IDLE
  illegal_state_policy: safe_state
  illegal_state_handling: 隔离输出与状态修改，等待可信复位恢复
  transitions:
  - IDLE+setup -> LOCAL|REG_SETUP|ACCESS
  - LOCAL+upstream_access -> IDLE
  - REG_SETUP -> ACCESS
  - ACCESS+downstream_ready -> IDLE
  state_bits: 3
arbiters:
- id: LLD.ARB.APB_SECURE_DEMUX.EVENTS
  module_ref: LLD.MOD.APB_SECURE_DEMUX.EVENTS
  policy: fixed_priority
  priority:
  - integrity
  - bus_failure
  - wait
  - synthetic
ordering:
- id: LLD.ORDER.APB_SECURE_DEMUX.SINGLE
  model: single_inflight_in_order_no_posted_write
  completion: LOCAL首ACCESS或下游完成，不支持取消
