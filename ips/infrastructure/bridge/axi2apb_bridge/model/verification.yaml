schema_version: '1.0'
ip_name: x2p
verification_level: smoke
status: draft
features:
- id: FL.INTF.X2P.01
  name: AXI Slave Interface
  priority: must
  category: INTF
  req_ref:
  - LRS.INTF.X2P.01.001
  - LRS.INTF.X2P.01.002
  testcases:
  - id: TC.INTF.X2P.01.01
    name: AXI Slave Interface Basic
    description: AXI Slave Interface Basic
    type: directed
    priority: P0
    tier: smoke
    preconditions: reset released
    stimulus: 单笔 AXI 读写事务（INCR len=1）
    expected_result: AXI 读写完成，BID/RID 正确
    timeout_policy: 1000 cycles
    feature_ref:
    - FL.INTF.X2P.01
  coverage: []
  assertions:
  - id: AS.INTF.X2P.01.01
    name: AXI channel alignment
    description: AWVALID 与 WVALID 独立，BVALID 与 RREADY 不冲突
    property: assert property (AWVALID 与 WVALID 独立，BVALID 与 RREADY 不冲突)
    feature_ref:
    - FL.INTF.X2P.01
- id: FL.INTF.X2P.02
  name: APB Master Interface
  priority: must
  category: INTF
  req_ref:
  - LRS.INTF.X2P.02.001
  - LRS.INTF.X2P.02.002
  testcases:
  - id: TC.INTF.X2P.02.01
    name: APB4 Master Interface
    description: APB4 Master Interface
    type: directed
    priority: P0
    tier: regression
    preconditions: APB_PROFILE=APB4
    stimulus: AXI 写读事务验证 PSTRB/PPROT
    expected_result: PSTRB/PPROT 正确，PSEL 单一
    timeout_policy: 1000 cycles
    feature_ref:
    - FL.INTF.X2P.02
  coverage:
  - id: COV.INTF.X2P.02.01
    name: APB profile coverpoint
    description: APB3/APB4 两种 profile 均被覆盖
    type: functional
    feature_ref:
    - FL.INTF.X2P.02
  assertions:
  - id: AS.INTF.X2P.02.01
    name: APB SINGLE PSEL
    description: PSEL 始终单比特 1（不出现多选择）
    property: assert property (PSEL 始终单比特 1（不出现多选择）)
    feature_ref:
    - FL.INTF.X2P.02
- id: FL.INTF.X2P.03
  name: Clock and Reset
  priority: must
  category: INTF
  req_ref:
  - LRS.INTF.X2P.03.001
  - LRS.INTF.X2P.03.002
  testcases:
  - id: TC.INTF.X2P.03.01
    name: Sync/Async Clock and Reset
    description: Sync/Async Clock and Reset
    type: reset
    priority: P0
    tier: regression
    preconditions: CLOCK_MODE=SYNC/ASYNC 参数化
    stimulus: 复位 assert/release，读写
    expected_result: 复位后无伪请求；ASYNC 单独复位正常
    timeout_policy: 2000 cycles
    feature_ref:
    - FL.INTF.X2P.03
  coverage: []
  assertions:
  - id: AS.INTF.X2P.03.01
    name: Reset no phantom
    description: 复位后无 BVALID/RVALID/PSEL/PENABLE（无伪请求）
    property: assert property (复位后无 BVALID/RVALID/PSEL/PENABLE（无伪请求）)
    feature_ref:
    - FL.INTF.X2P.03
- id: FL.FUNC.X2P.01
  name: AW/W Association
  priority: must
  category: FUNC
  req_ref:
  - LRS.FUNC.X2P.01.001
  - LRS.FUNC.X2P.01.002
  testcases:
  - id: TC.FUNC.X2P.01.01
    name: AW/W Association Timing
    description: AW/W Association Timing
    type: algorithm
    priority: P0
    tier: regression
    preconditions: AXI4, Depth=4
    stimulus: AW before W / W before AW / same cycle / 任意间隔
    expected_result: 数据与地址正确配对，WLAST 正确
    timeout_policy: 2000 cycles
    feature_ref:
    - FL.FUNC.X2P.01
  coverage: []
  assertions:
  - id: AS.FUNC.X2P.01.01
    name: AW/W pairing data integrity
    description: 配对事务数据不被丢失/重复（WLAST 对齐）
    property: assert property (配对事务数据不被丢失/重复（WLAST 对齐）)
    feature_ref:
    - FL.FUNC.X2P.01
- id: FL.FUNC.X2P.02
  name: Burst Conversion
  priority: must
  category: FUNC
  req_ref:
  - LRS.FUNC.X2P.02.001
  - LRS.FUNC.X2P.02.002
  - LRS.FUNC.X2P.02.003
  - LRS.FUNC.X2P.02.004
  testcases:
  - id: TC.FUNC.X2P.02.01
    name: INCR and FIXED Burst
    description: INCR and FIXED Burst
    type: directed
    priority: P0
    tier: regression
    preconditions: AXI4, full burst
    stimulus: INCR len=1..16、FIXED len=1..16
    expected_result: 地址递增/不变正确，全部 beat 返回
    timeout_policy: 4000 cycles
    feature_ref:
    - FL.FUNC.X2P.02
  - id: TC.FUNC.X2P.02.02
    name: WRAP Burst
    description: WRAP Burst
    type: algorithm
    priority: P0
    tier: regression
    preconditions: AXI4, WRAP len=4/8/16
    stimulus: WRAP 回绕地址验证
    expected_result: 回绕点正确，无越界
    timeout_policy: 4000 cycles
    feature_ref:
    - FL.FUNC.X2P.02
  - id: TC.FUNC.X2P.02.03
    name: 4KB Boundary
    description: 4KB Boundary
    type: boundary
    priority: P0
    tier: extended
    preconditions: AXI4
    stimulus: 地址跨越 4KB 边界（边界前后）
    expected_result: burst 不跨 4KB，邻近地址正确
    timeout_policy: 4000 cycles
    feature_ref:
    - FL.FUNC.X2P.02
  coverage:
  - id: COV.FUNC.X2P.02.01
    name: Burst type/len coverpoint
    description: INCR/FIXED/WRAP × len 组合覆盖
    type: functional
    feature_ref:
    - FL.FUNC.X2P.02
  assertions:
  - id: AS.FUNC.X2P.02.01
    name: Burst address monotonic/wrap
    description: INCR 地址正确递增、FIXED 不变、WRAP 回绕点正确
    property: assert property (INCR 地址正确递增、FIXED 不变、WRAP 回绕点正确)
    feature_ref:
    - FL.FUNC.X2P.02
- id: FL.FUNC.X2P.03
  name: Narrow / Width Conversion
  priority: must
  category: FUNC
  req_ref:
  - LRS.FUNC.X2P.03.001
  - LRS.FUNC.X2P.03.002
  - LRS.FUNC.X2P.03.003
  - LRS.FUNC.X2P.03.004
  - LRS.FUNC.X2P.03.005
  - LRS.FUNC.X2P.03.006
  testcases:
  - id: TC.FUNC.X2P.03.01
    name: Narrow and Width Conversion
    description: Narrow and Width Conversion
    type: algorithm
    priority: P0
    tier: regression
    preconditions: AXI64/APB32, AXI128/APB32, AXI32/APB64 参数化
    stimulus: 各宽度组合读写 + narrow（AxSIZE<data width）+ APB3 partial write
    expected_result: 拆解/组装/STRB 正确；APB3 partial write 返回 SLVERR
    timeout_policy: 4000 cycles
    feature_ref:
    - FL.FUNC.X2P.03
  - id: TC.FUNC.X2P.03.02
    name: Read Data Assembly and Error Aggregation
    description: Read Data Assembly and Error Aggregation
    type: algorithm
    priority: P0
    tier: regression
    preconditions: AXI64->APB32
    stimulus: 拆分读 + 注入子传输出错
    expected_result: RDATA 拼接正确；子传输出错 RRESP=SLVERR
    timeout_policy: 3000 cycles
    feature_ref:
    - FL.FUNC.X2P.03
  coverage:
  - id: COV.FUNC.X2P.03.01
    name: Width combo coverpoint
    description: AXI32/64/128 × APB32/64 覆盖
    type: functional
    feature_ref:
    - FL.FUNC.X2P.03
  assertions:
  - id: AS.FUNC.X2P.03.01
    name: Width conversion correctness
    description: PSTRB 与有效 lane 一致；R 仅在完整 beat 后 valid
    property: assert property (PSTRB 与有效 lane 一致；R 仅在完整 beat 后 valid)
    feature_ref:
    - FL.FUNC.X2P.03
- id: FL.FUNC.X2P.04
  name: Request Buffering / Outstanding
  priority: must
  category: FUNC
  req_ref:
  - LRS.FUNC.X2P.04.001
  - LRS.FUNC.X2P.04.002
  testcases:
  - id: TC.FUNC.X2P.04.01
    name: Buffer Depth and Outstanding
    description: Buffer Depth and Outstanding
    type: boundary
    priority: P0
    tier: regression
    preconditions: Depth=1/2/4/8 参数化
    stimulus: 填满队列、RREADY/BREADY 背压、多 outstanding 读写
    expected_result: 无溢出/下溢，READY 反压正确，多 outstanding 完成
    timeout_policy: 5000 cycles
    feature_ref:
    - FL.FUNC.X2P.04
  coverage:
  - id: COV.FUNC.X2P.04.01
    name: Buffer depth coverpoint
    description: depth 1/2/4/8 与满标志覆盖
    type: functional
    feature_ref:
    - FL.FUNC.X2P.04
  assertions:
  - id: AS.FUNC.X2P.04.01
    name: No overflow underflow
    description: 队列在深度内操作，READY 满时反压
    property: assert property (队列在深度内操作，READY 满时反压)
    feature_ref:
    - FL.FUNC.X2P.04
