    expected_result: 无饥饿（RR），Beat 内 sub-transfer 原子
    timeout_policy: 5000 cycles
    feature_ref:
    - FL.FUNC.X2P.05
  coverage:
  - id: COV.FUNC.X2P.05.01
    name: Arb policy/granularity coverpoint
    description: 3 策略 × 2 粒度覆盖
    type: functional
    feature_ref:
    - FL.FUNC.X2P.05
  assertions:
  - id: AS.FUNC.X2P.05.01
    name: Beat atomicity
    description: 同一 AXI Beat 的子传输不被打断（原子性）
    property: assert property (同一 AXI Beat 的子传输不被打断（原子性）)
    feature_ref:
    - FL.FUNC.X2P.05
