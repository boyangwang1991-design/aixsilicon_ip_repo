schema_version: '1.0'
owner: rtl-team
ip_name: x2p
requirements:
- id: LRS.INTF.X2P.01.001
  title: AXI 从接口提供
  category: INTF
  feature: axi_slave_interface
  priority: must
  description: '1. X2P 应提供一个 AXI Slave 接口。

    2. AXI4 Profile 应支持五个标准 Channel：AW、W、B、AR、R。

    3. 接口位宽由 AXI_ADDR_WIDTH（地址）、AXI_DATA_WIDTH（数据）、AXI_ID_WIDTH（ID）参数决定。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.X2P.01.002
  title: AXI4-Lite 自动裁剪
  category: INTF
  feature: axi_slave_interface
  priority: must
  description: '1. AXI4-Lite Profile 应自动裁剪 AXI ID、burst length、burst type、WLAST/RLAST 及 AXI4-only 功能。

    2. AXI4-Lite 应按协议固定 AxLEN=0、AxBURST=FIXED、AxSIZE=数据位宽对应值。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.X2P.02.001
  title: APB 主接口提供
  category: INTF
  feature: apb_master_interface
  priority: must
  description: '1. X2P 应提供一个 APB Master 接口，至少包含：PADDR、PSEL、PENABLE、PWRITE、PWDATA、PRDATA、PREADY、PSLVERR。

    2. APB4 Profile 应额外支持 PSTRB、PPROT。

    3. X2P 应输出单一 PSEL，不得生成 PSEL[N:0] 多 Slave Select。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.X2P.02.002
  title: 保护属性转换
  category: INTF
  feature: apb_master_interface
  priority: should
  description: '1. APB4 Profile 应把 AXI AWPROT/ARPROT 转换为 PPROT 并保持协议属性语义（Privileged/Secure/Instruction）。

    2. APB3 Profile 不输出 PPROT。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.X2P.03.001
  title: 同步/异步时钟模式
  category: INTF
  feature: clock_reset
  priority: must
  description: '1. X2P 应支持 SYNC（ACLK 与 PCLK 同域或确定同步关系）与 ASYNC（完全异步）两种时钟模式。

    2. ASYNC 模式下不得对两时钟的频率比、相位、启动顺序做任何假设。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.X2P.03.002
  title: 复位语义
  category: INTF
  feature: clock_reset
  priority: must
  description: '1. 复位后 PSEL=0、PENABLE=0、BVALID=0、RVALID=0，并清除内部 pending state。

    2. 复位期间及复位后不得产生新的 APB access，不得恢复执行复位前未完成的 transaction。

    3. ASYNC 模式下 ACLK/PCLK 复位可独立 assertion，reset release 不得产生伪 request/response。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.01.001
  title: AW/W 独立握手
  category: FUNC
  feature: aw_w_association
  priority: must
  description: '1. AW 和 W Channel 应独立握手，支持 AW before W、W before AW、AW/W 同周期以及任意 AW-W 间隔。

    2. X2P 应保存已接受但尚未与 AW 配对的 W data，以及已接受但尚未与 W 配对的 AW transaction。

    3. 不得假设 AWVALID 和 WVALID 同周期出现。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.01.002
  title: AXI Write Ordering
  category: FUNC
  feature: aw_w_association
  priority: must
  description: '1. 完整 AXI4 Profile 应按照 AXI Write Ordering Rule 正确关联 AW transaction 与 W data sequence。

    2. 一个 AW Descriptor 对应 AWLEN+1 个 W Beats，W 数据顺序与 AW 顺序一致。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.02.001
  title: INCR Burst
  category: FUNC
  feature: burst_conversion
  priority: must
  description: '1. X2P 应完整支持 AXI INCR Burst，下一 AXI Beat 地址按 AXI 规范计算。

    2. 地址计算必须考虑 AxSIZE、当前地址、数据总线宽度与 burst length。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.02.002
  title: FIXED Burst
  category: FUNC
  feature: burst_conversion
  priority: must
  description: '1. X2P 应完整支持 FIXED Burst，所有 AXI Beat 使用同一 AXI Transfer Address。

    2. 每个 AXI Beat 应作为独立 transaction data 被转换。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.02.003
  title: WRAP Burst
  category: FUNC
  feature: burst_conversion
  priority: must
  description: '1. X2P 应完整支持 WRAP Burst。

    2. 应按照 AxLEN、AxSIZE、起始地址与 wrap boundary 正确计算 Wrap Address。

    3. 当地址达到 Wrap Upper Boundary 后，下一 Beat 应回绕至 Wrap Lower Boundary。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.02.004
  title: Burst 4KB Boundary
  category: FUNC
  feature: burst_conversion
  priority: must
  description: '1. X2P 应遵守 AXI Burst 不跨越 4KB Boundary 的要求。

    2. 对于非法输入，不得产生超出合法 AXI Burst 地址范围的 APB transaction。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.03.001
  title: Narrow Transfer
  category: FUNC
  feature: narrow_width_conversion
  priority: must
  description: '1. X2P 应支持 AXI Narrow Transfer（如 AXI_DATA_WIDTH=64、AxSIZE=2 表示传输 4 Bytes）。

    2. 应基于 AxADDR、AxSIZE、WSTRB 计算有效 Byte Lane。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.03.002
  title: Wide-to-Narrow Conversion
  category: FUNC
  feature: narrow_width_conversion
  priority: must
  description: '1. AXI_DATA_WIDTH > APB_DATA_WIDTH 时，一个 AXI Beat 应拆解为多个 APB Sub-Transfers（如 AXI64→APB32 拆为两个）。

    2. 每个 Sub-Transfer 应正确生成 PADDR、PWDATA、PSTRB。

    3. 无需访问的 Byte Lane 不得产生无意义的 APB Write。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.03.003
  title: Narrow-to-Wide Conversion
  category: FUNC
  feature: narrow_width_conversion
  priority: must
  description: '1. AXI_DATA_WIDTH < APB_DATA_WIDTH 时，应把 AXI transaction 映射到正确的 APB Byte Lane。

    2. APB4 Write 应通过 PSTRB 标识有效 Byte Lane。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.03.004
  title: Read Data Assembly
  category: FUNC
  feature: narrow_width_conversion
  priority: must
  description: '1. Wide AXI Read 被拆分多个 APB transfer 时，应收集所有必要 PRDATA。

    2. 只有形成完整 AXI Read Beat 后才能 RVALID=1。

    3. 任一 APB Sub-Transfer 出错时，该 AXI Beat 的 RRESP 应反映错误。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.03.005
  title: Write Strobe 转换
  category: FUNC
  feature: narrow_width_conversion
  priority: must
  description: '1. APB4 Profile 应支持 WSTRB→PSTRB 语义转换。

    2. PSTRB 应准确反映当前 APB Sub-Transfer 的有效 Byte Lane。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.03.006
  title: APB3 Partial Write
  category: FUNC
  feature: narrow_width_conversion
  priority: must
  description: '1. 由于 APB3 不提供 PSTRB，不能表示为完整 APB Word Write 的 APB3 Write 应返回 AXI SLVERR。

    2. V1.0 不得通过自动 Read-Modify-Write 修改 APB3 Write 语义。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.04.001
  title: 可配置 Request Buffer
  category: FUNC
  feature: request_buffering
  priority: must
  description: '1. X2P 应具有可配置 Request Buffer，分别提供 READ_REQUEST_DEPTH / WRITE_REQUEST_DEPTH。

    2. Depth 应至少支持 1/2/4/8。

    3. Buffer Full 时应通过 AXI READY 合法产生 Backpressure。

    4. 禁止 Request Overflow / Underflow。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.04.002
  title: Outstanding
  category: FUNC
  feature: request_buffering
  priority: must
  description: '1. 完整 AXI4 Profile 应支持多个 Pending Read/Write Transactions。

    2. 最大支持数量通过参数配置。

    3. 每笔 Pending Transaction 应保存完成 response 所需 metadata（ID、address、burst 信息、transfer size、response state）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.05.001
  title: 仲裁策略
  category: FUNC
  feature: read_write_arbitration
  priority: must
  description: '1. Read Request 和 Write Request 共享单一 APB Master，应进行仲裁。

    2. 应支持 ROUND_ROBIN / READ_PRIORITY / WRITE_PRIORITY 三种策略，默认 ROUND_ROBIN。

    3. ROUND_ROBIN 模式不得发生永久 Read 或 Write starvation。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.05.002
  title: 仲裁粒度
  category: FUNC
  feature: read_write_arbitration
  priority: must
  description: '1. 仲裁粒度应至少支持 AXI_TRANSACTION / AXI_BEAT，默认 AXI_BEAT。

    2. 实现 Beat-Level Arbitration 时不得破坏同一 AXI Transaction 的协议 ordering。

    3. 一个 AXI Beat 的 APB Sub-Transfers 必须作为不可切分的原子调度单元。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.06.001
  title: 错误映射
  category: FUNC
  feature: response_error
  priority: must
  description: '1. 正常 APB Completion（PSLVERR=0）应转换为 AXI OKAY。

    2. APB PSLVERR=1 应转换为 AXI SLVERR。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.06.002
  title: 输出响应 Backpressure
  category: FUNC
  feature: response_error
  priority: must
  description: '1. RVALID=1、RREADY=0 时，R channel outputs 必须稳定。

    2. BVALID=1、BREADY=0 时，B channel outputs 必须稳定。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.06.003
  title: Write Error Aggregation
  category: FUNC
  feature: response_error
  priority: must
  description: '1. 一个 AXI Write Transaction 被拆成多个 APB transfer 时，只要任一 APB transfer 出错，最终 BRESP != OKAY。

    2. 已经完成的 APB Write 不执行 rollback。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.06.004
  title: AXI ID 保真
  category: FUNC
  feature: response_error
  priority: must
  description: '1. AXI4 Profile 应正确保存 AWID/ARID，并正确产生 BID/RID。

    2. 不得产生 ID mismatch。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.06.005
  title: Unsupported / Invalid Transaction
  category: FUNC
  feature: response_error
  priority: must
  description: '1. 不能被当前 parameter configuration 正确执行的 AXI transaction 应返回明确错误。

    2. 不得 silently truncate / realign / discard data / alter transaction semantics。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.07.001
  title: APB Timeout
  category: FUNC
  feature: apb_timeout
  priority: must
  description: '1. V1.0 应支持 APB Timeout，通过 TIMEOUT_ENABLE 与 TIMEOUT_CYCLES 配置。

    2. 当 PSEL=1、PENABLE=1、PREADY=0 持续达到 TIMEOUT_CYCLES 时产生 timeout。

    3. Timeout 对应 AXI response 为 SLVERR。

    4. Timeout 后应结束当前 APB Master transaction，恢复至可继续处理后续 request 的状态。

    5. Timeout 状态不得导致 APB FSM 永久锁死。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.08.001
  title: APB Transfer 流程
  category: FUNC
  feature: apb_transaction
  priority: must
  description: '1. 每次 APB access 应按照 SETUP → ACCESS 执行。

    2. SETUP phase：PSEL=1、PENABLE=0。

    3. ACCESS phase：PSEL=1、PENABLE=1。

    4. 只有当 PREADY=1 时 APB Transfer 才能结束。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.08.002
  title: Wait-State
  category: FUNC
  feature: apb_transaction
  priority: must
  description: '1. PREADY=0 时 X2P 应保持当前 APB ACCESS phase。

    2. Wait-State 期间应保持 PADDR/PSEL/PENABLE/PWRITE/PWDATA/PSTRB/PPROT 稳定，直到 transfer completion 或 timeout。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.09.001
  title: Register Stage
  category: FUNC
  feature: regslice_ordering
  priority: should
  description: '1. 应支持可配置 Register Stage，至少独立配置 AXI_INPUT_REG / AXI_OUTPUT_REG / APB_OUTPUT_REG。

    2. Register Stage 启用与否不得改变 transaction 功能语义。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.09.002
  title: Ordering
  category: FUNC
  feature: regslice_ordering
  priority: must
  description: '1. X2P 应遵守 AXI Ordering Requirements。

    2. 相同 AXI ID 的 transaction 应保持协议要求的 response ordering。

    3. APB transaction 本身不得发生 out-of-order completion。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.10.001
  title: CDC Transaction Semantics
  category: FUNC
  feature: cdc_async
  priority: must
  description: '1. CDC 应在 Transaction Level 完成，不得直接将 PSEL/PENABLE/PREADY 作为 AXI/APB 两域之间的 CDC handshake。

    2. AXI Domain → APB Domain 应传递完整 request 信息（address、read/write、write data、write strobe、protection、transaction metadata）。

    3. APB Domain → AXI Domain 应返回 read data、completion、error、transaction metadata。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.10.002
  title: CDC Buffering
  category: FUNC
  feature: cdc_async
  priority: must
  description: '1. ASYNC Profile 应具备 request-side 与 response-side CDC buffering。

    2. CDC buffer 深度应与 supported outstanding configuration 协同，不得产生 transaction loss。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.X2P.10.003
  title: Reset 后无伪请求
  category: FUNC
  feature: cdc_async
  priority: must
  description: '1. Reset release sequencing 不得产生伪 request 或伪 response。

    2. 任一 domain reset 后，不得误执行 reset 前未确认完整跨域的 transaction。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.X2P.01.001
  title: 无多余 idle
  category: PERF
  feature: performance
  priority: should
  description: '1. 在 PREADY 始终为 1 时，X2P 不得人为插入不必要的 APB idle cycle。

    2. 若存在下一 request，APB Engine 应实现合法的 back-to-back transfer（SETUP0-ACCESS0-SETUP1-ACCESS1）。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.X2P.01.002
  title: 请求缓冲解耦
  category: PERF
  feature: performance
  priority: should
  description: '1. Request Buffer 应允许 AXI request acceptance 与 APB execution decouple。

    2. ASYNC Profile 下，AXI 不得因为 APB clock 低频而要求 clock-level synchronous handshake。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.X2P.02.001
  title: 参数裁剪
  category: PERF
  feature: resource
  priority: should
  description: '1. 参数关闭的功能应尽可能被综合裁剪（PPA 需求）。

    2. AXI4-Lite 小配置不应保留 AXI ID logic、Burst engine、WRAP engine、不必要的 Outstanding tracking。

    3. SYNC Mode 不应保留 ASYNC CDC datapath。

    4. 同宽配置不应保留 Width Split / Merge datapath。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.X2P.03.001
  title: 支持宽度组合
  category: PERF
  feature: performance
  priority: must
  description: '1. 至少支持 AXI_DATA_WIDTH = 32/64/128，APB_DATA_WIDTH = 32/64。

    2. 支持合法的 Power-of-Two width ratio（含相等、宽到窄、窄到宽）。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.X2P.01.001
  title: 拓扑固定
  category: CONS
  feature: topology
  priority: must
  description: '1. X2P 拓扑固定为 1 AXI Slave → 1 APB Master。

    2. X2P 不负责 APB 多 Slave 地址译码及分发。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.X2P.02.001
  title: 参数合法性
  category: CONS
  feature: parameter_legality
  priority: must
  description: '1. AXI_PROFILE ∈ {AXI4, AXI4_LITE}；APB_PROFILE ∈ {APB3, APB4}。

    2. READ/WRITE_REQUEST_DEPTH ∈ {1, 2, 4, 8}。

    3. AXI_DATA_WIDTH ∈ {32, 64, 128}；APB_DATA_WIDTH ∈ {32, 64}；宽度比必须为合法 Power-of-Two 且 AXI≥APB 或 AXI<APB 均允许。

    4. ARB_POLICY ∈ {ROUND_ROBIN, READ_PRIORITY, WRITE_PRIORITY}；ARB_GRANULARITY ∈ {AXI_BEAT, AXI_TRANSACTION}。

    5. TIMEOUT_ENABLE ∈ {0, 1}；TIMEOUT_CYCLES ≥ 1。

    6. CLOCK_MODE ∈ {SYNC, ASYNC}。

    7. AXI4-Lite 下不支持 outstanding>1 语义（按单事务模型处理）。

    8. WRAP Burst 只允许 AXI4（AXI4-Lite 不支持 WRAP）。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.X2P.03.001
  title: 不支持场景
  category: CONS
  feature: unsupported_scenario
  priority: should
  description: 1. X2P V1.0 不支持：APB multi-slave decode、APB interconnect、多 APB Master output、AXI3、ACE、CHI、security firewall、power
    isolation、level shifter、clock generation、interrupt aggregation。
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
