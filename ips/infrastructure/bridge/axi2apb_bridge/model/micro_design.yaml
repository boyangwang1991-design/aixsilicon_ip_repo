schema_version: '1.0'
ip_name: x2p
modules:
- id: LLD.MOD.X2P.FE
  hld_ref: HLD.MOD.L1.X2P.FE
  fsm: []
  datapath: {}
  cdc: []
  reset:
  - signal: rst_axi_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  interrupt: []
- id: LLD.MOD.X2P.QB
  hld_ref: HLD.MOD.L1.X2P.QB
  fsm: []
  datapath: {}
  cdc: []
  reset:
  - signal: rst_axi_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  interrupt: []
- id: LLD.MOD.X2P.SCH
  hld_ref: HLD.MOD.L1.X2P.SCH
  fsm:
  - id: LLD.FSM.X2P.SCH.ARB
    name: Arbitration FSM
    encoding_style: auto
    reset_state: IDLE
    states:
    - name: IDLE
    - name: GRANT_RD
    - name: GRANT_WR
    transitions:
    - from: IDLE
      to: GRANT_RD
      condition: rd_avail && arb_select==RD
    - from: IDLE
      to: GRANT_WR
      condition: wr_avail && arb_select==WR
    - from: GRANT_RD
      to: GRANT_WR
      condition: beat_atomic_done && policy_rr && wr_avail
    - from: GRANT_WR
      to: GRANT_RD
      condition: beat_atomic_done && policy_rr && rd_avail
    illegal_state_handling: return_to_reset
  datapath:
    pipeline_stages: []
    backpressure:
      type: valid_ready
      mechanism: ''
  cdc: []
  reset:
  - signal: rst_axi_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  interrupt: []
- id: LLD.MOD.X2P.TE
  hld_ref: HLD.MOD.L1.X2P.TE
  fsm:
  - id: LLD.FSM.X2P.TE.BURST
    name: Burst FSM
    encoding_style: auto
    reset_state: IDLE
    states:
    - name: IDLE
    - name: ISSUE_SUB
    - name: WAIT_RSP
    - name: NEXT_BEAT
    transitions:
    - from: IDLE
      to: ISSUE_SUB
      condition: req_valid
    - from: ISSUE_SUB
      to: WAIT_RSP
      condition: apb_req_ready
    - from: WAIT_RSP
      to: NEXT_BEAT
      condition: apb_rsp_valid
    - from: NEXT_BEAT
      to: IDLE
      condition: last_beat_done || txn_done
    illegal_state_handling: return_to_reset
  datapath: {}
  cdc: []
  reset:
  - signal: rst_axi_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  interrupt: []
- id: LLD.MOD.X2P.CDC
  hld_ref: HLD.MOD.L1.X2P.CDC
  fsm: []
  datapath:
    pipeline_stages: []
    backpressure:
      type: valid_ready
      mechanism: ''
  cdc:
  - signal: req_fifo
    source_domain: clk_axi
    target_domain: clk_apb
    strategy: async_fifo
  - signal: rsp_fifo
    source_domain: clk_apb
    target_domain: clk_axi
    strategy: async_fifo
  reset:
  - signal: rst_axi_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  - signal: rst_apb_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  interrupt: []
- id: LLD.MOD.X2P.APB
  hld_ref: HLD.MOD.L1.X2P.APB
  fsm:
  - id: LLD.FSM.X2P.APB.PROTO
    name: APB Protocol FSM
    encoding_style: auto
    reset_state: IDLE
    states:
    - name: IDLE
    - name: SETUP
    - name: ACCESS
    - name: TIMEOUT
    transitions:
    - from: IDLE
      to: SETUP
      condition: req_avail
    - from: SETUP
      to: ACCESS
      condition: always_1_cycle
    - from: ACCESS
      to: IDLE
      condition: PREADY=1
    - from: ACCESS
      to: TIMEOUT
      condition: timeout_count==TIMEOUT_CYCLES
    - from: TIMEOUT
      to: IDLE
      condition: rsp_sent
    illegal_state_handling: return_to_reset
  datapath:
    pipeline_stages: []
    backpressure:
      type: valid_ready
      mechanism: ''
  cdc: []
  reset:
  - signal: rst_apb_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  interrupt: []
- id: LLD.MOD.X2P.RSP
  hld_ref: HLD.MOD.L1.X2P.RSP
  fsm: []
  datapath: {}
  cdc: []
  reset:
  - signal: rst_axi_n
    polarity: active_low
    reset_value: 0
    reset_type: async_assert_sync_release
  interrupt: []
