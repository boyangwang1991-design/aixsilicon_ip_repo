schema_version: '1.0'
owner: rtl-team
ip_name: apb_cdc_bridge
requirements:
- id: LRS.INTF.APB_CDC_BRIDGE.01.001
  title: 上游 APB 接口提供
  category: INTF
  feature: upstream_apb_interface
  priority: must
  description: '1. Bridge 应提供一个上游 APB Slave 接口，包含：`s_pclk`、`s_presetn`、`s_psel`、`s_penable`、`s_paddr`、`s_pwrite`、`s_pwdata`、`s_prdata`、`s_pready`、`s_pslverr`。

    2. 上游接口为单 PSEL 从端口，不接受多 Slave Select。

    3. 地址位宽由 `ADDR_WIDTH` 参数决定，数据位宽由 `DATA_WIDTH` 参数决定。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.APB_CDC_BRIDGE.01.002
  title: APB4 扩展字段
  category: INTF
  feature: upstream_apb_interface
  priority: should
  description: '1. 当 `APB_PROFILE = APB4` 时，上游接口应额外提供 `s_pstrb`、`s_pprot`。

    2. 当 `APB_PROFILE = APB3` 时，`PSTRB`/`PPROT` 相关逻辑应裁剪，不保留无意义数据通路。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.APB_CDC_BRIDGE.02.001
  title: 下游 APB 接口提供
  category: INTF
  feature: downstream_apb_interface
  priority: must
  description: '1. Bridge 应提供一个下游 APB Master 接口，包含：`m_pclk`、`m_presetn`、`m_psel`、`m_penable`、`m_paddr`、`m_pwrite`、`m_pwdata`、`m_prdata`、`m_pready`、`m_pslverr`。

    2. 下游接口为单 PSEL 主端口。

    3. 下游接口在 IDLE 时 `m_psel = 0`、`m_penable = 0`，输出保持稳定。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.APB_CDC_BRIDGE.02.002
  title: APB4 下游扩展字段
  category: INTF
  feature: downstream_apb_interface
  priority: should
  description: '1. 当 `APB_PROFILE = APB4` 时，下游接口应额外提供 `m_pstrb`、`m_pprot`。

    2. 下游 `PSTRB`/`PPROT` 应与上游捕获的 payload 一致。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.APB_CDC_BRIDGE.03.001
  title: 双独立时钟域
  category: INTF
  feature: clock_reset
  priority: must
  description: '1. Bridge 应支持 `s_pclk` 与 `m_pclk` 两个独立的时钟域输入。

    2. 两个时钟可完全异步（无固定频率/相位关系），可快→慢、慢→快、同频异相、同源同步异频。

    3. 不得对两时钟的频率比、相位、启动顺序做任何假设（ASYNC_SAFE 默认模式）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.APB_CDC_BRIDGE.03.002
  title: 独立复位
  category: INTF
  feature: clock_reset
  priority: must
  description: '1. Bridge 应支持独立复位 `s_presetn`、`m_presetn`，可在任意一侧独立 assert。

    2. 复位风格推荐 async assert / sync deassert（`RESET_MODE = ASYNC`）。

    3. 任一侧 reset 发生时，跨域进行中的事务可被 abort；reset 后不得把 reset 前的

    request/response toggle、payload、FIFO entry 识别为新事务。

    4. 不得要求 source reset 先于 destination reset 的固定顺序。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.01.001
  title: 上游事务捕获
  category: FUNC
  feature: upstream_capture
  priority: must
  description: '1. Bridge 仅在合法 APB transfer 下接受事务：`s_psel = 1 && s_penable = 1`。

    2. 捕获时应锁存 Request payload：`PADDR`、`PWRITE`、`PWDATA`、`PSTRB`（APB4）、`PPROT`（APB4）。

    3. 仅对当前 profile 有效字段进行存储。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.01.002
  title: 单事务语义
  category: FUNC
  feature: upstream_capture
  priority: must
  description: '1. V1.0 任一时刻最多允许一个跨 Bridge 的 APB transaction active。

    2. 上游 `s_pready = 1` 只能在以下两类情况出现：下游 APB transaction 已完成；

    或 Bridge 本地已确定错误且无需访问下游。

    3. 不得在下游尚未完成时提前返回成功（No spurious PREADY）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.01.003
  title: 请求负载稳定
  category: FUNC
  feature: upstream_capture
  priority: must
  description: '1. Request payload 跨域期间必须保持稳定，直至下游安全捕获。

    2. 禁止将 multi-bit bus 每 bit 独立双触发器同步。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.02.001
  title: 下游 SETUP/ACCESS
  category: FUNC
  feature: downstream_regeneration
  priority: must
  description: '1. Bridge 必须在 m_pclk 域重新生成合法 APB transaction，状态流为 IDLE → SETUP → ACCESS → COMPLETE。

    2. SETUP 阶段必须先产生 `m_psel = 1, m_penable = 0`。

    3. 下一 m_pclk 周期进入 ACCESS 阶段 `m_psel = 1, m_penable = 1`，并保持直到 `m_pready = 1`。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.02.002
  title: 下游等待状态
  category: FUNC
  feature: downstream_regeneration
  priority: must
  description: '1. 当 `m_pready = 0` 时，下游必须保持 `m_psel`、`m_penable`、`m_paddr`、`m_pwrite`、`m_pwdata`、`m_pstrb`、`m_pprot` 稳定。

    2. 支持任意数量的 wait state。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.02.003
  title: 下游完成捕获
  category: FUNC
  feature: downstream_regeneration
  priority: must
  description: '1. 当 `m_psel && m_penable && m_pready` 时，下游 transaction 完成。

    2. Read transaction 必须捕获 `m_prdata` 并返回 `s_prdata`。

    3. 必须捕获 `m_pslverr` 并返回 `s_pslverr`。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.03.001
  title: 握手式跨域
  category: FUNC
  feature: handshake_profile
  priority: must
  description: '1. HANDSHAKE 应作为 V1.0 默认推荐实现，用于 APB register access、low throughput、area-first、power-first。

    2. 采用 bundled-data handshake：Request payload 打包后由单一 Req Toggle 经 `SYNC_STAGES >= 2` 级同步器跨域。

    3. Response payload 由 Rsp Toggle 经同步器返回源域。

    4. Request payload 在 destination acknowledgement 前不得变化；Response payload 在 source acknowledgement 前不得变化。

    5. 典型结构为：Request Latch → Req Toggle → 2FF Sync → Detect → Execute APB → Response Latch → Rsp Toggle → 2FF Sync → Return
    PREADY/PRDATA/PSLVERR。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.03.002
  title: 同步器级数
  category: FUNC
  feature: handshake_profile
  priority: must
  description: '1. 跨域 handshake control 必须通过 `SYNC_STAGES >= 2` 级同步器。

    2. 默认 `SYNC_STAGES = 2`；高可靠场景可配置为 3。

    3. 增加级数必须明确 MTBF ↑、Area ↑、Latency ↑。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.04.001
  title: 异步 FIFO 实现
  category: FUNC
  feature: async_fifo_profile
  priority: should
  description: '1. FIFO profile 用于需要更强 decoupling 的场景；推荐 `REQ_DEPTH = 1/2`、`RSP_DEPTH = 1/2`。

    2. Request payload 打包为 `{PADDR, PWRITE, PWDATA, PSTRB, PPROT}` 进入 CDC FIFO。

    3. Response payload 打包为 `{PRDATA, PSLVERR}`。

    4. 即使 FIFO depth > 1，V1.0 默认不得改变上游 APB single-transfer completion 语义。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.04.002
  title: CDC 实现二选一隔离
  category: FUNC
  feature: cdc_impl_isolation
  priority: must
  description: '1. `CDC_IMPL` 参数必须是二选一：`HANDSHAKE` 或 `ASYNC_FIFO`，两种实现不得同时例化。

    2. 两种实现对外暴露一致的 `req_channel`/`rsp_channel` 接口契约，源/目的 FSM 不感知底层实现。

    3. 两种实现均保持单事务、bundled-data、`SYNC_STAGES` 语义，不得因实现选择改变 APB 协议行为。

    4. 未选中的实现不得保留无意义数据通路（综合/面积证据）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.05.001
  title: 快慢上游等待
  category: FUNC
  feature: fast_to_slow
  priority: must
  description: '1. 当 `s_pclk >> m_pclk` 时，上游必须保持 `s_pready = 0` 直到下游事务完成（合法 wait-state）。

    2. Request 必须在 Source Domain 被锁存，避免长时间依赖上游保持组合数据。

    3. fast→slow APB 场景默认优先 HANDSHAKE 实现。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.06.001
  title: 慢快低延迟
  category: FUNC
  feature: slow_to_fast
  priority: must
  description: '1. 当 `s_pclk << m_pclk` 时，应优先减少 synchronizer chain latency、extra buffering、unnecessary FSM states。

    2. 默认 `REQ_DEPTH = 1`、`RSP_DEPTH = 1` 即可。

    3. 下游应快速完成 SETUP/ACCESS。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.07.001
  title: 同步异频资格
  category: FUNC
  feature: sync_ratio
  priority: should
  description: '1. 只有 clocks related、frequency ratio fixed、phase relation timing-analyzable、constraints available 时才允许启用专用
    synchronous implementation。

    2. Bridge 不得根据参数中的 MHz 数值自动判断 clocks 是否同步（No Automatic Guess）。

    3. 当 clock relation 无法证明时必须使用 ASYNC_SAFE implementation（Fallback）。

    4. V1.0 默认安全模式为 `CDC_MODE = ASYNC_SAFE`。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.08.001
  title: 目的时钟暂停保持
  category: FUNC
  feature: clock_pause
  priority: must
  description: '1. 若 `m_pclk` 暂停：当前 transaction 必须保持 pending、`s_pready` 保持 low、transaction 不得丢失。

    2. 若 `s_pclk` 暂停：destination 可继续完成当前 APB transaction；response 必须保持至 source clock 恢复并安全接收。

    3. Bridge 必须兼容 clock gating，被 gate 的域恢复 clock 后应继续完成 transaction。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.APB_CDC_BRIDGE.09.001
  title: 复位中止策略
  category: FUNC
  feature: reset_behavior
  priority: must
  description: '1. 若 upstream transaction 尚未完成而 downstream reset，V1.0 选择 `stall until recovery` / `reset-abort` 策略，不引入复杂 timeout/error
    reconstruction（PPA 优先）。

    2. reset 后不得把 reset 前的 request/response toggle、payload、FIFO entry 识别为新事务。

    3. 目标避免要求固定 reset 顺序。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.APB_CDC_BRIDGE.01.001
  title: 事务延迟模型
  category: PERF
  feature: latency_model
  priority: should
  description: '1. 总 APB transaction latency 由 `source capture + request CDC + destination SETUP + destination ACCESS/wait
    + response CDC + source completion` 组成。

    2. V1.0 应避免：unnecessary intermediate FIFO、duplicate payload register stages、redundant synchronizer levels、extra destination
    FSM state。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.APB_CDC_BRIDGE.01.002
  title: 同步器级数与延迟
  category: PERF
  feature: latency_model
  priority: should
  description: '1. `SYNC_STAGES = 2` 为默认推荐；`SYNC_STAGES = 3` 增加 MTBF 但增加延迟与面积。

    2. 慢→快模式应优先减少 synchronizer chain latency、extra buffering、unnecessary FSM states。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.APB_CDC_BRIDGE.02.001
  title: 存储随位宽线性增长
  category: PERF
  feature: resource_scaling
  priority: should
  description: '1. `DATA_WIDTH` 增加 → payload storage area 线性增长；`ADDR_WIDTH` 增加 → request storage area 线性增长。

    2. `SYNC_STAGES` 增加 → synchronizer FF 线性增长。

    3. HANDSHAKE 实现应显著低于 full async FIFO 面积。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.LP.APB_CDC_BRIDGE.01.001
  title: 负载寄存器按需更新
  category: LP
  feature: payload_power
  priority: must
  description: '1. Payload register 仅在接受新 transaction 时更新；IDLE 时不得无意义 toggle。

    2. 只同步必要 control，禁止 PADDR/PWDATA/PRDATA bit-by-bit 2FF。

    3. 以一个 request control crossing 保护整个 request bundle，不以字段建独立 CDC handshake。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.LP.APB_CDC_BRIDGE.02.001
  title: 时钟门控兼容
  category: LP
  feature: clock_gating
  priority: must
  description: '1. Bridge 必须兼容 clock gating：若某一域处于 gating，pending transaction 状态必须保持；该域恢复 clock 后应继续完成 transaction。

    2. IDLE 时 handshake toggle 不变化、request/response payload register 不更新、downstream APB outputs 尽量保持稳定、optional FIFO pointer
    不变化。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.APB_CDC_BRIDGE.01.001
  title: 非法配置检测
  category: CONS
  feature: config_validation
  priority: must
  description: '1. 至少检测并拒绝以下非法配置：`ADDR_WIDTH <= 0`、`DATA_WIDTH <= 0`、`DATA_WIDTH % 8 != 0`、`SYNC_STAGES < 2`（async mode）、unsupported
    `CDC_IMPL`、illegal FIFO depth、unsupported APB profile。

    2. 非法配置通过编译期 assertion 或 FuseSoC 参数校验报错。'
  verify_method: test
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.APB_CDC_BRIDGE.02.001
  title: CDC 静态检查
  category: CONS
  feature: cdc_static
  priority: must
  description: '1. 必须通过 CDC signoff，至少检查：synchronizer、bundled data、control crossing、reset crossing、reconvergence、combinational
    CDC、multi-bit CDC。

    2. 禁止同一个控制事件经多个独立 synchronizer crossing 后在另一侧直接 reconverge。

    3. 严格禁止 `m_pready` combinational → `s_pready` 等跨时钟域组合路径。'
  verify_method: formal
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.APB_CDC_BRIDGE.03.001
  title: 集成约束
  category: CONS
  feature: integration_constraints
  priority: should
  description: '1. 上游 APB Initiator 与下游 APB Target 的地址空间应分别由外部互连保证。

    2. 两时钟域的 reset 释放必须各自同步（async assert / sync deassert）。

    3. 系统需保证必要时能唤醒被 gate 的 clock。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.DFX.APB_CDC_BRIDGE.01.001
  title: 协议断言提供
  category: DFX
  feature: assertions
  priority: should
  description: '1. 至少提供以下断言：one upstream transfer → at most one downstream transfer；

    one downstream completion → at most one upstream completion；request payload

    stable during CDC；response payload stable during CDC；no downstream APB protocol

    violation；no transaction while destination reset；no spurious PREADY；no spurious PSLVERR。

    2. 断言放在 `verification/` 下，DUT 行为不得依赖断言。'
  verify_method: formal
  status: active
  trace:
    hld_ref: []
    test_ref: []
