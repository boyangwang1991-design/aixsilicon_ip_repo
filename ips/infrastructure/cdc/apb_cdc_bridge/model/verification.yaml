schema_version: '1.0'
ip_name: apb_cdc_bridge
verification_level: regression
status: draft
features:
- id: FL.FUNC.APB_CDC_BRIDGE.01
  name: upstream_capture
  description: 上游 APB 事务捕获与单事务语义
  priority: must
  req_ref:
  - LRS.FUNC.APB_CDC_BRIDGE.01.001
  - LRS.FUNC.APB_CDC_BRIDGE.01.002
  - LRS.FUNC.APB_CDC_BRIDGE.01.003
  testcases:
  - id: TC.FUNC.APB_CDC_BRIDGE.01.001.SAN
    name: sanity_read_write
    type: directed
    coverage_type: functional
    description: 验证单次读写事务跨桥正确完成
    preconditions: 复位释放，两时钟异步
    stimulus: 源 agent 发起单次读、单次写
    expected_result: 下游观察到对应事务，上游收到一致 PRDATA/无错误
    timeout_policy: 10000 周期
    priority: must
    tier: smoke
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.01
  coverage:
  - id: COV.FUNC.APB_CDC_BRIDGE.01.001.RW
    name: rw_coverage
    description: 事务方向（read/write）+ back-to-back
    type: functional
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.01
  assertions: []
- id: FL.FUNC.APB_CDC_BRIDGE.02
  name: downstream_regeneration
  description: 下游 APB 事务重新生成与响应
  priority: must
  req_ref:
  - LRS.FUNC.APB_CDC_BRIDGE.02.001
  - LRS.FUNC.APB_CDC_BRIDGE.02.002
  - LRS.FUNC.APB_CDC_BRIDGE.02.003
  testcases:
  - id: TC.FUNC.APB_CDC_BRIDGE.02.001.DOWN
    name: downstream_wait_states
    type: directed
    coverage_type: functional
    description: 验证下游任意 wait-state 下事务完成
    preconditions: 复位释放
    stimulus: 目的 agent 配置随机/长 wait，源发起读写
    expected_result: wait 期间输出稳定，最终完成
    timeout_policy: 20000 周期
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.02
  - id: TC.FUNC.APB_CDC_BRIDGE.02.002.ERR
    name: pslverr_propagation
    type: directed
    coverage_type: functional
    description: 验证下游 PSLVERR 正确返回上游
    preconditions: 复位释放
    stimulus: 目的 agent 对特定地址返回 SLVERR
    expected_result: 上游收到对应 PSLVERR
    timeout_policy: 10000 周期
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.02
  coverage:
  - id: COV.FUNC.APB_CDC_BRIDGE.02.001.WAIT
    name: wait_coverage
    description: 下游 wait 数 bins（0/1/random/long）
    type: functional
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.02
  - id: COV.FUNC.APB_CDC_BRIDGE.02.001.ERR
    name: error_coverage
    description: PSLVERR 传播
    type: functional
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.02
  assertions: []
- id: FL.FUNC.APB_CDC_BRIDGE.03
  name: handshake_cdc
  description: HANDSHAKE 跨域实现（默认）
  priority: must
  req_ref:
  - LRS.FUNC.APB_CDC_BRIDGE.03.001
  - LRS.FUNC.APB_CDC_BRIDGE.03.002
  - LRS.FUNC.APB_CDC_BRIDGE.04.002
  testcases:
  - id: TC.FUNC.APB_CDC_BRIDGE.03.001.HS
    name: handshake_multi_config
    type: randomized
    coverage_type: functional
    description: 验证 HANDSHAKE 实现下多配置（SYNC_STAGES 2/3）读写
    preconditions: CDC_IMPL=HANDSHAKE
    stimulus: 随机地址/数据读写序列
    expected_result: 无丢失/重复，payload 稳定
    timeout_policy: 20000 周期
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.03
  coverage:
  - id: COV.FUNC.APB_CDC_BRIDGE.03.001.IMPL
    name: impl_coverage
    description: CDC 实现（HANDSHAKE/ASYNC_FIFO）+ SYNC_STAGES（2/3）
    type: functional
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.03
  assertions: []
- id: FL.FUNC.APB_CDC_BRIDGE.04
  name: async_fifo_cdc
  description: ASYNC_FIFO 跨域实现（可选）
  priority: should
  req_ref:
  - LRS.FUNC.APB_CDC_BRIDGE.04.001
  - LRS.FUNC.APB_CDC_BRIDGE.04.002
  testcases:
  - id: TC.FUNC.APB_CDC_BRIDGE.04.001.FIFO
    name: fifo_depth12
    type: randomized
    coverage_type: functional
    description: 验证 ASYNC_FIFO 实现 depth 1/2
    preconditions: CDC_IMPL=ASYNC_FIFO
    stimulus: 随机读写序列
    expected_result: 无丢失/重复，单事务完成语义保持
    timeout_policy: 20000 周期
    priority: should
    tier: regression
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.04
  coverage: []
  assertions: []
- id: FL.FUNC.APB_CDC_BRIDGE.05
  name: clock_relation
  description: 时钟关系矩阵（快慢/异步/暂停）与低功耗
  priority: must
  req_ref:
  - LRS.FUNC.APB_CDC_BRIDGE.05.001
  - LRS.FUNC.APB_CDC_BRIDGE.06.001
  - LRS.FUNC.APB_CDC_BRIDGE.07.001
  - LRS.FUNC.APB_CDC_BRIDGE.08.001
  - LRS.INTF.APB_CDC_BRIDGE.03.001
  - LRS.LP.APB_CDC_BRIDGE.01.001
  - LRS.LP.APB_CDC_BRIDGE.02.001
  testcases:
  - id: TC.FUNC.APB_CDC_BRIDGE.05.001.CLK
    name: clock_relation_matrix
    type: randomized
    coverage_type: functional
    description: 验证时钟关系矩阵（1:1/1:2/1:4/1:8/2:1/4:1/8:1/near/irrational）
    preconditions: 复位释放
    stimulus: 各时钟关系下随机读写
    expected_result: 所有关系下事务正确
    timeout_policy: 50000 周期
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.05
  - id: TC.FUNC.APB_CDC_BRIDGE.05.002.PAUSE
    name: clock_pause
    type: directed
    coverage_type: functional
    description: 验证源/目的时钟暂停与恢复
    preconditions: 复位释放
    stimulus: 事务进行中暂停源/目的时钟
    expected_result: 暂停期间保持，恢复后完成，无丢失
    timeout_policy: 30000 周期
    priority: must
    tier: extended
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.05
  coverage:
  - id: COV.FUNC.APB_CDC_BRIDGE.05.001.CLK
    name: clk_relation_coverage
    description: 时钟关系 bins（1:1/1:2/1:4/1:8/2:1/4:1/8:1/near/irrational）
    type: functional
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.05
  - id: COV.FUNC.APB_CDC_BRIDGE.05.001.PAUSE
    name: pause_coverage
    description: 时钟暂停时机（src-before-req/src-during-rsp/dst-before-req/dst-access）
    type: functional
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.05
  assertions: []
- id: FL.FUNC.APB_CDC_BRIDGE.06
  name: reset_behavior
  description: 独立复位与 reset-abort
  priority: must
  req_ref:
  - LRS.FUNC.APB_CDC_BRIDGE.09.001
  - LRS.INTF.APB_CDC_BRIDGE.03.002
  testcases:
  - id: TC.FUNC.APB_CDC_BRIDGE.06.001.RST
    name: reset_scenarios
    type: directed
    coverage_type: functional
    description: 验证独立复位（源/目的/双侧/传输中）
    preconditions: 无
    stimulus: 各复位时机下发起事务
    expected_result: 复位后无 stale transfer，无伪事务
    timeout_policy: 30000 周期
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.06
  coverage:
  - id: COV.FUNC.APB_CDC_BRIDGE.06.001.RST
    name: reset_coverage
    description: 复位时机 bins（both/src/dst/req-cdc/access/rsp-cdc）
    type: functional
    feature_ref:
    - FL.FUNC.APB_CDC_BRIDGE.06
  assertions: []
- id: FL.INTF.APB_CDC_BRIDGE.01
  name: apb_interface
  description: 上游/下游 APB 接口与 APB4 扩展
  priority: must
  req_ref:
  - LRS.INTF.APB_CDC_BRIDGE.01.001
  - LRS.INTF.APB_CDC_BRIDGE.01.002
  - LRS.INTF.APB_CDC_BRIDGE.02.001
  - LRS.INTF.APB_CDC_BRIDGE.02.002
  testcases:
  - id: TC.INTF.APB_CDC_BRIDGE.01.001.APB4
    name: apb4_extension
    type: directed
    coverage_type: functional
    description: 验证 APB4 PSTRB/PPROT 跨域保真
    preconditions: APB_PROFILE=APB4
    stimulus: 设置非零 PSTRB/PPROT 的写事务
    expected_result: 下游 PSTRB/PPROT 与上游一致
    timeout_policy: 10000 周期
    priority: must
    tier: regression
    feature_ref:
    - FL.INTF.APB_CDC_BRIDGE.01
  coverage:
  - id: COV.INTF.APB_CDC_BRIDGE.01.001.PROF
    name: apb_profile_coverage
    description: APB profile（APB3/APB4）cross PSTRB/PPROT 使能
    type: functional
    feature_ref:
    - FL.INTF.APB_CDC_BRIDGE.01
  assertions: []
- id: FL.CONS.APB_CDC_BRIDGE.01
  name: config_validation
  description: 非法配置检测与 CDC 静态
  priority: must
  req_ref:
  - LRS.CONS.APB_CDC_BRIDGE.01.001
  - LRS.CONS.APB_CDC_BRIDGE.02.001
  testcases:
  - id: TC.CONS.APB_CDC_BRIDGE.01.001.CFG
    name: config_validation
    type: directed
    coverage_type: functional
    description: 验证非法配置被拒绝
    preconditions: 无
    stimulus: 编译期非法参数（DATA_WIDTH%8!=0 等）
    expected_result: 编译/elab 失败（assert）
    timeout_policy: n/a
    priority: must
    tier: smoke
    feature_ref:
    - FL.CONS.APB_CDC_BRIDGE.01
  coverage: []
  assertions: []
