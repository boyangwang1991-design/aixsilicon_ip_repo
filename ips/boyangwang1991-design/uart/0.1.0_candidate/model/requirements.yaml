schema_version: '1.0'
owner: rtl-team
ip_name: UART
requirements:
- id: LRS.INTF.UART.01.001
  title: 时钟与复位接口
  category: INTF
  feature: clock_reset
  priority: must
  description: '1. 模块应支持单一系统时钟 `clk_i`，所有内部逻辑与寄存器均在该时钟域内工作。

    2. 模块应支持低有效异步复位 `rst_ni`，采用异步复位、同步释放策略。

    3. 复位后所有寄存器应复位到定义值（见寄存器文档），FIFO 应清空。

    4. `uart.hjson` 定义 clocking 为 `{clock: "clk_i", reset: "rst_ni"}`。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.UART.01.002
  title: TL-UL 从接口访问
  category: INTF
  feature: tlul_bus
  priority: must
  description: '1. 模块应通过 TileLink-UL 协议从接口（`tlul_pkg::tl_h2d_t tl_i` / `tl_d2h_t tl_o`）接收寄存器访问。

    2. 块内地址宽度应为 `BlockAw=6`（64 字节地址空间），数据位宽 32 位。

    3. 总线接口应支持读/写事务，并遵守 TL-UL 握手（valid/ready）与响应（d_h2d/d2h）时序。

    4. 非法地址访问应返回 TL-UL 错误响应（`tl_o.d_error`），不得导致挂死。

    5. 总线应具备端到端完整性检测（BUS.INTEGRITY），检测到完整性错误时上报 `fatal_fault` alert。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.UART.01.003
  title: APB4 从接口访问（新增）
  category: INTF
  feature: apb_bus
  priority: should
  description: '1. 模块应提供 APB4 从接口接入方式，通过新增 `apb2tlul` wrapper 将 APB 事务转换为 TL-UL 事务，再驱动 UART 核心寄存器堆。

    2. APB 接口应包括 `psel_i`、`penable_i`、`pwrite_i`、`paddr_i`（位宽 ≥ 8）、`pwdata_i`、`prdata_o`、`pready_o`、`pslverr_o` 等信号。

    3. APB wrapper 应仅在协议层做转换，不得改动 UART 核心 RTL 行为；核心寄存器地址映射与 TL-UL 方式一致（64 字节块）。

    4. APB wrapper 应支持 32 位读写；非法地址访问应返回 `pslverr_o=1`。

    5. APB 与 TL-UL 两种接入方式应通过 FuseSoC `.core` 的独立 target 隔离（`default` 用 TL-UL，`apb` 用 APB wrapper），二者不可同时实例化冲突。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.UART.01.004
  title: 串行收发接口
  category: INTF
  feature: serial_io
  priority: must
  description: '1. 模块应提供串行接收输入 `cio_rx_i` 与串行发送输出 `cio_tx_o`。

    2. 模块应提供 `cio_tx_en_o` 输出使能，正常工作时恒为 1（`uart.sv` 中 `assign cio_tx_en_o = 1''b1`）。

    3. 空闲状态下 TX/RX 线应为高电平；帧起始位为低电平（1→0）。

    4. `available_input_list`/`available_output_list` 定义 `rx` 与 `tx` 为对外 IO。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.UART.01.005
  title: 中断输出接口
  category: INTF
  feature: interrupt
  priority: must
  description: '1. 模块应输出 9 个中断：`intr_tx_watermark_o`、`intr_tx_empty_o`、`intr_rx_watermark_o`、`intr_tx_done_o`、`intr_rx_overflow_o`、`intr_rx_frame_err_o`、`intr_rx_break_err_o`、`intr_rx_timeout_o`、`intr_rx_parity_err_o`。

    2. `tx_watermark`、`tx_empty`、`rx_watermark` 为电平型 status 中断（`interrupt_list` type=status），复位后 `tx_watermark`、`tx_empty`
    默认置 1。

    3. 其余中断（tx_done、rx_overflow、rx_frame_err、rx_break_err、rx_timeout、rx_parity_err）为事件型，通过 `INTR_STATE`/`INTR_ENABLE`/`INTR_TEST`/`INTR_STATUS`
    寄存器管理（W1C 清除）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.UART.01.006
  title: Alert 接口
  category: INTF
  feature: alert
  priority: should
  description: '1. 模块应通过 `prim_alert_pkg::alert_rx_t`/`alert_tx_t` 接口上报 `fatal_fault` alert（`NumAlerts=1`）。

    2. `fatal_fault` alert 应由 TL-UL 总线完整性错误触发。

    3. 应支持 `ALERT_TEST` 寄存器测试注入 alert。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.UART.01.007
  title: lsio_trigger 触发输出
  category: INTF
  feature: lsio_trigger
  priority: may
  description: '1. 模块应输出 `lsio_trigger_o`，为自清除的状态触发信号（供 DMA 使用）。

    2. 当 RX 或 TX FIFO 越过配置水位（与 watermark 中断行为一致）时应触发该信号。

    3. 触发行为应与 `inter_signal_list` 中 `lsio_trigger` 定义一致。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.UART.01.008
  title: RACL 接口
  category: INTF
  feature: racl
  priority: may
  description: '1. 模块应提供 RACL 输入 `racl_policies_i` 与错误输出 `racl_error_o`（`top_racl_pkg`）。

    2. 默认 `EnableRacl=0`，RACL 功能关闭；`racl_error_o` 应输出已知值。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.001
  title: 串行帧格式
  category: FUNC
  feature: serial_frame
  priority: must
  description: '1. 模块应支持标准 UART 帧：空闲高电平 → 起始位（0）→ 8 数据位（LSB 先发）→ 可选奇偶位 → 停止位（1）。

    2. 数据格式应固定为 8 位（`uart.hjson`: "The data format is restricted to 8 bits"）。

    3. 奇偶使能时帧为 START + 8 data + parity + STOP（共 11 bit-time）；未使能时为 START + 8 data + STOP（共 10 bit-time）。

    4. 未使能奇偶时停止位在数据第 8 位后；使能时在奇偶位后。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.002
  title: 波特率可编程
  category: FUNC
  feature: baud_rate
  priority: must
  description: '1. 模块应通过 `CTRL.NCO`（16 位）配置波特率，满足 `UART.BAUD_RATE_CONTROL` feature。

    2. 波特率计算公式：`f_baud = (1/16) × (NCO / 2^16) × f_pclk`；NCO 计数溢出产生 16x baud tick。

    3. 最高支持 1 Mbit/s 波特率。

    4. NCO=0 时应不产生 baud tick（模块不传输）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.003
  title: TX 发送与 TX FIFO
  category: FUNC
  feature: tx_path
  priority: must
  description: '1. 模块应提供 TX 发送路径：写 `WDATA` 将数据字节入队到 TX FIFO（深度 `TxFifoDepth=32`）。

    2. `CTRL.TX` 使能后，`uart_tx` 从 FIFO 出队并按波特率逐位发送到 `cio_tx_o`。

    3. 若 TX 未使能，写入 WDATA 的数据应堆积在 FIFO 中，TX 使能后再发送。

    4. 当 FIFO 在发送过程中变空时，应在最后一字节发送完成后置位 `tx_done` 中断（与 watermark 中断独立）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.004
  title: RX 接收与 RX FIFO
  category: FUNC
  feature: rx_path
  priority: must
  description: '1. 模块应提供 RX 接收路径：`uart_rx` 以 16x 波特率对 `cio_rx_i` 过采样。

    2. 检测到低电平后应于半个 bit-time（8 个过采样周期）确认 START 位；若线已恢复高则忽略毛刺。

    3. 确认 START 后应在每个 bit-time 中点采样，收集 8 数据位（及可选奇偶位）到字符缓冲。

    4. STOP 位为高且奇偶正确时，数据字节应压入 RX FIFO（深度 `RxFifoDepth=64`），软件读 `RDATA` 取出。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.005
  title: 奇偶校验
  category: FUNC
  feature: parity
  priority: should
  description: '1. 模块应满足 `UART.PARITY` feature：`CTRL.PARITY_EN` 使能后在收发方向附加/检查奇偶位。

    2. `CTRL.PARITY_ODD` 选择奇偶类型：1=奇校验，0=偶校验。

    3. 接收时若奇偶位极性错误，应置位 `rx_parity_err` 中断。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.006
  title: 系统回环 SLPBK
  category: FUNC
  feature: system_loopback
  priority: should
  description: '1. 模块应满足 `UART.SYSTEM_LOOPBACK` feature：`CTRL.SLPBK` 置位后，发送到 TX 的位应被 RX 侧接收。

    2. SLPBK 使能时 TX 线输出应为 1。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.007
  title: 线路回环 LLPBK
  category: FUNC
  feature: line_loopback
  priority: should
  description: '1. 模块应满足 `UART.LINE_LOOPBACK` feature：`CTRL.LLPBK` 置位后，输入位应被转发到 TX 侧。

    2. LLPBK 使能时内部设计应视 RX 值为 1。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.008
  title: 线路中断检测
  category: FUNC
  feature: break_detection
  priority: should
  description: '1. 模块应满足 `UART.LINE_BREAK` feature：检测 RX 引脚连续为低超过可编程字符数即为中断。

    2. `CTRL.RXBLVL` 应可配置检测阈值：2/4/8/16 字符时间（enum: break2/break4/break8/break16）。

    3. 检测到中断应置位 `rx_break_err` 中断；每发生一次中断只产生一次事件，线恢复高至少半 bit-time 后才可再次检测。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.009
  title: RX 超时检测
  category: FUNC
  feature: rx_timeout
  priority: should
  description: '1. 模块应支持 RX 超时：`TIMEOUT_CTRL.EN` 使能、`TIMEOUT_CTRL.VAL`（24 位）配置超时值（UART bit-time 数）。

    2. 若 RX FIFO 中有字符在程序设定时间内未被取走，应置位 `rx_timeout` 中断。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.010
  title: RX 噪声滤波
  category: FUNC
  feature: noise_filter
  priority: may
  description: '1. 模块应满足 `UART.NOISE_FILTER` feature：`CTRL.NF` 置位后，RX 线经过 3-tap 重复码滤波。

    2. 噪声滤波应能忽略单周期 IP 时钟毛刺。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.011
  title: FIFO 复位与水位
  category: FUNC
  feature: fifo_control
  priority: must
  description: '1. 模块应通过 `FIFO_CTRL.RXRST`/`FIFO_CTRL.TXRST` 提供 RX/TX FIFO 软复位（写 1 复位，读返回 0）。

    2. `FIFO_CTRL.RXILVL` 应配置 RX watermark 触发电平（1/2/4/8/16/32/62 字符，`rx_watermark`）。

    3. `FIFO_CTRL.TXILVL` 应配置 TX watermark 触发电平（1/2/4/8/16 字符，`tx_watermark`）。

    4. `FIFO_STATUS.TXLVL`/`FIFO_STATUS.RXLVL` 应提供当前 FIFO 填充水平。

    5. `STATUS` 寄存器应提供 TXFULL/RXFULL/TXEMPTY/TXIDLE/RXIDLE/RXEMPTY 状态。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.012
  title: RX FIFO 溢出
  category: FUNC
  feature: rx_overflow
  priority: should
  description: 1. 模块应满足 `UART.FIFO_INTERRUPTS` feature：RX FIFO 满时若再收到字符，应置位 `rx_overflow` 中断并丢弃该字符。
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.013
  title: 中断状态/使能/测试
  category: FUNC
  feature: interrupt_management
  priority: must
  description: '1. 模块应通过 `INTR_STATE`（W1C 清除）、`INTR_ENABLE`、`INTR_TEST`（软件置位）、`INTR_STATUS`（state & enable）管理 9 个中断。

    2. 电平型中断（tx_watermark/tx_empty/rx_watermark）持续保持，不能通过写状态寄存器清除。

    3. 事件型中断在 `INTR_STATE` 写 1 后清除。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.014
  title: TX 引脚覆盖
  category: FUNC
  feature: tx_override
  priority: may
  description: '1. 模块应通过 `OVRD.TXEN` 使能 TX 引脚覆盖，`OVRD.TXVAL` 设定覆盖电平，直接控制 TX 引脚状态。

    2. 覆盖使能会强制 TX 输出为 OVRD.TXVAL（可能造成协议违规，供调试用）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.UART.01.015
  title: 过采样值读取
  category: FUNC
  feature: oversample_observation
  priority: may
  description: 1. 模块应通过 `VAL.RX`（16 位）提供最近 16 次 RX 过采样值，最近位在 bit0，最旧位在 bit15。
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.REG.UART.01.001
  title: 寄存器空间分配
  category: REG
  feature: reg_space
  priority: must
  description: '1. 模块应提供 `BlockAw=6` 位地址（64 字节）的寄存器空间，寄存器宽度 32 位（`regwidth: "32"`）。

    2. `NumRegs=13`，寄存器地址映射见下表。

    | 地址偏移 | 寄存器名 | 访问属性 | 说明 |

    |---|---|---|---|

    | 0x00 | CTRL | rw | UART 控制寄存器 |

    | 0x04 | STATUS | ro | UART 状态寄存器（hwext） |

    | 0x08 | RDATA | ro | UART 读数据（hwext） |

    | 0x0C | WDATA | wo | UART 写数据 |

    | 0x10 | FIFO_CTRL | rw | FIFO 控制 |

    | 0x14 | FIFO_STATUS | ro | FIFO 状态（hwext） |

    | 0x18 | OVRD | rw | TX 引脚覆盖控制 |

    | 0x1C | VAL | ro | 过采样值（hwext） |

    | 0x20 | TIMEOUT_CTRL | rw | RX 超时控制 |

    | 0x24 | INTR_STATE | rw1c | 中断状态（W1C） |

    | 0x28 | INTR_ENABLE | rw | 中断使能 |

    | 0x2C | INTR_TEST | rw | 中断测试 |

    | 0x30 | INTR_STATUS | ro | 中断状态（state & enable） |

    | 0x34 | ALERT_TEST | rw | Alert 测试 |

    3. 非法地址（超出已定义寄存器范围）访问应返回错误响应（TL-UL error / APB pslverr）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.REG.UART.01.002
  title: CTRL 控制寄存器
  category: REG
  feature: reg_ctrl
  priority: must
  description: '1. `CTRL`（0x00，rw）字段定义应如下：

    - bit0 `TX`：TX 使能。

    - bit1 `RX`：RX 使能。

    - bit2 `NF`：RX 噪声滤波使能。

    - bit4 `SLPBK`：系统回环使能。

    - bit5 `LLPBK`：线路回环使能。

    - bit6 `PARITY_EN`：奇偶校验使能。

    - bit7 `PARITY_ODD`：1=奇校验，0=偶校验。

    - bit[9:8] `RXBLVL`：RX break 检测阈值（enum break2/break4/break8/break16）。

    - bit[31:16] `NCO`：波特率时钟控制。

    2. 默认值：CTRL 复位为 0。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.REG.UART.01.003
  title: STATUS 状态寄存器
  category: REG
  feature: reg_status
  priority: must
  description: '1. `STATUS`（0x04，ro，hwext）字段应如下：

    - bit0 `TXFULL`：TX 缓冲满。

    - bit1 `RXFULL`：RX 缓冲满。

    - bit2 `TXEMPTY`：TX FIFO 空（复位值 1）。

    - bit3 `TXIDLE`：TX FIFO 空且所有位已发送（复位值 1）。

    - bit4 `RXIDLE`：RX 空闲（复位值 1）。

    - bit5 `RXEMPTY`：RX FIFO 空（复位值 1）。

    2. 该寄存器由硬件实时更新，软件只读。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.REG.UART.01.004
  title: RDATA 与 WDATA
  category: REG
  feature: reg_data
  priority: must
  description: '1. `RDATA`（0x08，ro，hwext）：读返回 RX FIFO 头部字节（bit[7:0]），读操作使 FIFO 出队。

    2. `WDATA`（0x0C，wo）：写将数据字节（bit[7:0]）入队 TX FIFO。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.REG.UART.01.005
  title: FIFO_CTRL 与 FIFO_STATUS
  category: REG
  feature: reg_fifo
  priority: must
  description: '1. `FIFO_CTRL`（0x10，rw）字段：

    - bit0 `RXRST`（wo）：写 1 复位 RX FIFO，读返回 0。

    - bit1 `TXRST`（wo）：写 1 复位 TX FIFO，读返回 0。

    - bit[4:2] `RXILVL`：RX watermark 触发（enum rxlvl1/2/4/8/16/32/62）。

    - bit[7:5] `TXILVL`：TX watermark 触发（enum txlvl1/2/4/8/16）。

    2. `FIFO_STATUS`（0x14，ro，hwext）字段：

    - bit[7:0] `TXLVL`：TX FIFO 当前填充水平。

    - bit[23:16] `RXLVL`：RX FIFO 当前填充水平。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.REG.UART.01.006
  title: OVRD / VAL / TIMEOUT_CTRL
  category: REG
  feature: reg_misc
  priority: should
  description: '1. `OVRD`（0x18，rw）字段：

    - bit0 `TXEN`：TX 引脚覆盖使能。

    - bit1 `TXVAL`：覆盖电平值。

    2. `VAL`（0x1C，ro，hwext）：bit[15:0] `RX` 最近 16 次过采样值，最近位 bit0。

    3. `TIMEOUT_CTRL`（0x20，rw）字段：

    - bit[23:0] `VAL`：RX 超时值（UART bit-time 数）。

    - bit31 `EN`：RX 超时功能使能。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.REG.UART.01.007
  title: INTR 与 ALERT 寄存器
  category: REG
  feature: reg_intr_alert
  priority: must
  description: '1. `INTR_STATE`（0x24，rw1c）：9 位中断状态，写 1 清除（W1C）。

    2. `INTR_ENABLE`（0x28，rw）：9 位中断使能。

    3. `INTR_TEST`（0x2C，rw）：9 位中断测试，写 1 置位对应状态。

    4. `INTR_STATUS`（0x30，ro）：`INTR_STATE & INTR_ENABLE`。

    5. `ALERT_TEST`（0x34，rw）：写 1 触发对应 alert 测试。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.UART.01.001
  title: 波特率范围
  category: PERF
  feature: baud_rate_range
  priority: must
  description: '1. 模块应支持最高 1 Mbit/s 的波特率（`uart.hjson` one_line_desc）。

    2. 波特率由 `CTRL.NCO`（16 位）与系统时钟频率共同决定：`f_baud = (1/16) × (NCO/2^16) × f_pclk`。

    3. 实际波特率取决于系统时钟与 NCO 配置，理论上可配置范围覆盖常用波特率（1200–1M bit/s）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.UART.01.002
  title: 波特率误差容限
  category: PERF
  feature: baud_error_tolerance
  priority: should
  description: '1. 模块应满足 OpenTitan 定义的波特率误差容限：无奇偶时采样窗为 ±8 tick / 144 ≈ ±5.5%，奇偶使能时为 ±8 tick / 160 ≈ ±5%。

    2. 收发两侧各自相对理想波特率偏差应 ≤ ±2.5% 时能正确通信。

    3. NCO 向下取整产生的波特率误差：当 NCO 计算值 ≥ 40 时，误差应 < 2.5%（满足通信要求）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.UART.01.003
  title: FIFO 深度参数
  category: PERF
  feature: fifo_depth
  priority: should
  description: '1. TX FIFO 深度应为 `TxFifoDepth=32` 字节。

    2. RX FIFO 深度应为 `RxFifoDepth=64` 字节。

    3. FIFO 深度参数应可参数化（`uart_reg_pkg` 中 `parameter`），但受 CSR 布局约束，深度必须 < 256（`ASSERT_INIT`：TxFifoDepth/RxFifoDepth < 256）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.PERF.UART.01.004
  title: 单字节传输延迟
  category: PERF
  feature: transfer_latency
  priority: may
  description: '1. 单字节传输时间为 10（无奇偶）或 11（有奇偶）个 bit-time。

    2. 软件写入 WDATA 后，数据应进入 FIFO 并在 TX 使能后开始发送，无额外协议延迟。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.SAFE.UART.01.001
  title: 总线完整性检测（BUS.INTEGRITY）
  category: SAFE
  feature: bus_integrity
  priority: should
  description: '1. 模块应实现 TL-UL 端到端总线完整性方案（countermeasure `BUS.INTEGRITY`）。

    2. 检测到总线完整性错误（如寄存器写使能 one-hot 违规）时，应触发 `fatal_fault` alert。

    3. `uart.sv` 中 `ASSERT_PRIM_REG_WE_ONEHOT_ERROR_TRIGGER_ALERT` 应确保 reg_we one-hot 错误触发 alert。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.SAFE.UART.01.002
  title: Alert 发送与测试
  category: SAFE
  feature: alert_mechanism
  priority: should
  description: '1. 模块应通过 `prim_alert_sender` 发送 `fatal_fault` alert（`AlertAsyncOn=1` 支持异步、`IsFatal=1`）。

    2. 应支持 `ALERT_TEST` 寄存器软件注入 alert 测试。

    3. 复位后 alert_tx_o 应为已知状态。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.UART.01.001
  title: 时钟复位约束
  category: CONS
  feature: clock_reset_constraint
  priority: must
  description: '1. 模块应在单一时钟域 `clk_i` 下工作，复位 `rst_ni` 低有效异步复位。

    2. 所有寄存器与状态机应同步于 `clk_i` 上升沿。

    3. 复位释放时序应符合异步复位同步释放要求，避免亚稳态。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.UART.01.002
  title: 接口连接约束
  category: CONS
  feature: interface_connection
  priority: should
  description: '1. TL-UL 接入方式下，`tl_i`/`tl_o` 应连接 TL-UL 主机总线；APB 接入方式下，UART 核心应通过 `apb2tlul` wrapper 连接 APB 主机。

    2. 两种接入方式不应同时使能（通过 FuseSoC `.core` target 隔离）。

    3. `cio_tx_en_o` 恒为 1，用于 TX 输出使能；外部应正确连接。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.UART.01.003
  title: 波特率配置约束
  category: CONS
  feature: baud_rate_constraint
  priority: should
  description: '1. 当 NCO 计算值 < 40 时（即 `baud < (40 × f_pclk) / 2^20` 或 `f_pclk > (2^20 × baud)/40`），波特率误差可能不可接受，需要检查并可能取整。

    2. 建议对 NCO 结果四舍五入到最近整数以减小误差。

    3. 系统时钟越高，低波特率（如 9600 及以下）需特别注意 NCO 取整误差（参考 theory_of_operation 各频率边界）。'
  verify_method: simulation
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.UART.01.004
  title: FIFO 深度上限
  category: CONS
  feature: fifo_depth_constraint
  priority: should
  description: '1. TX/RX FIFO 深度参数必须 < 256（设计不支持更深 FIFO，`ASSERT_INIT` 约束）。

    2. 修改 FIFO 深度时需同步调整 watermark 相关 CSR 布局与文档。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.UART.01.005
  title: 初始化与软件顺序约束
  category: CONS
  feature: software_constraint
  priority: may
  description: '1. 使用前软件应配置 `CTRL.NCO` 设定波特率，并按需配置 `CTRL`（TX/RX/奇偶/回环等）、`FIFO_CTRL`（水位）与 `TIMEOUT_CTRL`。

    2. `WDATA`/`OVRD` 写入会影响其他 CSR 状态，需按软件指南顺序访问。

    3. RX 未在 pinmux 选中时 RX 引脚被驱动为 0 会导致 RX 状态非默认值，软件需知悉。'
  verify_method: review
  status: active
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CONS.UART.01.006
  title: 不支持场景说明
  category: CONS
  feature: unsupported_scenarios
  priority: may
  description: '1. 本模块不支持数据位宽非 8 位（固定 8 位，`uart.hjson` 说明）。

    2. 本模块不支持硬件流控（RTS/CTS），流量控制仅可软件握手实现。

    3. RACL 功能默认关闭（`EnableRacl=0`），如启用需额外集成 RACL 控制器。'
  verify_method: review
  status: active
