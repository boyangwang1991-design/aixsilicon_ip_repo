schema_version: '1.0'
ip_name: uart
verification_level: smoke
status: draft
features:
- id: FL.INTF.UART.01
  name: 接口验证
  description: 时钟复位、TL-UL 总线、APB 接入、串行 IO、中断、alert、lsio_trigger、RACL 接口行为
  priority: must
  req_ref:
  - LRS.INTF.UART.01.001
  - LRS.INTF.UART.01.002
  - LRS.INTF.UART.01.003
  - LRS.INTF.UART.01.004
  - LRS.INTF.UART.01.005
  - LRS.INTF.UART.01.006
  - LRS.INTF.UART.01.007
  - LRS.INTF.UART.01.008
  testcases:
  - id: TC.INTF.UART.01.001.SMOKE
    name: tc_uart_smoke
    type: directed
    coverage_type: functional
    description: 复位后寄存器默认值、基本寄存器读写、TX/RX 系统回环一字节、基本中断
    preconditions: 复位完成，CTRL 配置（NCO/TX/RX/SLPBK）
    stimulus: 写 CTRL 使能，写 WDATA 一字节，等待 RX 收到，读 RDATA
    expected_result: 读回 RDATA 与发送数据一致，相关中断/状态正确
    priority: must
    tier: smoke
    feature_ref:
    - FL.INTF.UART.01
  coverage:
  - id: COV.INTF.UART.01.MODE
    name: mode_cg
    description: 回环模式与噪声滤波组合覆盖
    type: functional
    feature_ref:
    - FL.INTF.UART.01
  assertions:
  - id: ASSERT.INTF.UART.01.001.TXEN
    name: TxEnIsOne_A
    property: cio_tx_en_o 恒为 1
    severity: error
    feature_ref:
    - FL.INTF.UART.01
  - id: ASSERT.INTF.UART.01.002.KNOWN
    name: TxKnown_A
    property: 复位或未使能时 TX/中断/alert 输出为已知状态
    severity: error
    feature_ref:
    - FL.INTF.UART.01
- id: FL.FUNC.UART.01
  name: 串行收发功能
  description: 帧格式、波特率、TX/RX 路径、奇偶、回环、错误检测、FIFO 控制、中断管理、TX 覆盖、过采样观测
  priority: must
  req_ref:
  - LRS.FUNC.UART.01.001
  - LRS.FUNC.UART.01.002
  - LRS.FUNC.UART.01.003
  - LRS.FUNC.UART.01.004
  - LRS.FUNC.UART.01.005
  - LRS.FUNC.UART.01.006
  - LRS.FUNC.UART.01.007
  - LRS.FUNC.UART.01.008
  - LRS.FUNC.UART.01.009
  - LRS.FUNC.UART.01.010
  - LRS.FUNC.UART.01.011
  - LRS.FUNC.UART.01.012
  - LRS.FUNC.UART.01.013
  - LRS.FUNC.UART.01.014
  - LRS.FUNC.UART.01.015
  testcases:
  - id: TC.FUNC.UART.01.002.TXRX
    name: tc_uart_tx_rx
    type: directed
    coverage_type: functional
    description: 参数化波特率/奇偶/帧格式/回环模式的端到端收发
    preconditions: 配置 NCO（多种波特率）、PARITY_EN/ODD、SLPBK/LLPBK/NF
    stimulus: 生成多字节数据帧（含奇偶），经回环/线路回环/外部收发，注入单周期毛刺验证滤波
    expected_result: RM 收发比对一致，帧格式（START+8 data+[parity]+STOP）正确，回环一致、NF 滤除毛刺
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.UART.01
  - id: TC.FUNC.UART.01.003.ERR
    name: tc_uart_error
    type: error_injection
    coverage_type: functional
    description: 参数化错误注入：frame/parity/break/overflow/timeout 及其中断
    preconditions: 使能对应错误检测与中断
    stimulus: 注入错误帧/奇偶错/break/溢出/超时场景
    expected_result: 各错误中断正确置位、数据按设计丢弃/标记
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.UART.01
  - id: TC.FUNC.UART.01.004.FIFO
    name: tc_uart_fifo
    type: boundary
    coverage_type: functional
    description: 参数化 FIFO 水位（RXILVL/TXILVL 各档）、满/空/软复位、watermark 中断
    preconditions: 配置 FIFO_CTRL 水位与中断
    stimulus: 填充/读取 FIFO 至各水位边界，触发软复位
    expected_result: 水位中断与 FIFO_STATUS 一致，软复位清空 FIFO
    priority: must
    tier: regression
    feature_ref:
    - FL.FUNC.UART.01
  coverage:
  - id: COV.FUNC.UART.01.BAUD
    name: baud_rate_cg
    description: 波特率配置组合覆盖（多种 NCO/常用波特率）
    type: functional
    feature_ref:
    - FL.FUNC.UART.01
  - id: COV.FUNC.UART.02.FRAME
    name: frame_cg
    description: 帧格式覆盖（奇偶开关、数据位、停止位）
    type: functional
    feature_ref:
    - FL.FUNC.UART.01
  - id: COV.FUNC.UART.03.FIFO
    name: fifo_cg
    description: FIFO 水位档位与满/空状态覆盖
    type: functional
    feature_ref:
    - FL.FUNC.UART.01
  - id: COV.FUNC.UART.04.ERR
    name: error_cg
    description: 各错误事件覆盖（frame/parity/break/overflow/timeout）
    type: functional
    feature_ref:
    - FL.FUNC.UART.01
  assertions:
  - id: ASSERT.FUNC.UART.01.001.FRAME
    name: FrameFormat_A
    property: 串行帧 START+8 data+[parity]+STOP 时序正确
    severity: error
    feature_ref:
    - FL.FUNC.UART.01
  - id: ASSERT.FUNC.UART.01.002.BAUD
    name: BaudTick_A
    property: NCO 分频产生 16x baud tick 正确
    severity: warning
    feature_ref:
    - FL.FUNC.UART.01
- id: FL.REG.UART.01
  name: 寄存器验证
  description: 寄存器空间与各寄存器读写、W1C、非法地址错误响应
  priority: must
  req_ref:
  - LRS.REG.UART.01.001
  - LRS.REG.UART.01.002
  - LRS.REG.UART.01.003
  - LRS.REG.UART.01.004
  - LRS.REG.UART.01.005
  - LRS.REG.UART.01.006
  - LRS.REG.UART.01.007
  testcases:
  - id: TC.REG.UART.01.005.CSR
    name: tc_uart_csr
    type: register
    coverage_type: functional
    description: 参数化寄存器读写、W1C、复位值、非法地址错误响应
    preconditions: 复位
    stimulus: RAL 遍历各寄存器读写，非法地址访问
    expected_result: 读写一致、W1C 正确、复位值正确、非法地址返回错误
    priority: must
    tier: regression
    feature_ref:
    - FL.REG.UART.01
  coverage:
  - id: COV.REG.UART.01.ACC
    name: reg_access_cg
    description: 寄存器读写访问类型覆盖
    type: functional
    feature_ref:
    - FL.REG.UART.01
  assertions: []
- id: FL.PERF.UART.01
  name: 性能验证
  description: 波特率范围、误差容限、FIFO 深度、单字节延迟
  priority: must
  req_ref:
  - LRS.PERF.UART.01.001
  - LRS.PERF.UART.01.002
  - LRS.PERF.UART.01.003
  - LRS.PERF.UART.01.004
  testcases:
  - id: TC.PERF.UART.01.006.PERF
    name: tc_uart_perf
    type: performance
    coverage_type: functional
    description: 参数化波特率误差容限、FIFO 深度、单字节延迟
    preconditions: 配置不同 NCO/波特率
    stimulus: 收发侧引入 ±2.5% 波特率偏差，测量 bit-time 与延迟
    expected_result: 容限内正确通信、单字节 10/11 bit-time、FIFO 深度 32/64
    priority: must
    tier: extended
    feature_ref:
    - FL.PERF.UART.01
  coverage: []
  assertions: []
- id: FL.SAFE.UART.01
  name: 功能安全验证
  description: 总线完整性检测、fatal_fault alert、ALERT_TEST
  priority: must
  req_ref:
  - LRS.SAFE.UART.01.001
  - LRS.SAFE.UART.01.002
  testcases:
  - id: TC.SAFE.UART.01.007.ALERT
    name: tc_uart_alert
    type: directed
    coverage_type: functional
    description: ALERT_TEST 注入与总线完整性 fatal_fault alert
    preconditions: 复位，连接 alert 接收
    stimulus: 写 ALERT_TEST 触发 alert；注入总线完整性错误
    expected_result: alert_tx_o 正确触发、复位后已知状态
    priority: must
    tier: extended
    feature_ref:
    - FL.SAFE.UART.01
  coverage: []
  assertions:
  - id: ASSERT.SAFE.UART.01.001.ALERT
    name: RegWeOnehotCheck_A
    property: 寄存器写使能 one-hot 违规触发 fatal_fault alert
    severity: error
    feature_ref:
    - FL.SAFE.UART.01
- id: FL.CONS.UART.01
  name: 约束验证
  description: 时钟复位、接口连接、NCO 约束、FIFO 深度、软件顺序、不支持场景
  priority: must
  req_ref:
  - LRS.CONS.UART.01.001
  - LRS.CONS.UART.01.002
  - LRS.CONS.UART.01.003
  - LRS.CONS.UART.01.004
  - LRS.CONS.UART.01.005
  - LRS.CONS.UART.01.006
  testcases: []
  coverage: []
  assertions:
  - id: ASSERT.CONS.UART.01.001.CLK
    name: ClockReset_A
    property: 复位后寄存器回默认值、FIFO 清空、中断/alert 输出已知状态
    severity: error
    feature_ref:
    - FL.CONS.UART.01
