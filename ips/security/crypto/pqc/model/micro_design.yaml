  level_or_pulse: level
  clear: W1C on INTR_STATE
  req_ref:
  - LRS.INTF.PQC.SIDEBAND.001
- id: LLD.IRQ.PQC.SELFTEST
  module_ref: LLD.MOD.PQC.APB
  source: LLD.ERR.PQC.SELFTEST
  trigger: KAT 失败
  level_or_pulse: level
  clear: W1C on INTR_STATE
  req_ref:
  - LRS.REG.PQC.INTR.001
errors:
- id: LLD.ERR.PQC.CONFIG
  detection: descriptor 校验失败（opcode/参数集/ABI/reserved/CRC/对齐/长度/capability/权限）
  response: 在任何秘密访问前终止，返回 CONFIG_ERROR
  propagation: completion status + ERROR_CODE
  recovery: 命令级恢复，回到 IDLE，可重新提交
  req_ref:
  - LRS.FUNC.PQC.CMD.003
  - LRS.FUNC.PQC.CMD.005
- id: LLD.ERR.PQC.DMA
  detection: AXI 响应错误、超时、4 KiB 违规尝试、容量越界
  response: 终止命令，进入统一安全收尾；已写数据不得作为有效输出使用
  propagation: completion status + DMA_ERROR + ALERT
  recovery: 清零后回到 IDLE
  req_ref:
  - LRS.RESET.PQC.SAFE.001
  - LRS.SEC.PQC.SLOT.005
- id: LLD.ERR.PQC.RNG
  detection: entropy valid 长时间无效、health 异常、domain tag 不匹配
  response: 停止命令并清零，不降级为常数或重复随机数
  propagation: RNG_FAULT 中断 + completion status
  recovery: 熵恢复后重新提交
  req_ref:
  - LRS.INTF.PQC.ENTROPY.001
- id: LLD.ERR.PQC.SELFTEST
  detection: 上电/按需 KAT 结果不匹配
  response: 进入 LOCKED，拒绝密码命令
  propagation: SELF_TEST_FAIL 中断 + ALERT_FATAL
  recovery: 需显式恢复流程
  req_ref:
  - LRS.RESET.PQC.COLD.001
- id: LLD.ERR.PQC.INTERNAL
  detection: page tag mismatch、representation 混用、ECC UE、retry exhausted
  response: fatal 内部错误，清除候选值，进入安全收尾
  propagation: completion status=FATAL 或 INTERNAL_RETRY_EXHAUSTED
  recovery: 清零后回到 IDLE（retry exhausted）或 LOCKED（完整性错误）
  req_ref:
  - LRS.FUNC.PQC.DSA_SIGN.002
  - LRS.SEC.PQC.INTEGRITY.001
safety:
- id: LLD.SAFE.PQC.CT_SELECT
  mechanism: constant_time_compare_select
  protects:
  - shared_secret_output
  detection: n/a（防护性机制）
  response: 全长度 OR 累积比较 + 全位宽 mask select；mask 仅来自比较结果，不控制调度
  req_ref:
  - LRS.FUNC.PQC.KEM_DECAPS.002
  - LRS.SEC.PQC.CT.001
  applicability:
    expr: ENABLE_ALGO_MASK & 0x7
- id: LLD.SAFE.PQC.VERIFY_DUAL
  mechanism: redundant_comparison
  protects:
  - dsa_verify_result
  detection: 两路比较结果不一致时判定为故障
  response: 不一致时置 fatal 并拒绝输出 valid（fail-closed）
  req_ref:
  - LRS.SEC.PQC.VERIFY.001
  applicability:
    expr: ENABLE_ALGO_MASK & 0x38
- id: LLD.SAFE.PQC.CTRL_SPARSE
  mechanism: sparse_redundant_encoding
  protects:
  - control_fsm
  - opcode_param_keytype_perm
  detection: 非法/多热编码检测
  response: 强制进入 ZEROIZE 并置 fatal；绝不进入 EXECUTE
  req_ref:
  - LRS.SEC.PQC.INTEGRITY.001
  applicability:
    expr: 'true'
- id: LLD.SAFE.PQC.COUNTER_PARITY
  mechanism: parity_check
  protects:
  - loop_counter
  - ntt_stage
  - dma_length
  - micro_pc
  detection: 奇偶不匹配
  response: 终止命令并进入安全收尾
  req_ref:
  - LRS.SEC.PQC.INTEGRITY.001
  applicability:
    expr: 'true'
- id: LLD.SAFE.PQC.ECC
  mechanism: secded_ecc
  protects:
  - working_sram
  detection: 单比特（可纠正）与双比特（不可纠正）错误
  response: SEC 可纠正并记录；DED 不可纠正，进入 fatal 安全收尾，禁止消费损坏数据
  req_ref:
  - LRS.RESET.PQC.SAFE.001
  - LRS.DFX.PQC.MBIST.001
  applicability:
    expr: 'true'
- id: LLD.SAFE.PQC.NO_SECRET_GATING
  mechanism: static_gating_policy
  protects:
  - whole_datapath
  detection: 静态检查确认门控使能仅来自公开状态
  response: 违规视为设计缺陷，阻塞 G3
  req_ref:
  - LRS.SEC.PQC.CT.002
  applicability:
    expr: 'true'
ppa:
- id: LLD.PPA.PQC.POLY
  module_ref: LLD.MOD.PQC.POLY
  area_strategy: 每 lane 配置 23x23 乘法器，KEM 使用低 12 bit；Level 2 两算术 share 独立资源
  timing_strategy: 乘法、三段约减、规范化和加减分级；按六 batch slot 调度，不以未测频率宣称路径达标
  power_strategy: 按公开调度使能；两 share 对称活动，不使用秘密或 share 值门控
  ppdg_target: 面积主导（Tiny）到吞吐主导（Throughput）
  req_ref:
  - LRS.PERF.PQC.LATENCY.001
  applicability:
    expr: 'true'
- id: LLD.PPA.PQC.KECCAK
  module_ref: LLD.MOD.PQC.KECCAK
  area_strategy: 单 permutation 数据通路 + 双 context state（避免第二套 permutation）
  timing_strategy: Level 0/1 的 r=2 串接两轮路径；Level 2 单轮寄存隔离，不串接 masked chi
  power_strategy: 按公开轮 FSM 使能 permutation；计算不依赖 absorb/squeeze 同拍 valid
  ppdg_target: Level 0/1 轮展开与组合深度权衡；Level 2 包含 gadget 寄存和随机带宽代价
  req_ref:
  - LRS.PERF.PQC.OVERLAP.001
  - LRS.CFG.PQC.KECCAK_ROUNDS.001
  applicability:
    expr: 'true'
- id: LLD.PPA.PQC.SRAM
  module_ref: LLD.MOD.PQC.SRAM
  area_strategy: 每 share 8 bank，数据 32 bit 加 ECC；Level 2 镜像，32 KiB 逻辑档位按页复用
  timing_strategy: bank 仲裁为单周期确定性决策，避免长组合路径
  power_strategy: 未访问 bank 门控；zeroize 期间全 bank 使能
  ppdg_target: 面积与最大工作集约束的平衡点
  req_ref:
  - LRS.CFG.PQC.LOCAL_SRAM.001
  - LRS.FUNC.PQC.KEM_DATAFLOW.001
  applicability:
    expr: 'true'
gen: []
derived:
- id: LLD.DERIVED.PQC.LAZY
  statement: 保留旧 ID 追踪；取消跨乘积 lazy 累加，每次乘加规范化到 [0,q)。中间约减范围按 POLY 分级证书验证。
  derived_from:
  - HDR.PQC.LAZY_RANGE.001
  status: proposed
- id: LLD.DERIVED.PQC.BANKHASH
  statement: bank 三位分别为 i0^i3^i6、i1^i4^i7、i2^i5；row=i[7:3]。各 power-of-two 蝶形和 1/2/4 lane 调度按模型枚举。
  derived_from:
  - HDR.PQC.BANK_CONFLICT.001
  status: proposed
- id: LLD.DERIVED.PQC.KCTX
  statement: 实现两个 Keccak context（CTX_MSG、CTX_XOF），仅一套 permutation 数据通路， block 边界切换；同一 context 不被抢占
  derived_from:
  - HDR.PQC.KECCAK_CTX.001
  status: proposed
decisions:
- id: LLD.DECISION.PQC.DEFERRED_COMMIT
  decision: 候选签名先在 staging buffer 中完成全部格式检查与长度确定，再一次性 DMA commit
  rationale: 拒绝原因及候选签名不外露，总尝试次数影响总时延；最大签名 4627 B 占五个逻辑页
  alternatives:
  - 边算边写输出（存在部分结果可见窗口）
  consequences:
  - staging 容量固定
  - DMA commit 需要单调完成信号
  req_ref:
  - LRS.FUNC.PQC.DSA_SIGN.002
- id: LLD.DECISION.PQC.REDUCE_SCHEDULE
  decision: 约减采用固定位置插入而非数据相关分支
  rationale: 数据相关分支会引入秘密相关时序
  alternatives:
  - 数据相关条件约减（简单但非常数时间）
  consequences:
  - 需要逐级约减的同余及位宽证明；不允许跨乘积隐式 lazy 范围
  req_ref:
  - LRS.SEC.PQC.CT.001
