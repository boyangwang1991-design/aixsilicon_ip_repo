    destination: A_NTT_W
    condition: all_state_operations_complete_with_matching_tokens; no early exit on reject bits
  - source: A_NTT_W
    destination: A_CHALLENGE
    condition: all_state_operations_complete_with_matching_tokens; no early exit on reject bits
