arbiters:
- id: LLD.ARB.PQC.SRAM.BANK
  module_ref: LLD.MOD.PQC.SRAM
  policy: static_reservation_then_round_robin
  ports: 3
  fairness_required: false
  notes: POLY 的六 slot 调度先预留读写 bank；剩余端口由公开请求 round-robin 仲裁， grant_ack 仅对应真实接受。DMA 和 ECC scrub 不抢占预留端口；同地址读写禁止同拍接受。 向量访问组、返回
    credit 与双域原子授权见 03_sram.md；仲裁不检查系数值。
  req_ref:
  - LRS.FUNC.PQC.KEM_DATAFLOW.001
  - LRS.SEC.PQC.CT.001
  applicability:
    expr: 'true'
- id: LLD.ARB.PQC.PRIM.SCOREBOARD
  module_ref: LLD.MOD.PQC.KEMSEQ
  policy: static_dependency_token
  ports: 4
  fairness_required: false
  notes: 管理 KECCAK/NTT/SAMPLER_CODEC/DMA 四类资源；仅允许静态白名单内的重叠。
  req_ref:
  - LRS.PERF.PQC.OVERLAP.001
  applicability:
    expr: 'true'
ordering:
- id: LLD.ORDER.PQC.GLOBAL
  model: in_order
  notes: 单上下文执行；同一命令内部 primitive 按依赖 token 定序；同一 buffer 的 DMA 传输保序；不同 buffer 允许 outstanding 但不得重排同一 buffer 的写。
  ordering_boundary: per_command_and_per_buffer
  req_ref:
  - LRS.INTF.PQC.DMA.001
  - LRS.FUNC.PQC.CMD.006
  applicability:
    expr: 'true'
registers:
- id: LLD.REG.PQC.ID_VERSION
  register_ref: ID_VERSION
  behavior: lock
  sw_behavior: ro
  hw_behavior: 复位值由综合期参数与 IP 版本决定；运行期不变
  collision: hw_wins
  update_timing: reset_only
  reset_semantics: hard=综合期常量, soft=保持
  req_ref:
  - LRS.REG.PQC.ID.001
- id: LLD.REG.PQC.CAP0
  register_ref: CAPABILITY0
  behavior: lock
  sw_behavior: ro
  hw_behavior: 由 ENABLE_ALGO_MASK、NTT_LANES、SCA_LEVEL、ENABLE_HASH_ML_DSA 综合常量驱动
  collision: hw_wins
  update_timing: reset_only
  reset_semantics: hard=综合期常量, soft=保持
  req_ref:
  - LRS.REG.PQC.ID.001
  - LRS.CFG.PQC.ALGO_MASK.001
  - LRS.CFG.PQC.SCA_LEVEL.001
- id: LLD.REG.PQC.CAP1
  register_ref: CAPABILITY1
  behavior: lock
  sw_behavior: ro
  hw_behavior: 由 LOCAL_SRAM_KIB、DMA_DATA_WIDTH、KEY_SLOT_NUM、ENABLE_PIO 综合常量驱动
  collision: hw_wins
  update_timing: reset_only
  reset_semantics: hard=综合期常量, soft=保持
  req_ref:
  - LRS.REG.PQC.ID.001
  - LRS.CFG.PQC.LOCAL_SRAM.001
  - LRS.CFG.PQC.DMA_WIDTH.001
  - LRS.CFG.PQC.KEY_SLOT.001
- id: LLD.REG.PQC.CTRL_ENABLE
  register_ref: CTRL.ENABLE
  behavior: atomic
  sw_behavior: rw
  hw_behavior: 使能后从 DISABLED 进入 SELFTEST；自检通过后进入 IDLE
  collision: sw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.CTRL.001
  - LRS.RESET.PQC.COLD.001
- id: LLD.REG.PQC.CTRL_ABORT
  register_ref: CTRL.ABORT
  behavior: atomic
  sw_behavior: rw
  hw_behavior: singlepulse 请求由 FE 锁存；在安全边界点停止当前命令，随后清零临时状态并回到 IDLE；脉冲后一拍自清
  collision: sw_wins
  update_timing: transaction_boundary
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.FUNC.PQC.CMD.007
- id: LLD.REG.PQC.CTRL_ZEROIZE
  register_ref: CTRL.ZEROIZE
  behavior: atomic
  sw_behavior: rw
  hw_behavior: singlepulse 请求由 fault_ctrl 独立锁存，不依赖请求位保持；内部擦除有界，外部排空超时不报成功
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.SEC.PQC.ZEROIZE.001
- id: LLD.REG.PQC.CTRL_SELFTEST
  register_ref: CTRL.SELF_TEST
  behavior: atomic
  sw_behavior: rw
  hw_behavior: singlepulse 请求由 FE 锁存后触发 KAT；失败置 SELF_TEST_FAIL 并进入 LOCKED
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.RESET.PQC.COLD.001
- id: LLD.REG.PQC.STATUS
  register_ref: STATUS
  behavior: hw_set
  sw_behavior: ro
  hw_behavior: IDLE/BUSY/DONE/ERROR/LOCKED 由顶层 FSM 直接驱动；LOCKED 由 fault_ctrl 置位
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=IDLE 编码, soft=IDLE 编码
  req_ref:
  - LRS.REG.PQC.STATUS.001
- id: LLD.REG.PQC.COMMAND
  register_ref: COMMAND
  behavior: shadow
  sw_behavior: rw
  hw_behavior: 门铃时原子抓取；BUSY 期间 swwe 被 ~busy 关闭，值不变且返回 pslverr
  collision: sw_wins
  update_timing: transaction_boundary
  reset_semantics: hard=ABI版本1且其他字段0, soft=同hard
  req_ref:
  - LRS.FUNC.PQC.CMD.002
  - LRS.FUNC.PQC.CMD.004
- id: LLD.REG.PQC.DESC_ADDR
  register_ref: DESC_ADDR_LO_HI
  behavior: shadow
  sw_behavior: rw
  hw_behavior: 写入后作为下一次门铃的描述符地址；抓到 shadow 后不再受软件影响
  collision: sw_wins
  update_timing: transaction_boundary
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.FUNC.PQC.CMD.002
- id: LLD.REG.PQC.DOORBELL
  register_ref: DOORBELL
  behavior: atomic
  sw_behavior: rw
  hw_behavior: 写 1 产生 singlepulse；FE 锁存提交身份后启动抓取，CSR 请求位下一拍自清；BUSY 时写返回 pslverr
  collision: sw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.FUNC.PQC.CMD.006
- id: LLD.REG.PQC.KEY_HANDLE
  register_ref: KEY_HANDLE
  behavior: shadow
  sw_behavior: rw
  hw_behavior: 门铃时抓取完整 generation/owner/slot；类型由可信元数据匹配算法和用途，不再占 handle 编码；不匹配返回配置错误
  collision: sw_wins
  update_timing: transaction_boundary
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.SEC.PQC.SLOT.003
- id: LLD.REG.PQC.CONTEXT_LEN
  register_ref: CONTEXT_LEN
  behavior: shadow
  sw_behavior: rw
  hw_behavior: 关键校验 0–255；越界返回配置错误且不访问秘密
  collision: sw_wins
  update_timing: transaction_boundary
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.FUNC.PQC.DSA_MESSAGE.001
- id: LLD.REG.PQC.RESULT
  register_ref: RESULT
  behavior: hw_set
  sw_behavior: ro
  hw_behavior: completion 发布时写入 verify_valid 与 completion tag；COMMIT 前保持旧值
  collision: hw_wins
  update_timing: commit
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.RESULT.001
- id: LLD.REG.PQC.ERROR_CODE
  register_ref: ERROR_CODE
  behavior: hw_set
  sw_behavior: ro
  hw_behavior: 仅在公开诊断分类间取值；不得由秘密值派生；KEM_DECAPS 不写有效性
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.ERRCODE.001
  - LRS.FUNC.PQC.CMD.005
- id: LLD.REG.PQC.INTR_STATE
  register_ref: INTR_STATE
  behavior: w1c
  sw_behavior: rw1c
  hw_behavior: hwset on DONE/ERROR/RNG_FAULT/TAMPER/SELF_TEST_FAIL 事件
  collision: set_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.INTR.001
- id: LLD.REG.PQC.INTR_ENABLE
  register_ref: INTR_ENABLE
  behavior: atomic
  sw_behavior: rw
  hw_behavior: 只屏蔽中断输出，不影响 INTR_STATE 置位
  collision: sw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.INTR.001
  - LRS.FUNC.PQC.CMD.008
- id: LLD.REG.PQC.INTR_TEST
  register_ref: INTR_TEST
  behavior: atomic
  sw_behavior: rw
  hw_behavior: 每个 test 字段为 singlepulse，写 1 仅一拍置位对应 INTR_STATE，随后自清；不产生真实密码副作用
  collision: sw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.INTR.001
- id: LLD.REG.PQC.ALERT_RECOVERABLE
  register_ref: ALERT_RECOVERABLE
  behavior: w1c
  sw_behavior: rw1c
  hw_behavior: hwset on recoverable 故障（如可纠正 ECC、单次 DMA retry）
  collision: set_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.ALERT.001
- id: LLD.REG.PQC.ALERT_FATAL
  register_ref: ALERT_FATAL
  behavior: lock
  sw_behavior: rw1c
  hw_behavior: hwset on fatal 故障（tamper、ECC UE、self-test fail）；置位后进入 LOCKED， 密码命令被拒绝；需显式恢复流程才能退出
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.ALERT.001
  - LRS.SEC.PQC.LOCK.001
- id: LLD.REG.PQC.PERF_TOTAL
  register_ref: PERF_TOTAL_CYCLES
  behavior: atomic
  sw_behavior: rw
  hw_behavior: 使用显式 next/we 接收硬件累加值；idle 时通过 swwe 允许软件写 0 清零，busy 或非零写被抑制
  collision: sw_wins
  update_timing: idle_boundary
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.PERF.001
  - LRS.DFX.PQC.PERFCNT.001
- id: LLD.REG.PQC.PERF_SUB
  register_ref: PERF_KECCAK_NTT_DMASTALL
  behavior: atomic
  sw_behavior: rw
  hw_behavior: 分别通过 next/we 累加 Keccak cycles、NTT cycles 与 DMA stall；公开命令类型计数独立，idle 零写由 swwe 放行
  collision: sw_wins
  update_timing: idle_boundary
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.PERF.001
- id: LLD.REG.PQC.SLOT_CTRL
  register_ref: KEY_SLOT_CTRL
  behavior: lock
  sw_behavior: rw
  hw_behavior: 仅受特权/安全主体属性允许访问；普通主体访问返回 pslverr 并记录；debug 解锁不改变可访问性
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.SLOT.001
  - LRS.SEC.PQC.SLOT.004
- id: LLD.REG.PQC.SLOT_META
  register_ref: KEY_SLOT_META_WINDOW
  behavior: hw_set
  sw_behavior: ro
  hw_behavior: 回读指定 slot 的 owner/domain/algorithm/parameter_set/usage/exportable/ valid/version；不含私钥内容
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=invalid, soft=按策略
  req_ref:
  - LRS.SEC.PQC.SLOT.001
  - LRS.REG.PQC.SLOT.001
- id: LLD.REG.PQC.SLOT_DESTROY
  register_ref: KEY_SLOT_CTRL.DESTROY
  behavior: atomic
  sw_behavior: rw
  hw_behavior: 清零 slot 内容并递增 generation，使旧 handle 失效；操作中被引用时延迟到 当前命令结束再加锁执行
  collision: hw_wins
  update_timing: transaction_boundary
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.SEC.PQC.SLOT.003
  - LRS.SEC.PQC.SLOT.002
- id: LLD.REG.PQC.COMPLETION
  register_ref: COMPLETION_RECORD
  behavior: hw_set
  sw_behavior: ro
  hw_behavior: 在 DMA 输出完成后写入 command_id/status/output 长度/verify_valid/ error_info/cycles；随后才置 DONE
  collision: hw_wins
  update_timing: commit
  reset_semantics: hard=0, soft=clear
  req_ref:
  - LRS.REG.PQC.COMPLETION.001
  - LRS.FUNC.PQC.CMD.006
- id: LLD.REG.PQC.SLOT_DOMAIN
  register_ref: KEY_SLOT_DOMAIN.domain
  behavior: hw_set
  sw_behavior: ro
  hw_behavior: 受安全管理窗口保护，返回选中 slot 的可信 domain；非法索引或无效快照返回零
  collision: hw_wins
  update_timing: immediate
  reset_semantics: hard=0, soft=按授权元数据策略但材料保持无效
  req_ref:
  - LRS.SEC.PQC.SLOT.001
  - LRS.REG.PQC.SLOT.001
reset:
- id: LLD.RST.PQC.MAIN
  module_ref: LLD.MOD.PQC.TOP
  reset_domain: HLD.DOM.RST.PQC.MAIN
  type: async_low
  synchronizer: 2FF 同步释放
  scope: TOP 负责 reset 同步释放与分发；模块数据清除按各自 FSM 执行
  notes: 控制 valid 异步清除、同步释放；SRAM 不推导异步全阵列复位。FE 保持 DISABLED，所有擦除完成后由 enable 触发 SELFTEST。
  req_ref:
  - LRS.INTF.PQC.CLKRESET.001
  - LRS.RESET.PQC.COLD.001
  applicability:
    expr: 'true'
- id: LLD.RST.PQC.WARM
  module_ref: LLD.MOD.PQC.FAULT
  reset_domain: HLD.DOM.RST.PQC.MAIN
  type: warm
  synchronizer: 复用主复位同步器
  scope: 所有工作材料、流水/随机数、ephemeral slot；persistent 仅指授权元数据
  notes: warm reset 无条件清除内部 Key RAM 材料和所有临时值；外部策略只决定 persistent slot 元数据保持。重新使用仍须 Key Manager 重新授权/导入。
  req_ref:
  - LRS.RESET.PQC.WARM.001
  applicability:
    expr: 'true'
- id: LLD.RST.PQC.ZEROPATH
  module_ref: LLD.MOD.PQC.FAULT
  reset_domain: HLD.DOM.RST.PQC.MAIN
  type: functional_clear
  synchronizer: n/a（独立同步路径，不依赖主 FSM）
  scope: 双域 SRAM/Key RAM、Keccak 两 context、全部 gadget/转换/采样寄存器、随机 cache、staging 和待响应流水
  notes: 由 zeroize_req 或 fatal 事件触发；使用独立计数器，有界完成，从任意状态均可 进入。
  req_ref:
  - LRS.SEC.PQC.ZEROIZE.001
  - LRS.RESET.PQC.SAFE.001
  applicability:
    expr: 'true'
cdc:
- id: LLD.CDC.PQC.SIDEBAND
  module_ref: LLD.MOD.PQC.TOP
  source_domain: async_external
  destination_domain: HLD.DOM.CLK.PQC.CORE
  information_type: level
  implementation: 2FF synchronizer per bit; zeroize_req 另走独立同步路径
  notes: lifecycle/tamper 为电平信号，同步化后参与布尔汇聚；zeroize_req 不得经过主 FSM。
  req_ref:
  - LRS.INTF.PQC.SIDEBAND.001
  - LRS.SEC.PQC.ZEROIZE.001
  applicability:
    expr: 'true'
- id: LLD.CDC.PQC.ENTROPY
  module_ref: LLD.MOD.PQC.TOP
  source_domain: HLD.DOM.CLK.PQC.CORE
  destination_domain: HLD.DOM.CLK.PQC.CORE
  information_type: stream
  implementation: 核心时钟域内 valid/ready + domain tag 检查，跨域完整 stream CDC 由 SoC 负责
  notes: entropy_data/valid/tag 必须在核心时钟域同时稳定；异步源必须在 SoC 边界使用 完整异步 FIFO/握手桥，不能只同步 valid 或按 bit 同步随机数据。
  req_ref:
  - LRS.INTF.PQC.ENTROPY.001
  applicability:
    expr: 'true'
interrupts:
- id: LLD.IRQ.PQC.DONE
  module_ref: LLD.MOD.PQC.APB
  source: completion 发布完成
  trigger: completion record 写入且 DMA 输出完成
  level_or_pulse: level
  clear: W1C on INTR_STATE
  req_ref:
  - LRS.REG.PQC.INTR.001
- id: LLD.IRQ.PQC.ERROR
  module_ref: LLD.MOD.PQC.APB
