- id: LLD.IRQ.PQC.RNG
  module_ref: LLD.MOD.PQC.APB
  source: LLD.ERR.PQC.RNG
  trigger: 熵 health 异常
  level_or_pulse: level
  clear: W1C on INTR_STATE
  req_ref:
  - LRS.REG.PQC.INTR.001
- id: LLD.IRQ.PQC.TAMPER
  module_ref: LLD.MOD.PQC.APB
  source: tamper 输入同步化后置位
