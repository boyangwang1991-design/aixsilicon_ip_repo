interfaces:
- id: LLD.IF.PQC.WORKKEY.KM
  owner_module: LLD.MOD.PQC.WORKKEY
  hld_ref:
  - HLD.IF.EXT.PQC.KEY_MANAGER
  protocol: atomic_dual_share_stream
  clock_domain: HLD.DOM.CLK.PQC.CORE
  reset_domain: HLD.DOM.RST.PQC.MAIN
  applicability:
    expr: 'true'
- id: LLD.IF.PQC.FE.APB
  owner_module: LLD.MOD.PQC.APB
  interface_ref: HLD.IF.EXT.PQC.APB
  protocol: apb4
  signal_groups:
  - psel_penable_pwrite_paddr_pwdata_pstrb
  - prdata_pready_pslverr
  handshake: APB4 SETUP/ACCESS 两相
  notes: 特权/安全属性作为旁带输入参与 KEY_SLOT_CTRL 与 CTRL 敏感字段门控。
  req_ref:
  - LRS.INTF.PQC.APB.001
  applicability:
    expr: 'true'
- id: LLD.IF.PQC.DMA.AXI
  owner_module: LLD.MOD.PQC.DMA
  interface_ref: HLD.IF.EXT.PQC.DMA
  protocol: axi4
  signal_groups:
  - ar_aw_channel
  - r_w_channel
  - b_channel
  handshake: AXI4 valid/ready
  notes: 数据宽度 DMA_DATA_WIDTH；地址宽度 >= 40 bit；每请求携带安全/特权属性。
  req_ref:
  - LRS.INTF.PQC.DMA.001
  - LRS.INTF.PQC.DMA.002
  applicability:
    expr: 'true'
- id: LLD.IF.PQC.POLY.PAGE
  owner_module: LLD.MOD.PQC.POLY
  interface_ref: HLD.IF.INT.PQC.PAGE
  protocol: memory
  signal_groups:
  - page_sel_a_coeff_a_req_a_rdata
  - page_sel_b_coeff_b_req_b_rdata
  - page_sel_w_coeff_w_we_wdata
  handshake: 请求 valid/ready；同步 RAM 与 ECC 共两拍返回；预留 read/write slot
  notes: butterfly 两输入分配到保留 bank；详见 POLY 六 batch slot 调度，不能假设单拍组合读。
  req_ref:
  - LRS.FUNC.PQC.KEM_DATAFLOW.001
  applicability:
    expr: 'true'
- id: LLD.IF.PQC.KECCAK.SQZ
  owner_module: LLD.MOD.PQC.KECCAK
  interface_ref: HLD.IF.INT.PQC.SQZ
  protocol: stream
  signal_groups:
  - sqz_valid_sqz_data64_sqz_ready
  - sqz_last_sqz_out_len
  handshake: valid/ready，自动续块
  notes: 采样器消费不足时反压；context 在 block 边界切换。
  req_ref:
  - LRS.FUNC.PQC.KEM_KEYGEN.001
  applicability:
    expr: 'true'
timing:
- id: LLD.TIMING.PQC.APB.RW
  interface_ref: HLD.IF.EXT.PQC.APB
  scenario: APB4 单次读/写，含 PREADY 反压
  cycles: setup 1 + access 1..N
  notes: 写 BUSY 锁定的配置字段时返回 pslverr 且字段值不变；读 reserved 返回 0。
  req_ref:
  - LRS.INTF.PQC.APB.001
  - LRS.FUNC.PQC.CMD.004
  applicability:
    expr: 'true'
- id: LLD.TIMING.PQC.DMA.SPLIT
  interface_ref: HLD.IF.EXT.PQC.DMA
  scenario: 跨 4 KiB 边界自动拆分为多个 INCR burst
  cycles: 取决于长度与从端反压
  notes: 拆分不改变字节顺序；尾部不满 beat 使用 WSTRB/keep 掩码。
  req_ref:
  - LRS.INTF.PQC.DMA.001
  - LRS.INTF.PQC.DMA.003
  applicability:
    expr: 'true'
datapaths:
- id: LLD.DP.PQC.CODEC.BITPACK
  module_ref: LLD.MOD.PQC.CODEC
  width: 32
  operators:
  - pack
  - unpack
  - compress
  - decompress
  - power2round
  - decompose
  - make_hint
  - use_hint
  - norm_check
  representation: PACKED_to_COEFF_STD
  notes: 任意 bit offset 的 little-endian bit packing；解码输出 canonical_ok 但始终 消费配置长度；norm check 遍历全部系数并 OR-reduce violation，不在首个违例处停止。
  req_ref:
  - LRS.FUNC.PQC.KEM_DATAFLOW.001
  - LRS.FUNC.PQC.DSA_VERIFY.001
  applicability:
    expr: 'true'
- id: LLD.DP.PQC.APB.ACCESS_FILTER
  module_ref: LLD.MOD.PQC.APB
  input_width: 32
  output_width: 32
  operators:
  - secure_privilege_check
  - aligned_address_check
  - busy_write_filter
  - local_error_response
  representation: public_control_and_metadata_only
  req_ref:
  - LRS.INTF.PQC.APB.001
  applicability:
    expr: 'true'
- id: LLD.DP.PQC.DMA.BYTE_STREAM
  module_ref: LLD.MOD.PQC.DMA
  input_width: 256
  output_width: 32
  operators:
  - extended_range_check
  - boundary_limited_burst
  - little_endian_split_assemble
  - tail_byte_enable
  representation: authorized_packed_bytes
  req_ref:
  - LRS.INTF.PQC.DMA.001
  - LRS.INTF.PQC.DMA.003
  - LRS.SEC.PQC.SLOT.005
  applicability:
    expr: 'true'
- id: LLD.DP.PQC.FE.VALIDATE
  module_ref: LLD.MOD.PQC.FE.VALIDATE
  input_width: 1024
  output_width: 1
  operators:
  - little_endian_decode
  - exact_public_length_lookup
  - capacity_compare
  - extended_range_add
  - write_read_overlap_check
  representation: public_descriptor_fields
  req_ref:
  - LRS.FUNC.PQC.CMD.002
  - LRS.FUNC.PQC.CMD.003
  - LRS.FUNC.PQC.DSA_MESSAGE.001
  applicability:
    expr: 'true'
- id: LLD.DP.PQC.KECCAK.PERM
  module_ref: LLD.MOD.PQC.KECCAK
  width: 1600
  operators:
  - theta
  - rho
  - pi
  - chi
  - iota
  representation: keccak_state
  notes: 双 share 的线性步骤独立执行；Level 0/1 每拍 1/2 轮，Level 2 按 RAND/LINEAR/CHI_A/CHI_B/COMMIT 执行一轮。
  req_ref:
  - LRS.SEC.PQC.ZEROIZE.001
  - LRS.PERF.PQC.OVERLAP.001
  applicability:
    expr: 'true'
- id: LLD.DP.PQC.KECCAK.MASKED_ROUND
  module_ref: LLD.MOD.PQC.KECCAK.MASKED_ROUND
  input_width: 1600
  output_width: 1600
  operators:
  - independent_share_theta_rho_pi
  - registered_hpc3_chi
  - single_share_iota
  representation: two_boolean_shares_without_reconstruction
  req_ref:
  - LRS.CFG.PQC.SCA_LEVEL.001
  applicability:
    expr: SCA_LEVEL == 2
- id: LLD.DP.PQC.KEMSEQ.COMPARE_SELECT
  module_ref: LLD.MOD.PQC.KEMSEQ
  input_width: 8
  output_width: 8
  operators:
  - full_length_xor_or_reduce
  - masked_equality_reduce
  - full_length_secret_select
  representation: public_ciphertext_and_secret_two_share_candidates_at_level2
  req_ref:
  - LRS.FUNC.PQC.KEM_DECAPS.001
  - LRS.FUNC.PQC.KEM_DECAPS.002
