- id: LRS.PERF.PQC.OVERLAP.001
  category: PERF
  feature: perf_overlap
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§6
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - performance_analysis
  description: 计算与 DMA 应可在安全的资源条件下重叠，保留 1/2 轮结构配置，并按安全等级 分别制定可达周期预算。令 R 为 rate 字节数、r 为轮结构配置： - Level 0/1：完整消息块预算 C_block =
    ceil(R/8) + 24/r + 2 个核心周期。 - Level 2：完整消息块预算由吸收、受保护置换、随机服务和控制的完整调度推导， 不要求沿用 24/r。HLD 应给出有数值的保守目标和随机服务条件，LLD 固化逐阶段 周期上界，RTL
    按同一边界验收。无数值预算、遗漏转换/刷新或仅计算原语理想周期 均不视为通过。分级预算不允许降低 Level 2 掩码实现与验证范围。 连续完整块有效吞吐应不低于 R/C_block B/cycle；不再以 AXI 峰值固定比例验收。
    安全随机输入的外部缺供单列，DUT 内部收集、分配、刷新和仲裁计入预算。 掩码初始化计入首块，不藏入测量窗口外的重复初始化；每次重新初始化均须报告。 验收测量窗口不含首块启动和末块 padding，但须计入内部存储、仲裁和控制等待。 外部源/AXI
    背压单独报告原始总周期与外部等待周期，不得以 DUT 自己产生的背压 作为扣除项。总线与消息源能够持续供数时不得扣除任何内部等待。
  acceptance_criteria:
  - 消息吸收期间出现 Keccak 与 DMA 并行活动；
  - 各安全等级稳态完整块周期不超过对应 C_block，实测周期与分项计数一致；
  - 四种哈希函数、r=1/2 与三个安全等级分别验收，所有 DMA 宽度保持结果一致；
  - 明确报告总吞吐与外部等待调整后的吞吐，不修改原始计数；
  - 重叠不改变算法结果。
  trace:
    hld_ref: []
    test_ref: []
