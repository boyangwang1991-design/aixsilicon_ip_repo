- id: LRS.SEC.PQC.CT.001
  category: SEC
  feature: constant_time
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§7.1
  applicability:
    expr: 'true'
  verify_method:
  - formal
  - simulation
  description: 私钥与解封装比较结果不得影响未经授权的外部状态、错误分类或 DMA 地址。 KEM Decaps 对相同公开输入长度和相同外部服务条件，合法/非法密文保持相同完成调度。 ML-DSA Sign 采用每次尝试固定调度、总尝试次数与总延迟可变的明确例外。每次尝试
    应完成预定计算和全部检查后统一决定重试；失败原因、检查失败位置及部分签名不可见。 不得把不同失败位置的提前退出或 sampler 的可变耗时当作固定调度。 固定尝试预算必须包含原语和采样完成/填充；预算耗尽进入统一错误和清除路径， 不得通过秘密相关错误码暴露细节。总时延分布仍须分析/验证与私钥的独立性；
    允许可变总延迟不等于已证明无侧信道。
  acceptance_criteria:
  - 对同一公开配置和同样外部等待，各拒绝原因/位置的单次 Sign 尝试具有相同调度长度与外部访问形状；
  - 单次尝试的采样/原语等待、填充和终止边界全部计量，不能只检查 FSM 状态序列；
  - 成功前不输出候选签名；超限仅返回统一错误并清除所有临时秘密；
  - KEM Decaps 的密文有效性不影响完成周期、DMA 形状或错误码；
  - 形式检查覆盖禁止的控制依赖，统计检查比较 Sign 总时延/尝试次数分布；
  - P50/P95/P99 描述性能，不作为侧信道安全证明。
  trace:
    hld_ref: []
    test_ref: []
