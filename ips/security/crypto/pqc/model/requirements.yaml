schema_version: '2.0'
ip_name: pqc
delivery_model: parameterized
register_model: required
ppa_signoff: none
document_version: 1.1.0
status: reviewed
requirement_baseline: PQC-20260916-WORKKEY
requirements:
- id: LRS.CFG.PQC.NTT_LANES.001
  category: CFG
  feature: ntt_lanes
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§9.1
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - simulation
  description: '`NTT_LANES` 应支持 `{1, 2, 4}` 三个综合期档位，分别对应面积型、推荐基线与吞吐型配置。 所有档位应保持完全相同的软件 ABI 与算法结果。'
  acceptance_criteria:
  - 三个合法值均可完成 elaboration 且结果一致；
  - 非法值（如 0、3、8）在 elaboration 阶段被拒绝；
  - 默认值为 2。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.KECCAK_ROUNDS.001
  category: CFG
  feature: keccak_rounds
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§5.2
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - simulation
  description: '`KECCAK_ROUNDS_PER_CYCLE` 应支持 `{1, 2}`；V1.0 不应支持完全展开的 24 轮/周期。'
  acceptance_criteria:
  - 两个合法值均可 elaboration 并产生相同哈希结果；
  - 大于 2 的值被拒绝；
  - 默认值为 2。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.LOCAL_SRAM.001
  category: CFG
  feature: local_sram
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§5.4
  - pqc_contract.md#§19.1
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - static
  description: '`LOCAL_SRAM_KIB` 应支持 `{32, 64, 96}` KiB。每个合法容量下，最大 ML-DSA 工作集应通过 页生命周期复用完成，不应以常驻完整矩阵 `A(k×l)` 为前提。'
  acceptance_criteria:
  - 三个容量均可容纳各参数集最大工作集；
  - 容量不足导致的页分配冲突被检测为内部错误而非静默错误结果；
  - 默认值为 64。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.DMA_WIDTH.001
  category: CFG
  feature: dma_width
  priority: P1
  status: active
  source_ref:
  - pqc_contract.md#§8.1
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - simulation
  description: '`DMA_DATA_WIDTH` 应支持 `{64, 128, 256}`，并影响持续消息哈希带宽；算法结果不应随宽度改变。'
  acceptance_criteria:
  - 三个宽度均可完成 DMA 与算法闭环；
  - 非 2 的幂宽度被拒绝；
  - 默认值为 128。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.KEY_SLOT.001
  category: CFG
  feature: key_slot_num
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§3.2
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - simulation
  description: '`KEY_SLOT_NUM` 应至少为 8，支持 ML-KEM secret key、ML-DSA secret key 与 public key 三类 slot 类型。'
  acceptance_criteria:
  - 小于 8 的配置被拒绝；
  - 合法配置下每个 slot 可独立承载类型与用途元数据；
  - 默认值为 8。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.SCA_LEVEL.001
  category: CFG
  feature: sca_level
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§7.2
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - review
  description: '`SCA_LEVEL` 应支持 `{0, 1, 2}`。V1.0 产品化配置应至少为 Level 1。若声明 Level 2， 应同时明确 masking scheme、share 数、fresh randomness
    上界与 glitch 假设。'
  acceptance_criteria:
  - Level 0/1 下常数时间与固定访问性质成立；
  - 声明 Level 2 时掩码方案可被独立验证；
  - 默认值为 1。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.ALGO_MASK.001
  category: CFG
  feature: algo_mask
  priority: P1
  status: active
  source_ref:
  - pqc_contract.md#§2.1
  - pqc_contract.md#§9.1
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - simulation
  description: '`ENABLE_ALGO_MASK` 应以位图裁剪综合的参数集，且裁剪后 CAPABILITY 寄存器应准确反映 已实现的算法与参数集。V1.0 交付基线为全开（63）。'
  acceptance_criteria:
  - 每个位组合的 CAPABILITY 与实际可执行命令一致；
  - 对未综合的参数集命令返回配置错误而非未定义行为；
  - 默认值为 63。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.FEATURE_FLAGS.001
  category: CFG
  feature: feature_flags
  priority: P1
  status: active
  source_ref:
  - pqc_contract.md#§9.1
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - simulation
  description: '`ENABLE_HASH_ML_DSA` 应控制 HashML-DSA 预哈希接口的综合；`ENABLE_PIO` 应控制 PIO FIFO 通道的综合。裁剪后 opcode 与 capability bit 应保留并报告为不可用。'
  acceptance_criteria:
  - 关闭时对应 opcode 返回配置错误且 CAPABILITY 位为 0；
  - 开启时功能与 pure ML-DSA 域分离一致；
  - 默认值分别为 false 与 true。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.CFG.PQC.EXEC_MODE.001
  category: CFG
  feature: exec_mode
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§4.2
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - review
  description: V1.0 运行时执行模型应为单上下文：同一时刻最多一个执行中命令，允许一个 pending descriptor。 多队列并发不作为 V1.0 要求。
  acceptance_criteria:
  - BUSY 期间提交新命令按定义行为处理（拒绝或排队到单 pending）；
  - 不存在两个命令同时占用密码数据路径；
  - 多队列并发能力在 CAPABILITY 中报告为不支持。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.APB.001
  category: INTF
  feature: apb
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§8.1
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: 控制接口应为 APB4 slave，32 bit 数据宽度，寄存器自然对齐。应支持读取 ID/能力/状态/ 结果/错误，写入控制/命令/描述符地址/key handle/中断控制。 应处理 APB4 的 PPROT/PSTRB；不支持
    APB5 专属扩展或 burst 传输；非法地址访问应由默认从端返回 错误响应而不挂死总线。
  acceptance_criteria:
  - 所有合法寄存器读写符合 APB4 时序；
  - 未定义地址返回 PSLVERR 且不产生副作用；
  - DUT 不产生违反 APB4 的协议输出。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.DMA.001
  category: INTF
  feature: dma_axi
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§8.1
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: 数据接口应为 AXI4 master，数据宽度由 `DMA_DATA_WIDTH` 定义，使用 INCR burst， 遵守 4 KiB 边界，支持 outstanding 但同一 buffer 内保序。 明确不支持：FIXED/WRAP
    burst、exclusive access、cache 属性修改。
  acceptance_criteria:
  - 所有生成的 burst 满足 4 KiB 边界与 INCR 语义；
  - 同一 buffer 的传输按提交顺序完成；
  - 不支持属性不被发出。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.DMA.002
  category: INTF
  feature: dma_axi
  priority: P1
  status: active
  source_ref:
  - pqc_contract.md#§8.1
  applicability:
    expr: 'true'
  verify_method:
  - elaboration
  - simulation
  description: DMA 数据宽度应由 `DMA_DATA_WIDTH` 定义，支持 `{64, 128, 256}` bit。地址宽度应支持 至少 40 bit，以覆盖安全 SoC 地址空间。
  acceptance_criteria:
  - 所有合法宽度可正确拆分/合并传输；
  - 非支持宽度无法 elaboration；
  - 地址高位可被软件配置且不被截断。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.DMA.003
  category: INTF
  feature: dma_axi
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§3.3
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: DMA 分段输入不得改变算法结果。任意合法分段边界（含非 4 KiB 对齐、非 DMA 宽度整数倍 的尾部）应产生与单次连续传输字节级相同的结果。
  acceptance_criteria:
  - 同一消息以多种分段方式输入得到相同签名/摘要；
  - 尾部不满一个 beat 的 keep 处理正确；
  - 分段不改变 constant-time 性质。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.ENTROPY.001
  category: INTF
  feature: entropy
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§7.3
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: 熵接口应为 valid/ready 握手并提供 health status 与 domain tag。硬件只能在授权的 生命周期/策略组合下消费该接口；KAT 测试 seed 只能在允许的测试模式使用。
  acceptance_criteria:
  - 熵请求仅在合法策略下发出；
  - health 异常时请求停止；
  - domain tag 与命令的算法/参数集匹配。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.SIDEBAND.001
  category: INTF
  feature: sideband
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§8.1
  - pqc_contract.md#§4.2
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: IP 应提供 lifecycle、tamper、`zeroize_req` 输入与 IRQ 输出。中断应包含 DONE、ERROR、 RNG_FAULT、TAMPER、SELF_TEST_FAIL 五类，并支持 enable/status/test
    与 W1C 清除。
  acceptance_criteria:
  - 五类中断均可独立置位、屏蔽、清除；
  - '`zeroize_req` 有效时进入安全收尾路径；'
  - tamper 有效时中断与 status 按定义上报。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.CLKRESET.001
  category: INTF
  feature: clk_reset
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§10
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - static
  description: IP 应使用单一主功能时钟 `clk` 与异步低有效复位 `rst_n`。所有密码数据路径为同步逻辑； lifecycle/tamper/zeroize 输入为异步电平并做同步化处理。
  acceptance_criteria:
  - 单时钟域，不含未声明的跨时钟路径；
  - 复位极性为低有效异步；
  - 异步输入同步化不引入亚稳态传播。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.PQC.KEY_MANAGER.001
  category: INTF
  feature: key_manager
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§3.2
  - docs/lrs/00_document_control.md#用户决定
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: IP 应提供独立于普通 DMA 的工作态私钥导入、KeyGen 结果托管及撤销接口， 支持背压、明确的事务边界与完整接收确认。信任边界为授权外部 Key Manager； 普通软件不得通过 CSR 构造授权来源。跨时钟接入应由集成边界的明确
    CDC 协议完成。
  acceptance_criteria:
  - 导入/托管均按握手计数，在背压时保持事务元数据与有效材料稳定；
  - 撤销优先于新的导入或托管确认；
  - 接口接入可信来源，普通 APB/AXI 主机无法绕过授权发起私钥传输；
  - 未完成托管确认不能产生成功 completion。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.001
  category: FUNC
  feature: command_set
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§4.1
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: IP 应实现全部八个 opcode：KEM_KEYGEN、KEM_ENCAPS、KEM_DECAPS、DSA_KEYGEN、DSA_SIGN、 DSA_VERIFY、ZEROIZE、SELF_TEST，且每个 opcode
    在 CAPABILITY 中可被软件查询。
  acceptance_criteria:
  - 每个 opcode 均可被 doorbell 提交并产生 completion；
  - 未实现 opcode 返回配置错误；
  - CAPABILITY 与实现的 opcode 集合一致。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.002
  category: FUNC
  feature: command_descriptor
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§4.2
  - pqc_contract.md#§20.1
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: 每个命令应包含 opcode、parameter set、flags、输入/输出地址与长度、key handle、 context 地址/长度与 completion tag。描述符应自然对齐并在启动前被原子抓取；
    抓取后软件修改内存不得影响当前命令。
  acceptance_criteria:
  - 描述符全字段被抓取且校验（对齐、ABI、reserved、CRC、长度、capability）；
  - 抓取后修改内存不改变执行结果；
  - 非法字段在访问秘密前被终止。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.003
  category: FUNC
  feature: command_validate
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§4.2
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: 非法参数、地址未对齐、输出 buffer 过小、权限失败应在访问任何秘密数据之前终止命令， 并返回对应错误类别。
  acceptance_criteria:
  - 每类非法输入均在任何秘密读取前终止；
  - 错误类别可区分配置/权限/长度/对齐；
  - 终止后不留下部分结果。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.004
  category: FUNC
  feature: command_lock
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§4.2
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: BUSY 期间应锁定命令相关配置，软件修改不得影响正在执行的命令参数。
  acceptance_criteria:
  - BUSY 中写入被忽略或返回错误，当前命令结果不变；
  - 锁定在 COMPLETE 后释放；
  - 锁定覆盖 opcode/parameter set/地址/长度/key handle。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.005
  category: FUNC
  feature: command_status
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§4.2
  - pqc_contract.md#§20.2
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: 完成状态应区分配置错误、DMA 错误、熵错误、自检错误与内部故障；不得区分 ML-KEM 密文有效/无效，也不得暴露 ML-DSA 每次拒绝原因。`KEM_DECAPS` 对所有长度正确的密文 应返回 SUCCESS。
  acceptance_criteria:
  - 五类错误可独立观察；
  - 不存在 `KEM_INVALID` 状态或等效 oracle；
  - '`DSA_VERIFY` 的 invalid 作为公开 API 输出返回。'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.006
  category: FUNC
  feature: doorbell
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§20.3
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: 门铃提交应按固定顺序完成：结果 staging → DMA 输出 → 写 completion record → 置 DONE 并中断。descriptor 可复用，completion 写入前 DONE 不得置位。
  acceptance_criteria:
  - 任意时刻观察到的顺序符合定义；
  - DONE 置位时 completion record 已可见；
  - 中断清除后可提交下一命令。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.007
  category: FUNC
  feature: abort
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§10
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: 软件 abort 应仅在安全边界点生效，随后清零临时状态，不得留下可恢复的部分结果。
  acceptance_criteria:
  - abort 后无部分输出被提交；
  - 所有临时秘密被清零；
  - abort 后 IP 可接受新命令。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.CMD.008
  category: FUNC
  feature: command_irq
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§4.2
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: IP 应同时支持中断与轮询两种完成通知；两种方式观察到同一 completion record。
  acceptance_criteria:
  - 中断与轮询得到一致的 status/tag/长度；
  - 中断在轮询模式可被屏蔽；
  - 不产生丢失或重复的完成通知。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.DSA_KEYGEN.001
  category: FUNC
  feature: dsa_keygen
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§17.5
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: DSA_KEYGEN 应对 ML-DSA-44/65/87 全部参数集，从 32 B seed `xi` 产生符合 FIPS 204 的 公钥 `pk = rho || t1` 与私钥 `rho,K,tr,s1,s2,t0`。公钥可作为普通输出；
    私钥仅按 LRS.SEC.PQC.SLOT.008 托管给外部 Key Manager，完成结果返回不透明 handle。
  acceptance_criteria:
  - 三个参数集 KAT 通过；
  - 公钥输出与私钥专用托管长度与参数集定义一致；
  - 同一 seed 产生确定性相同结果。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.PQC.DSA_SIGN.001
  category: FUNC
  feature: dsa_sign
  priority: P0
  status: active
  source_ref:
  - pqc_contract.md#§17.6
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: DSA_SIGN 应对三个参数集，从 sk slot、消息 `M`、context `ctx` 与可选新鲜随机量产生 签名 `c_tilde || z || h`，字节级符合 FIPS 204。签名应实现完整拒绝采样循环：
