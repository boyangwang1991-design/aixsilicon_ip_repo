decisions:
- id: HLD.DECISION.PQC.DUALMODE
  title: 单一双模多项式引擎而非双引擎
  status: decided
  req_ref:
  - LRS.CFG.PQC.NTT_LANES.001
  - LRS.PERF.PQC.LATENCY.001
  decision: 用统一 32 bit 物理蝶形承载 q=3329 与 q=8380417 两个域，lane 数可综合配置
  rationale: KEM 与 DSA 不会同时执行（单上下文模型），共享引擎面积显著低于双引擎； 统一 ABI 与结果不受 lane 数影响
  alternatives:
  - 双独立引擎（面积大、验证成本高）
  - 仅 DSA 引擎 + 软件 KEM（违反 LRS.PERF.PQC.NOSW.001）
  consequences:
  - 常量 ROM 必须按算法切换且经生成与审计
  - lane=1 时需保证时序仍可闭合
- id: HLD.DECISION.PQC.STREAMMAT
  title: 矩阵流式生成不常驻
  status: decided
  req_ref:
  - LRS.FUNC.PQC.KEM_DATAFLOW.001
  - LRS.CFG.PQC.LOCAL_SRAM.001
  decision: A_hat / A^T_hat 逐 polynomial 生成、使用、释放
  rationale: 最大 k×l 矩阵常驻需要远超 LOCAL_SRAM_KIB 的空间；流式生成配合页生命周期 复用使 32 KiB 档位可行
  alternatives:
  - 常驻整矩阵（排除 32 KiB SKU）
  consequences:
  - ExpandA 需要按 (i,j) 域分离并可重放
  - 需要严格的页 tag 与 representation 检查
- id: HLD.DECISION.PQC.SCA1
  title: V1.0 产品化默认 SCA Level 1
  status: decided
  req_ref:
  - LRS.CFG.PQC.SCA_LEVEL.001
  decision: V1.0 产品化至少 Level 1；Level 2 作为可选综合参数保留
  rationale: Level 1 可在不引入 masking 复杂度的前提下满足产品基线；Level 2 需要 masking scheme 与 fresh randomness 预算，显著改变 Keccak/NTT/SRAM/随机数带宽，
    必须单独安全评审后才能宣称
  alternatives:
  - 强制 Level 2（超出 V1.0 验证能力）
  - 仅 Level 0（不满足产品基线）
  consequences:
  - Level 2 声明必须在 VPLAN 中有 TVLA/CPA/EMA 计划
  - 随机数预算按 Level 1 冻结
- id: HLD.DECISION.PQC.ATOMIC
  title: Sign 候选签名采用不可见 staging + 原子 commit
  status: decided
  req_ref:
  - LRS.FUNC.PQC.DSA_SIGN.002
  decision: 候选签名写入不可见 staging buffer，全部检查通过后一次性 commit
  rationale: 拒绝轮次必须不产生任何部分 z/h；与 DMA 的 STAGE 接口把原子性变成接口契约
  alternatives:
  - 直接写输出 buffer 后回滚（存在部分结果可见窗口）
  consequences:
  - 需要 staging 容量等于最大签名长度 4627 B
  - DMA 需要支持 commit 语义
- id: HLD.DECISION.PQC.SHADOW
  title: 命令配置采用 shadow + transactional commit
  status: decided
  req_ref:
  - LRS.FUNC.PQC.CMD.002
  - LRS.FUNC.PQC.CMD.004
  decision: descriptor 相关配置在门铃后原子抓取到 shadow registers
  rationale: 满足"抓取后软件修改内存不得影响当前命令"与 BUSY 锁定语义
  alternatives:
  - write-through（无法保证抓取原子性）
  consequences:
  - 需要 descriptor shadow 存储与 CRC/ABI 校验
- id: HLD.DECISION.PQC.ZEROPATH
  title: zeroize 路径独立于主 FSM
  status: decided
  req_ref:
  - LRS.SEC.PQC.ZEROIZE.001
  decision: zeroize/lock 由 pqc_fault_ctrl 独立驱动，不依赖主时序状态机正常运行
  rationale: 主 FSM 可能已被故障破坏；若 zeroize 依赖它则无法保证有界完成
  alternatives:
  - 主 FSM 内实现 zeroize 状态（安全性依赖 FSM 正确性）
  consequences:
  - 需要独立的清零计数器与完成信号
  - 需要形式验证"从任意状态有界完成"
- id: HLD.DECISION.PQC.NOSG
  title: V1.0 仅线性 buffer，不实现 scatter-gather
  status: decided
  req_ref:
  - LRS.INTF.PQC.DMA.003
  decision: V1.0 支持线性 buffer 与分段连续区间；SG 列表作为增强项保留在 capability
  rationale: SG 显著增加地址校验与侧信道分析面；线性 buffer 已满足安全启动与 TLS 场景
  alternatives:
  - V1.0 实现完整 SG（扩大验证面）
  consequences:
  - capability 必须准确报告 SG 不支持
  - 分段等价性仍必须成立
- id: HLD.DECISION.PQC.WORKKEY
  title: 外部长期所有权与内部单份工作态 Key RAM
  status: decided
  req_ref:
  - LRS.SEC.PQC.SLOT.006
  - LRS.SEC.PQC.SLOT.007
  - LRS.SEC.PQC.SLOT.008
  decision: 单个逻辑 8 KiB ECC 工作态材料区，Level 2 物理双 share 共 16 KiB，专用导入与仅新生成密钥的托管接口，普通总线无材料地址窗口
  rationale: 满足用户指定边界；单上下文无需每 slot 复制最大私钥 RAM
  alternatives:
  - 每 slot 常驻完整私钥（不符合长期所有权边界且扩大存储）
  - 普通 DMA 导入（用户明确禁止）
  consequences:
  - sequencer 必须接通授权材料读取，元数据不能替代材料
  - KeyGen 成功提交须等待外部 Key Manager 明确确认
  - 工作态副本退休不改变外部长期密钥所有权
- id: HLD.DECISION.PQC.HASH_BUDGET
  title: 保留 1/2 轮结构并采用可达周期预算
  status: decided
  req_ref:
  - LRS.PERF.PQC.OVERLAP.001
  - LRS.CFG.PQC.KECCAK_ROUNDS.001
  decision: 64-bit rate 接口；Level 0/1 完整块预算 ceil(R/8)+24/r+2，Level 2 预算 ceil(R/8)+1896+2，按分级合同验收
  rationale: 用户明确选择周期预算；单 sponge 受置换依赖限制，DMA 加宽不能使算法吞吐无限增加
  alternatives:
  - 保留总线峰值 50% 并增加轮数（用户未选择）
  - 用 DUT 内部背压降低测试分母（无效验收）
  consequences:
  - byte RTL 接口需扩展；增加两 word 供数与尾字节 mask
  - 当前算法周期目标仍须完整仿真核验，不能仅凭局部上界宣称达标
