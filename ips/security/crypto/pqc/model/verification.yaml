schema_version: '2.0'
ip_name: pqc
verification_level: full
status: draft
delivery_model: parameterized
lrs_baseline: PQC-20260916-WORKKEY
hld_baseline: PQC-HLD-1.1.0
lld_baseline: PQC-LLD-1.1.0
features:
- id: FL.PQC.CFG
  name: configuration_space
  description: 综合期参数合法空间、命名配置与跨参数约束
  priority: must
  req_ref:
  - LRS.CFG.PQC.NTT_LANES.001
  - LRS.CFG.PQC.KECCAK_ROUNDS.001
  - LRS.CFG.PQC.LOCAL_SRAM.001
  - LRS.CFG.PQC.DMA_WIDTH.001
  - LRS.CFG.PQC.KEY_SLOT.001
  - LRS.CFG.PQC.SCA_LEVEL.001
  - LRS.CFG.PQC.ALGO_MASK.001
  - LRS.CFG.PQC.FEATURE_FLAGS.001
  - LRS.CFG.PQC.EXEC_MODE.001
  design_ref:
  - HLD.CFG.PQC.NTT_LANES
  - HLD.CFG.PQC.KECCAK_ROUNDS
  - HLD.CFG.PQC.LOCAL_SRAM
  - HLD.CFG.PQC.DMA_WIDTH
  - HLD.CFG.PQC.SCA
  - HLD.CFG.PQC.ALGO_MASK
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - static
  testcases:
  - id: TC.PQC.CFG.001
    name: tc_param_elab
    type: directed
    description: Tiny/Balanced/Throughput 三档配置可 elaboration 且 CAPABILITY 一致
    priority: must
    tier: extended
    implementation: scripts/run_pqc_param_elab.py
    proof_kind: static
    feature_ref:
    - FL.PQC.CFG
    design_ref:
    - HLD.CFG.PQC.NTT_LANES
    - HLD.CFG.PQC.KECCAK_ROUNDS
    preconditions:
    - vlogan 可用
    stimulus:
    - 分别以三档参数 elaboration 顶层
    expected_result:
    - 三档均编译通过
    - 非法参数值被拒绝
    timeout_policy: 1800 s
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  - id: TC.PQC.CFG.002
    name: tc_pqc_config_equivalence
    type: directed
    description: 跨参数配置结果等价、能力裁剪与最大工作集
    priority: must
    tier: extended
    implementation: verification/tc/tc_pqc_config_equivalence.sv
    proof_kind: uvm
    feature_ref:
    - FL.PQC.CFG
    design_ref:
    - HLD.CFG.PQC.NTT_LANES
    - HLD.CFG.PQC.SCA
    preconditions:
    - UVM 1.2、对应真实接口与独立 oracle 已就绪；构建与输入身份固定
    stimulus:
    - 三命名配置对同一向量重放全部18操作；执行配置计划的合法边界/feature on-off/Level0-2风险组合
    - 最大算法与32KiB SRAM；三个DMA宽度、两个Keccak轮数、所有NTT lane及key-slot端点
    - 裁剪算法后检查capability与禁止操作，无效参数走elaboration拒绝
    expected_result:
    - 所有保留操作逐字节一致；裁剪操作在秘密访问前拒绝且capability匹配
    - 最大工作集不越界，无页别名/旧数据；运行证据逐配置绑定，elaboration不能替代等价执行
    timeout_policy: 100000000 cycles per command; 3600 s process watchdog
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  - id: TC.PQC.SCA.001
    name: tc_masked_full_compute
    type: stress
    description: Level 2 完整秘密链的功能、随机预算和组合边界
    priority: must
    tier: extended
    implementation: verification/tc/tc_masked_full_compute.sv
    proof_kind: uvm
    feature_ref:
    - FL.PQC.CFG
    design_ref:
    - LLD.MOD.PQC.TOP.RANDOM
    - LLD.MOD.PQC.KECCAK.MASKED_ROUND
    preconditions:
    - UVM 1.2、对应真实接口与独立 oracle 已就绪；构建与输入身份固定
    stimulus:
    - 六参数全部操作在 Level 2 以至少两组 fresh masks 重放相同算法输入
    - 对各秘密消费者的租约/转换/采样停顿、撤销与 clear 同拍，执行安全静态/形式证明配套检查
    expected_result:
    - 不同 mask 得到同一标准结果；两个 share 始终在敏感链路保持，普通出口无秘密或单 share
    - 每个 gadget 实例、转换及采样均有配额与组合证明绑定；仅 XOR 重组 KAT 不能宣称 SCA 通过
    timeout_policy: 100000000 cycles per command; 3600 s process watchdog
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.CFG.001
    name: cov_config_space
    type: functional
    description: 覆盖三档命名配置与参数边界
    feature_ref:
    - FL.PQC.CFG
    applicability:
      expr: 'true'
  - id: COV.PQC.SCA.001
    name: cov_sca_001
    type: functional
    description: 完整两share链
    feature_ref:
    - FL.PQC.CFG
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.PQC.CFG.001
    name: a_masked_secret_boundary
    feature_ref:
    - FL.PQC.CFG
    property: Level2敏感路径及转换保持share与域身份；公共出口不能承载私钥/单share或未经批准中间秘密
    severity: error
    verification_method: formal
    applicability:
      expr: 'true'
  config_coverage:
  - id: CCOV.PQC.CFG_MATRIX
    name: config_matrix_coverage
    dimensions: &id001
    - NTT_LANES
    - KECCAK_ROUNDS_PER_CYCLE
    - LOCAL_SRAM_KIB
    - DMA_DATA_WIDTH
    - KEY_SLOT_NUM
    - SCA_LEVEL
    - ENABLE_ALGO_MASK
    - ENABLE_HASH_ML_DSA
    - ENABLE_PIO
    feature_ref: &id002
    - FL.PQC.CFG
    applicability: &id003
      expr: 'true'
- id: FL.PQC.APB
  name: apb_control_interface
  description: APB4 寄存器读写、未映射地址 pslverr、reserved 语义
  priority: must
  req_ref:
  - LRS.INTF.PQC.APB.001
  - LRS.FUNC.PQC.CMD.004
  design_ref:
  - LLD.IF.PQC.FE.APB
  - LLD.TIMING.PQC.APB.RW
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.APB.001
    name: tc_apb_protection
    type: negative
    description: 未映射地址返回 pslverr；BUSY 期间写命令组被拒绝且值不变
    priority: must
    tier: smoke
    implementation: verification/tc/tc_apb_protection.sv
    feature_ref:
    - FL.PQC.APB
    design_ref:
    - LLD.IF.PQC.FE.APB
    - LLD.TIMING.PQC.APB.RW
    preconditions:
    - IP 处于 IDLE
    stimulus:
    - 遍历全部 PPROT/PSTRB、未对齐与高低未映射地址
    - BUSY 与 command_pending 时改写所有受保护组和重复门铃；读回并完成原命令
    expected_result:
    - 有界响应、拒绝无副作用，命令快照与原结果保持
    - 全地址空间无永久等待；非特权/非安全访问不绕过保护
    timeout_policy: 100000 cycles
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.APB.001
    name: cov_apb_access
    type: functional
    description: 覆盖读写、字节使能、非法地址与 BUSY 写保护
    feature_ref:
    - FL.PQC.APB
    design_ref:
    - LLD.IF.PQC.FE.APB
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.PQC.APB.001
    name: a_busy_write_block
    feature_ref:
    - FL.PQC.APB
    design_ref:
    - LLD.REG.PQC.COMMAND
    property: BUSY 期间对受保护字段的写必须被拒绝（swwe=0）且字段值不变
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.PQC.DMA
  name: axi4_data_interface
  description: INCR burst、4 KiB 边界、范围检查、分段等价
  priority: must
  req_ref:
  - LRS.INTF.PQC.DMA.001
  - LRS.INTF.PQC.DMA.002
  - LRS.INTF.PQC.DMA.003
  - LRS.SEC.PQC.SLOT.005
  design_ref:
  - LLD.IF.PQC.DMA.AXI
  - LLD.TIMING.PQC.DMA.SPLIT
  - LLD.ERR.PQC.DMA
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.DMA.001
    name: tc_dma_boundary
    type: boundary
    description: 跨 4 KiB 的传输被拆分为多个 INCR burst 且字节顺序不变
    priority: must
    tier: regression
    implementation: verification/tc/tc_dma_boundary.sv
    feature_ref:
    - FL.PQC.DMA
    design_ref:
    - LLD.TIMING.PQC.DMA.SPLIT
    preconditions:
    - DMA 从端就绪
    stimulus:
    - 对真实算法 payload/context/output/completion 使用 64/128/256-bit 总线，地址在 4KiB 边界前一个合法
      beat
    - 长度含 0/1/beat-1/beat/beat+1、多 burst 与尾字节；改变合法分段及 AR/R/AW/W/B 独立反压
    - RRESP/BRESP 错误、早/迟 RLAST、地址高位/溢出/重叠、输出 capacity 差一字节，超时与取消
    expected_result:
    - 逐 WSTRB 更新的观察内存与 oracle 一致；guard bytes 保持；无越界或多余读写
    - burst 不跨 4KiB，安全/特权属性符合授权；AXI 接受后取消仍排空
    - 输出或 completion B 错误不得成功 IRQ；错误分类符合非敏感合同
    timeout_policy: 100000000 cycles per algorithm command; 3600 s process watchdog
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.DMA.001
    name: cov_dma_boundary
    type: functional
    description: 覆盖 4 KiB 拆分、尾部不满 beat、错误响应
    feature_ref:
    - FL.PQC.DMA
    design_ref:
    - LLD.TIMING.PQC.DMA.SPLIT
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.PQC.DMA.001
    name: a_no_4k_cross
    feature_ref:
    - FL.PQC.DMA
    design_ref:
    - LLD.TIMING.PQC.DMA.SPLIT
    property: 任一 AXI burst 不得跨越 4 KiB 边界
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  - id: ASSERT.PQC.DMA.002
    name: a_axi_hold
    feature_ref:
    - FL.PQC.DMA
    property: AR/AW/W valid且未ready时地址/数据/属性/last保持；取消不撤销已展示请求
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.PQC.SIDEBAND
  name: sideband_security_interface
  description: lifecycle/tamper/zeroize 输入与五类中断输出
  priority: must
  req_ref:
  - LRS.INTF.PQC.SIDEBAND.001
  - LRS.REG.PQC.INTR.001
  - LRS.REG.PQC.ALERT.001
  - LRS.INTF.PQC.CLKRESET.001
  design_ref:
  - LLD.CDC.PQC.SIDEBAND
  - LLD.IRQ.PQC.DONE
  - LLD.IRQ.PQC.TAMPER
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.SIDEBAND.001
    name: tc_intr_independence
    type: directed
    description: 五类中断可独立置位、屏蔽、清除
    priority: must
    tier: regression
    implementation: verification/tc/tc_intr_independence.sv
    feature_ref:
    - FL.PQC.SIDEBAND
    design_ref:
    - LLD.IRQ.PQC.DONE
    - LLD.IRQ.PQC.TAMPER
    preconditions:
    - IP 已使能并进入 IDLE
    stimulus:
    - 分别置位 INTR_TEST 各位
    - 在各 enable 组合下观察 irq 输出
    - W1C 清除单一位
    expected_result:
    - 每个中断独立可控
    - enable=0 时对应位不产生外部 irq 但仍置位
    - W1C 不影响其他位
    timeout_policy: 100000 cycles
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage: []
  assertions:
  - id: ASSERT.PQC.SIDEBAND.001
    name: a_w1c_set_wins
    feature_ref:
    - FL.PQC.SIDEBAND
    design_ref:
    - LLD.REG.PQC.INTR_STATE
    property: INTR_STATE 同周期 HW set 与 SW W1C 冲突时结果必须为置位
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.PQC.CMD
  name: command_semantics
  description: 八类 opcode、descriptor 校验、BUSY 锁定、completion 写序、abort
  priority: must
  req_ref:
  - LRS.FUNC.PQC.CMD.001
  - LRS.FUNC.PQC.CMD.002
  - LRS.FUNC.PQC.CMD.003
  - LRS.FUNC.PQC.CMD.004
  - LRS.FUNC.PQC.CMD.005
  - LRS.FUNC.PQC.CMD.006
  - LRS.FUNC.PQC.CMD.007
  - LRS.FUNC.PQC.CMD.008
  design_ref:
  - LLD.FSM.PQC.TOP.MAIN
  - LLD.BUF.PQC.FE.DESC
  - LLD.REG.PQC.DOORBELL
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.CMD.001
    name: tc_cmd_smoke
    type: directed
    description: 上电使能、自检通过、门铃提交合法命令并收到 completion 与 DONE
    priority: must
    tier: smoke
    implementation: verification/tc/tc_cmd_smoke.sv
    feature_ref:
    - FL.PQC.CMD
    design_ref:
    - LLD.FSM.PQC.TOP.MAIN
    preconditions:
    - rst_n 释放，CTRL.enable 置位
    stimulus:
    - 通过 AXI memory 放置 CRC 正确描述符和有效 ML-KEM-512 输入，经 APB 提交真实 Encaps
    - 对输出 B 与 completion B 分别施加延迟，轮询 STATUS 并观察 IRQ
    expected_result:
    - 真实密文及共享秘密通过 oracle 比较；输入读取、输出写与 completion 均非零
    - 所有 payload B 成功后才写 completion，completion B 成功后 DONE/IRQ
    - 第二命令使用新 tag 与不同输入，不能复用上一命令结果；队列清空
    timeout_policy: 100000000 cycles per command; 3600 s process watchdog
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.CMD.001
    name: cov_command_states
    type: functional
    description: 覆盖八个 opcode、顶层 FSM 全部状态与合法/非法组合
    feature_ref:
    - FL.PQC.CMD
    design_ref:
    - LLD.FSM.PQC.TOP.MAIN
    applicability:
      expr: 'true'
  - id: COV.PQC.COMMIT.001
    name: cov_commit_001
    type: functional
    description: 完成与错误并发
    feature_ref:
    - FL.PQC.CMD
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.PQC.CMD.001
    name: a_completion_order
    feature_ref:
    - FL.PQC.CMD
    design_ref:
    - LLD.FSM.PQC.TOP.MAIN
    property: DONE 置位时 completion record 必须已经写入，且 COMMIT 前无输出可见
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  - id: ASSERT.PQC.CMD.002
    name: a_result_retirement
    feature_ref:
    - FL.PQC.CMD
    property: 所有payload写B成功、completion各字节已写且B成功之前不得发布成功DONE或IRQ；错误B永不退休为成功
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.PQC.REG
  name: register_capabilities
  description: 软件可见能力、字段访问属性、SW/HW 冲突优先序、复位值
  priority: must
  req_ref:
  - LRS.REG.PQC.ID.001
  - LRS.REG.PQC.CTRL.001
  - LRS.REG.PQC.STATUS.001
  - LRS.REG.PQC.RESULT.001
  - LRS.REG.PQC.ERRCODE.001
  - LRS.REG.PQC.PERF.001
  - LRS.REG.PQC.SLOT.001
  - LRS.REG.PQC.COMPLETION.001
  - LRS.CONS.PQC.REG.001
  design_ref:
  - LLD.REG.PQC.ID_VERSION
  - LLD.REG.PQC.STATUS
  - LLD.REG.PQC.RESULT
  - LLD.REG.PQC.ERROR_CODE
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - static
  testcases:
  - id: TC.PQC.REG.001
    name: tc_reg_reset_attr
    type: register
    description: 复位后 RO/RW 字段读回符合 RDL reset；W1C 只清除对应位
    priority: must
    tier: smoke
    implementation: verification/tc/tc_reg_reset_attr.sv
    feature_ref:
    - FL.PQC.REG
    design_ref:
    - LLD.REG.PQC.ID_VERSION
    - LLD.REG.PQC.STATUS
    - LLD.REG.PQC.INTR_STATE
    preconditions:
    - 复位释放后立即读取
    stimulus:
    - 通过生成 RAL frontdoor 访问所有寄存器定义与槽数组；检查 reset/RO/RW/保留位/PSTRB
    - 全部 W1C 字段逐 bit 清除并与 HW set 同拍；单拍请求不粘连；SW clear 与计数器 HW 更新冲突
    - 对每个综合配置检查动态 capability 和 ABI；运行期读取 PERF/completion/slot metadata
    expected_result:
    - RDL 结构及 LLD 字段行为均满足；RAL adapter/predictor 只由 monitor 驱动
    - 拒绝事务不改模型；HW set 优先的 W1C 不丢事件；保留/未映射/未对齐行为符合合同
    - 不能把整个 key-slot 窗口或动态状态当作无条件跳过区域
    timeout_policy: 200000 cycles
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.REG.001
    name: cov_register_attrs
    type: functional
    description: 覆盖 RO/W1C/BUSY 锁定字段的访问组合
    feature_ref:
    - FL.PQC.REG
    design_ref:
    - LLD.REG.PQC.INTR_STATE
    applicability:
      expr: 'true'
  assertions: []
  config_coverage: []
