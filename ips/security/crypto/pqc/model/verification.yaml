  req_ref:
  - LRS.FUNC.PQC.CMD.001
  - LRS.FUNC.PQC.CMD.002
  - LRS.FUNC.PQC.CMD.003
  - LRS.FUNC.PQC.CMD.004
  - LRS.FUNC.PQC.CMD.005
  - LRS.FUNC.PQC.CMD.006
  - LRS.FUNC.PQC.CMD.007
