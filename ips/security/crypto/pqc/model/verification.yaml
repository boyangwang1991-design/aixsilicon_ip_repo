  - LLD.RST.PQC.MAIN
  - LLD.RST.PQC.WARM
  - LLD.RST.PQC.ZEROPATH
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.RESET.001
    name: tc_reset_selftest_lock
    type: reset
    description: 自检成功前拒绝密码命令；tamper 触发零化与锁定
    priority: must
    tier: regression
    implementation: verification/tc/tc_reset_selftest_lock.sv
    feature_ref:
    - FL.PQC.RESET
    design_ref:
    - LLD.FSM.PQC.TOP.MAIN
    - LLD.RST.PQC.ZEROPATH
    preconditions:
