schema_version: '2.0'
ip_name: pqc
verification_level: smoke
status: reviewed
delivery_model: parameterized
lrs_baseline: PQC-CONTRACT-36c592c3ffa1
hld_baseline: PQC-HLD-1.0.0
lld_baseline: PQC-LLD-1.0.0
features:
- id: FL.PQC.CFG
  name: configuration_space
  description: 综合期参数合法空间、命名配置与跨参数约束
  priority: must
  req_ref:
  - LRS.CFG.PQC.NTT_LANES.001
  - LRS.CFG.PQC.KECCAK_ROUNDS.001
  - LRS.CFG.PQC.LOCAL_SRAM.001
  - LRS.CFG.PQC.DMA_WIDTH.001
  - LRS.CFG.PQC.KEY_SLOT.001
  - LRS.CFG.PQC.SCA_LEVEL.001
  - LRS.CFG.PQC.ALGO_MASK.001
  - LRS.CFG.PQC.FEATURE_FLAGS.001
  - LRS.CFG.PQC.EXEC_MODE.001
  design_ref:
  - HLD.CFG.PQC.NTT_LANES
  - HLD.CFG.PQC.KECCAK_ROUNDS
  - HLD.CFG.PQC.LOCAL_SRAM
  - HLD.CFG.PQC.DMA_WIDTH
  - HLD.CFG.PQC.SCA
  - HLD.CFG.PQC.ALGO_MASK
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - static
  testcases:
  - id: TC.PQC.CFG.001
    name: tc_param_elab
    type: directed
    description: Tiny/Balanced/Throughput 三档配置可 elaboration 且 CAPABILITY 一致
    priority: must
    tier: extended
    implementation: scripts/run_pqc_param_elab.py
    proof_kind: static
    feature_ref:
    - FL.PQC.CFG
    design_ref:
    - HLD.CFG.PQC.NTT_LANES
    - HLD.CFG.PQC.KECCAK_ROUNDS
    preconditions:
    - vlogan 可用
    stimulus:
    - 分别以三档参数 elaboration 顶层
    expected_result:
    - 三档均编译通过
    - 非法参数值被拒绝
    timeout_policy: 1800 s
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.CFG.001
    name: cov_config_space
    type: functional
    description: 覆盖三档命名配置与参数边界
    feature_ref:
    - FL.PQC.CFG
    applicability:
      expr: 'true'
  assertions: []
  config_coverage:
  - id: CCOV.PQC.CFG_MATRIX
    name: config_matrix_coverage
    dimensions: &id001
    - NTT_LANES
    - KECCAK_ROUNDS_PER_CYCLE
    - LOCAL_SRAM_KIB
    - SCA_LEVEL
    feature_ref: &id002
    - FL.PQC.CFG
    applicability: &id003
      expr: 'true'
- id: FL.PQC.APB
  name: apb_control_interface
  description: APB4 寄存器读写、未映射地址 pslverr、reserved 语义
  priority: must
  req_ref:
  - LRS.INTF.PQC.APB.001
  - LRS.FUNC.PQC.CMD.004
  design_ref:
  - LLD.IF.PQC.FE.APB
  - LLD.TIMING.PQC.APB.RW
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.APB.001
    name: tc_apb_protection
    type: negative
    description: 未映射地址返回 pslverr；BUSY 期间写命令组被拒绝且值不变
    priority: must
    tier: smoke
    implementation: verification/tc/tc_apb_protection.sv
    feature_ref:
    - FL.PQC.APB
    design_ref:
    - LLD.IF.PQC.FE.APB
    - LLD.TIMING.PQC.APB.RW
    preconditions:
    - IP 处于 IDLE
    stimulus:
    - 访问未映射地址
    - 提交命令使其 BUSY，期间写 COMMAND.opcode
    expected_result:
    - 未映射访问 psready 有效且 pslverr 为 1
    - BUSY 期间写入被拒绝，opcode 保持提交值
    - 命令结果不受影响
    timeout_policy: 100000 cycles
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.APB.001
    name: cov_apb_access
    type: functional
    description: 覆盖读写、字节使能、非法地址与 BUSY 写保护
    feature_ref:
    - FL.PQC.APB
    design_ref:
    - LLD.IF.PQC.FE.APB
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.PQC.APB.001
    name: a_busy_write_block
    feature_ref:
    - FL.PQC.APB
    design_ref:
    - LLD.REG.PQC.COMMAND
    property: BUSY 期间对受保护字段的写必须被拒绝（swwe=0）且字段值不变
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.PQC.DMA
  name: axi4_data_interface
  description: INCR burst、4 KiB 边界、范围检查、分段等价
  priority: must
  req_ref:
  - LRS.INTF.PQC.DMA.001
  - LRS.INTF.PQC.DMA.002
  - LRS.INTF.PQC.DMA.003
  - LRS.SEC.PQC.SLOT.005
  design_ref:
  - LLD.IF.PQC.DMA.AXI
  - LLD.TIMING.PQC.DMA.SPLIT
  - LLD.ERR.PQC.DMA
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.DMA.001
    name: tc_dma_boundary
    type: boundary
    description: 跨 4 KiB 的传输被拆分为多个 INCR burst 且字节顺序不变
    priority: must
    tier: regression
    implementation: verification/tc/tc_dma_boundary.sv
    feature_ref:
    - FL.PQC.DMA
    design_ref:
    - LLD.TIMING.PQC.DMA.SPLIT
    preconditions:
    - DMA 从端就绪
    stimulus:
    - 发起起点在 4 KiB 边界前 8 字节、长度跨越边界的读与写
    expected_result:
    - 每次 burst 不跨 4 KiB
    - 拼接后的数据与连续传输一致
    - 协议无违规
    timeout_policy: 400000 cycles
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.DMA.001
    name: cov_dma_boundary
    type: functional
    description: 覆盖 4 KiB 拆分、尾部不满 beat、错误响应
    feature_ref:
    - FL.PQC.DMA
    design_ref:
    - LLD.TIMING.PQC.DMA.SPLIT
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.PQC.DMA.001
    name: a_no_4k_cross
    feature_ref:
    - FL.PQC.DMA
    design_ref:
    - LLD.TIMING.PQC.DMA.SPLIT
    property: 任一 AXI burst 不得跨越 4 KiB 边界
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
