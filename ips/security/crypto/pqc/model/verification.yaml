  config_coverage: []
- id: FL.PQC.SIDEBAND
  name: sideband_security_interface
  description: lifecycle/tamper/zeroize 输入与五类中断输出
  priority: must
  req_ref:
  - LRS.INTF.PQC.SIDEBAND.001
  - LRS.REG.PQC.INTR.001
  - LRS.REG.PQC.ALERT.001
  - LRS.INTF.PQC.CLKRESET.001
  design_ref:
  - LLD.CDC.PQC.SIDEBAND
  - LLD.IRQ.PQC.DONE
  - LLD.IRQ.PQC.TAMPER
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.SIDEBAND.001
    name: tc_intr_independence
    type: directed
    description: 五类中断可独立置位、屏蔽、清除
    priority: must
    tier: regression
    implementation: verification/tc/tc_intr_independence.sv
    feature_ref:
    - FL.PQC.SIDEBAND
    design_ref:
    - LLD.IRQ.PQC.DONE
    - LLD.IRQ.PQC.TAMPER
    preconditions:
    - IP 已使能并进入 IDLE
    stimulus:
    - 分别置位 INTR_TEST 各位
    - 在各 enable 组合下观察 irq 输出
    - W1C 清除单一位
    expected_result:
    - 每个中断独立可控
    - enable=0 时对应位不产生外部 irq 但仍置位
    - W1C 不影响其他位
    timeout_policy: 100000 cycles
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage: []
  assertions:
  - id: ASSERT.PQC.SIDEBAND.001
    name: a_w1c_set_wins
    feature_ref:
    - FL.PQC.SIDEBAND
    design_ref:
    - LLD.REG.PQC.INTR_STATE
    property: INTR_STATE 同周期 HW set 与 SW W1C 冲突时结果必须为置位
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
