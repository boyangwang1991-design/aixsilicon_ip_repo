- id: FL.PQC.RESET
  name: reset_and_safe_shutdown
  description: 冷复位自检门控、warm reset key 保持、故障统一收尾、掉电收尾
  priority: must
  req_ref:
  - LRS.RESET.PQC.COLD.001
  - LRS.RESET.PQC.WARM.001
  - LRS.RESET.PQC.SAFE.001
  - LRS.RESET.PQC.POWERDOWN.001
  design_ref:
  - LLD.RST.PQC.MAIN
  - LLD.RST.PQC.WARM
  - LLD.RST.PQC.ZEROPATH
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.PQC.RESET.001
    name: tc_reset_selftest_lock
    type: reset
    description: 自检成功前拒绝密码命令；tamper 触发零化与锁定
    priority: must
    tier: regression
    implementation: verification/tc/tc_reset_selftest_lock.sv
    feature_ref:
    - FL.PQC.RESET
    design_ref:
    - LLD.FSM.PQC.TOP.MAIN
    - LLD.RST.PQC.ZEROPATH
    preconditions:
    - 复位释放
    stimulus:
    - 冷复位、自检失败/成功、warm reset、掉电请求、tamper/lifecycle/abort/zeroize/KM revoke
    - 在 fetch/input/primitive/staging/output/completion 各阶段及 stall 中触发，覆盖结果发布同拍
    - 对清除期间的新门铃/导入、连续清除、迟到总线响应及超时执行负向刺激
    expected_result:
    - 自检通过前无密码执行，失败锁定；身份立即失效，所有秘密物理清除后才 ack
    - 已展示的 AXI 请求保持并排空；公平响应条件下满足清除预算，永久阻塞只可锁定不能假 ack
    - warm reset 不自行假定 persistent key 保留；正常恢复后新命令正确且不残留旧结果
    timeout_policy: 100000000 cycles to reach injection point; ZEROIZE_MAX_CYCLES
      for local wipe plus declared AXI drain bound
    config_ref:
    - CFGSET.PQC.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.PQC.RESET.001
    name: cov_fault_zeroize
