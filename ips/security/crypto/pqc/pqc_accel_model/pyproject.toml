[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqc-hw-model"
version = "0.1.0"
description = "Executable hardware-level model and differential verification for ML-KEM/ML-DSA"
requires-python = ">=3.10"
dependencies = [
  "kyber-py==1.2.0",
  "dilithium-py==1.4.0",
  "pqcrypto==1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

