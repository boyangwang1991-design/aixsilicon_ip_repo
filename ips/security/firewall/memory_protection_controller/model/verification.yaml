    stimulus:
    - 随机地址（命中/未命中 Region）、随机 burst 类型/长度
    - 随机 PROT（secure/privileged/instruction）组合
    - 随机 ID、随机 backpressure
    expected_result:
    - 所有事务按权限模型判定正确（RM 对比）
    - 无 hang、无断言违例、无数据破坏
    timeout_policy: 50000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
