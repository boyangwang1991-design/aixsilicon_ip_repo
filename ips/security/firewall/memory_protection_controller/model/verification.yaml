schema_version: '2.0'
ip_name: axi_mpu
verification_level: full
status: draft
delivery_model: generator
lrs_baseline: LRS-AXI_MPU-V100
hld_baseline: HLD-AXI_MPU-V100
lld_baseline: LLD-AXI_MPU-V100
features:
- id: FL.AXI_MPU.DEFAULT_DENY
  name: Default_Deny
  description: 未匹配任何有效 Region 的访问默认拒绝；Reset 后所有可编程 Region 默认 disabled；Default Deny
    与 Explicit Allow 组合
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.DEFAULT_DENY.001
  - LRS.FUNC.AXI_MPU.DEFAULT_DENY.002
  design_ref:
  - HLD.MOD.L1.AXI_MPU.PERM_ENGINE
  - LLD.MOD.AXI_MPU.PERM
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.AXI_MPU.DEFAULT_DENY.001
    name: default_deny
    type: negative
    description: 未配置任何 Region 或访问地址未命中任何 Region 时，read/write 均返回 DECERR
    priority: must
    tier: regression
    implementation: verification/tc/tc_default_deny.sv
    feature_ref:
    - FL.AXI_MPU.DEFAULT_DENY
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    preconditions:
    - reset 后未配置 Region（或仅配置不覆盖测试地址的 Region）
    stimulus:
    - AXI 发 read 到未匹配地址
    - AXI 发 write 到未匹配地址
    expected_result:
    - RRESP=DECERR、BRESP=DECERR
    - M_AXI 上无对应事务
    - VIOL_STATUS.valid 置位
    timeout_policy: 1000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage: []
  assertions:
  - id: ASSERT.AXI_MPU.DEFAULT_DENY.001
    name: default_deny_invariant
    feature_ref:
    - FL.AXI_MPU.DEFAULT_DENY
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    property: DEFAULT_DENY 下，任何未匹配有效 Region 的访问不得被允许
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.REQ_CONTEXT
  name: Request_Context
  description: 每个 AXI transaction 转换为基础 Request Context（address/read_write/axi_id/master_id/secure/privileged/instruction/burst
    属性）
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.REQ_CONTEXT.001
  design_ref:
  - HLD.IF.INT.AXI_MPU.REQ_CTX
  - LLD.DATAPATH.AXI_MPU.REQ_CTX
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  testcases: []
  coverage: []
  assertions:
  - id: ASSERT.AXI_MPU.REQ_CONTEXT.001
    name: req_ctx_mapping
    feature_ref:
    - FL.AXI_MPU.REQ_CONTEXT
    design_ref:
    - LLD.DATAPATH.AXI_MPU.REQ_CTX
    property: Request Context 的 address/read_write/secure/privileged/instruction/master_id
      字段必须与 AXI 通道信号一致映射
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.MASTER
  name: Master_Identity
  description: MASTER_MASK 按 master_id 判定；非法 Master ID（>=MASTER_NUM）必须拒绝；AxID 不作为
    Master Identity
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.MASTER_ID.001
  - LRS.FUNC.AXI_MPU.PERM_MASTER.001
  design_ref:
  - HLD.MOD.L1.AXI_MPU.MASTER_ATTR
  - LLD.MOD.AXI_MPU.MASTER_ATTR
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  testcases:
  - id: TC.AXI_MPU.MASTER.001
    name: master_permission
    type: negative
    description: MASTER_MASK 判定 allowed/denied Master；非法 Master ID（>=MASTER_NUM）拒绝
    priority: must
    tier: regression
    implementation: verification/tc/tc_master_permission.sv
    feature_ref:
    - FL.AXI_MPU.MASTER
    design_ref:
    - LLD.MOD.AXI_MPU.MASTER_ATTR
    preconditions:
    - 配置 Region 仅允许 Master0/2；Master1 访问同地址
    stimulus:
    - Master0/2 访问（应允许）
    - Master1 访问（应拒绝）
    - 非法 master_id（越界）访问（应拒绝）
    expected_result:
    - Master0/2 事务正常完成
    - Master1 与非法 ID 事务返回 DECERR
    timeout_policy: 2000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.AXI_MPU.MASTER.001
    name: master_permission_cov
    type: functional
    description: MASTER_MASK allowed/denied、非法 Master ID 覆盖
    feature_ref:
    - FL.AXI_MPU.MASTER
    design_ref:
    - LLD.MOD.AXI_MPU.MASTER_ATTR
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.AXI_MPU.MASTER.001
    name: invalid_master_rejected
    feature_ref:
    - FL.AXI_MPU.MASTER
    design_ref:
    - LLD.MOD.AXI_MPU.MASTER_ATTR
    property: master_id >= MASTER_NUM 的访问必须被拒绝
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.MASTER_SEC
  name: Master_Security_Attribution
  description: MASTER_ATTR（SECURE_CAPABLE/NONSECURE_CAPABLE）校验声明的 Security 状态；Master
    Security 与 Region Security 独立检查
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.MASTER_SEC_ATTR.001
  - LRS.SEC.AXI_MPU.ATTACK.001
  design_ref:
  - HLD.MOD.L1.AXI_MPU.MASTER_ATTR
  - LLD.MOD.AXI_MPU.MASTER_ATTR
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - formal
  testcases:
  - id: TC.AXI_MPU.SECURITY.001
    name: security_permission
    type: negative
    description: Secure/Non-secure Region 权限；Master Security Attribution 拒绝 forged
      Secure；Master 无 Secure capability 时 Secure 访问拒绝
    priority: must
    tier: regression
    implementation: verification/tc/tc_security_permission.sv
    feature_ref:
    - FL.AXI_MPU.MASTER_SEC
    design_ref:
    - LLD.MOD.AXI_MPU.MASTER_ATTR
    - LLD.MOD.AXI_MPU.PERM
    preconditions:
    - Region 仅允许 Secure；Master Attr 配置 Master 无 SECURE_CAPABLE
    stimulus:
    - Non-secure 访问 secure-only Region（拒绝）
    - 无 capability Master 发 Secure 访问（forged，拒绝）
    - 有 capability Master 发 Secure 访问（允许）
    expected_result:
    - forged/无 capability Secure 访问返回 DECERR 且 reason=MASTER_SECURITY_DENY
    - 合法 Secure 访问正常完成
    timeout_policy: 2000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.AXI_MPU.SECURITY.001
    name: security_permission_cov
    type: functional
    description: Secure/Non-secure allow/deny、forged Secure、Master Attr violation
      覆盖
    feature_ref:
    - FL.AXI_MPU.MASTER_SEC
    design_ref:
    - LLD.MOD.AXI_MPU.MASTER_ATTR
    - LLD.MOD.AXI_MPU.PERM
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.AXI_MPU.MASTER_SEC.001
    name: forged_secure_rejected
    feature_ref:
    - FL.AXI_MPU.MASTER_SEC
    design_ref:
    - LLD.MOD.AXI_MPU.MASTER_ATTR
    property: Master 无 SECURE_CAPABLE 时声明 Secure 的访问必须被拒绝
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.REGION
  name: Region_Match
  description: BASE+LIMIT 模式；region_match（enable && addr>=base && addr<=limit）；Lowest
    Region Index Wins；非法 BASE>LIMIT 视为 disabled
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.REGION.001
  - LRS.FUNC.AXI_MPU.REGION.002
  - LRS.FUNC.AXI_MPU.REGION.003
  - LRS.FUNC.AXI_MPU.REGION.004
  design_ref:
  - HLD.MOD.L1.AXI_MPU.PERM_ENGINE
  - LLD.MOD.AXI_MPU.PERM
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - formal
  testcases:
  - id: TC.AXI_MPU.REGION.001
    name: region_boundary
    type: boundary
    description: 验证 REGION_BASE/LIMIT 边界（等于 BASE、等于 LIMIT、BASE±1、LIMIT±1）、Region overlap
      与 lowest-index-wins 优先级、非法 BASE>LIMIT 视为 disabled
    priority: must
    tier: regression
    implementation: verification/tc/tc_region_boundary.sv
    feature_ref:
    - FL.AXI_MPU.REGION
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    preconditions:
    - 通过 APB 配置多个 overlap Region 与边界 Region
    stimulus:
    - 对 BASE、LIMIT、BASE-1、LIMIT+1 地址发 read/write
    - 配置 Region0/Region1 overlap 并访问
    - 配置非法 BASE>LIMIT 并访问
    expected_result:
    - 边界地址按 BASE<=addr<=LIMIT 规则判定
    - overlap 时按最低索引 Region 权限判定
    - 非法 Region 视为 disabled（访问走其他 Region 或 deny）
    timeout_policy: 2000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.AXI_MPU.REGION.001
    name: region_match_class
    type: functional
    description: Region 匹配类别覆盖：无匹配/单匹配/多匹配/优先级/BASE/LIMIT/boundary ±1/非法 BASE>LIMIT
    feature_ref:
    - FL.AXI_MPU.REGION
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    applicability:
      expr: 'true'
  assertions: []
  config_coverage: []
- id: FL.AXI_MPU.BURST
  name: Burst_Boundary
  description: INCR/FIXED/WRAP burst 计算完整地址范围；跨 Region 边界整事务拒绝；不能部分 beat 合法部分非法
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.BURST.001
  - LRS.FUNC.AXI_MPU.BURST.002
  design_ref:
  - HLD.MOD.L1.AXI_MPU.PERM_ENGINE
  - LLD.MOD.AXI_MPU.PERM
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - formal
  testcases:
  - id: TC.AXI_MPU.BURST.001
    name: burst_boundary
    type: boundary
    description: INCR/FIXED/WRAP burst 完整地址范围计算；跨 Region 边界整事务拒绝
    priority: must
    tier: regression
    implementation: verification/tc/tc_burst_boundary.sv
    feature_ref:
    - FL.AXI_MPU.BURST
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    preconditions:
    - Region 覆盖固定地址段
    stimulus:
    - burst 完全在 Region 内（INCR/FIXED/WRAP）
    - burst 跨 LIMIT（INCR 上跨）
    - burst 跨 BASE（INCR 下跨）
    - WRAP burst 跨边界
    expected_result:
    - 完全在内：正常完成
    - 跨边界：整事务 DENY（DECERR），M_AXI 无部分事务
    timeout_policy: 3000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.AXI_MPU.BURST.001
    name: burst_cov
    type: functional
    description: INCR/FIXED/WRAP、fully inside/cross BASE/cross LIMIT/cross Region
      覆盖
    feature_ref:
    - FL.AXI_MPU.BURST
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    applicability:
      expr: 'true'
  assertions:
  - id: ASSERT.AXI_MPU.BURST.001
    name: burst_cross_deny_whole
    feature_ref:
    - FL.AXI_MPU.BURST
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    property: burst 若跨 Region 边界，整事务被拒绝，不得部分转发
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.PERM_DIM
  name: Permission_Dimensions
  description: Secure/Non-secure、Privileged/Unprivileged、Read/Write/Execute 独立判定并
    AND 组合；deny_reason 可观测
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.PERM_SECURITY.001
  - LRS.FUNC.AXI_MPU.PERM_PRIVILEGE.001
  - LRS.FUNC.AXI_MPU.PERM_OP.001
  - LRS.FUNC.AXI_MPU.PERM_DECISION.001
  design_ref:
  - HLD.MOD.L1.AXI_MPU.PERM_ENGINE
  - LLD.MOD.AXI_MPU.PERM
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  testcases:
  - id: TC.AXI_MPU.PRIVILEGE.001
    name: privilege_permission
    type: directed
    description: PRIVILEGED_ALLOW/UNPRIVILEGED_ALLOW 判定
    priority: must
    tier: regression
    implementation: verification/tc/tc_privilege_permission.sv
    feature_ref:
    - FL.AXI_MPU.PERM_DIM
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    preconditions:
    - Region 仅允许 Privileged
    stimulus:
    - Privileged 访问（允许）
    - Unprivileged 访问（拒绝）
    expected_result:
    - Unprivileged 访问返回 DECERR
    - Privileged 访问正常完成
    timeout_policy: 2000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  - id: TC.AXI_MPU.OP.001
    name: op_permission
    type: directed
    description: READ_ALLOW/WRITE_ALLOW/EXECUTE_ALLOW 判定；instruction access 需 READ_ALLOW
      && EXECUTE_ALLOW
    priority: must
    tier: regression
    implementation: verification/tc/tc_op_permission.sv
    feature_ref:
    - FL.AXI_MPU.PERM_DIM
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    preconditions:
    - Region 配置 READ=1, WRITE=0, EXEC=0
    stimulus:
    - Read 访问（允许）
    - Write 访问（拒绝）
    - Instruction (PROT[2]=1) 访问（拒绝，NX）
    expected_result:
    - Write/Instruction 返回 DECERR 且 reason=WRITE_DENY/EXECUTE_DENY
    - Read 正常完成
    timeout_policy: 2000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage:
  - id: COV.AXI_MPU.PERM.001
    name: perm_dimension_cov
    type: functional
    description: Privileged/Unprivileged、Read/Write/Execute/NX 判定覆盖
    feature_ref:
    - FL.AXI_MPU.PERM_DIM
    design_ref:
    - LLD.MOD.AXI_MPU.PERM
    applicability:
      expr: 'true'
  assertions: []
  config_coverage: []
- id: FL.AXI_MPU.READ_PATH
  name: Read_Path
  description: AR 捕获、合法性判断、合法转发、非法本地 R DECERR（RID/RVALID/RRESP/RLAST 完整）、read outstanding
    跟踪
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.READ.001
  - LRS.FUNC.AXI_MPU.READ.002
  - LRS.FUNC.AXI_MPU.OUTSTANDING.001
  - LRS.INTF.AXI_MPU.AXI_SLAVE.001
  - LRS.INTF.AXI_MPU.AXI_MASTER.001
  design_ref:
  - HLD.MOD.L1.AXI_MPU.READ_FRONTEND
  - LLD.MOD.AXI_MPU.READ
  - LLD.FSM.AXI_MPU.READ
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.AXI_MPU.SMOKE.001
    name: smoke_basic
    type: directed
    description: Reset 后通过 APB 配置一个 Region 并完成一条合法读与一条合法写；验证 DUT 可编译、reset、基本访问与基本事务响应
    priority: must
    tier: smoke
    implementation: verification/tc/tc_smoke_basic.sv
    feature_ref:
    - FL.AXI_MPU.READ_PATH
    design_ref:
    - LLD.MOD.AXI_MPU.TOP
    preconditions:
    - DUT 处于 reset 释放状态
    - 通过 APB 配置 REGION0 覆盖测试地址，允许当前 Master
    stimulus:
    - APB 写 GLOBAL_CTRL/REGION0_* 配置
    - AXI 发一条合法 read burst（len=0）
    - AXI 发一条合法 write burst（len=0）
    expected_result:
    - read 返回 OKAY 且数据正确
    - write 返回 BOKAY 且下游收到
    timeout_policy: 1000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage: []
  assertions:
  - id: ASSERT.AXI_MPU.READ_PATH.001
    name: denied_ar_no_forward
    feature_ref:
    - FL.AXI_MPU.READ_PATH
    design_ref:
    - LLD.MOD.AXI_MPU.READ
    property: 若某 AR 事务被判定为 DENY，则其不得出现在 M_AXI_AR 通道
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.WRITE_PATH
  name: Write_Path
  description: AW/W 解耦、Write Decision Queue 关联 AW 与 W、非法 W consume+本地 B DECERR、无 deadlock/串扰/部分写入
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.WRITE.001
  - LRS.FUNC.AXI_MPU.WRITE.002
  - LRS.FUNC.AXI_MPU.WRITE_QUEUE.001
  - LRS.INTF.AXI_MPU.AXI_SLAVE.001
  - LRS.INTF.AXI_MPU.AXI_MASTER.001
  design_ref:
  - HLD.MOD.L1.AXI_MPU.WRITE_FRONTEND
  - LLD.MOD.AXI_MPU.WRITE
  - LLD.FSM.AXI_MPU.WRITE
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases: []
  coverage: []
  assertions:
  - id: ASSERT.AXI_MPU.WRITE_PATH.001
    name: denied_aw_no_forward
    feature_ref:
    - FL.AXI_MPU.WRITE_PATH
    design_ref:
    - LLD.MOD.AXI_MPU.WRITE
    property: 若某 AW 事务被判定为 DENY，则其不得出现在 M_AXI_AW 通道
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  - id: ASSERT.AXI_MPU.WRITE_PATH.002
    name: denied_w_no_downstream
    feature_ref:
    - FL.AXI_MPU.WRITE_PATH
    design_ref:
    - LLD.MOD.AXI_MPU.WRITE
    property: 被拒绝的 write 事务的 W beats 不得驱动到 M_AXI_W，下游状态不被修改
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.ERR_RESP
  name: Error_Response
  description: 非法访问本地 DECERR（RRESP/BRESP=DECERR）；满足 AXI ordering；不拉低 READY、不 hang
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.ERR_RESP.001
  - LRS.FUNC.AXI_MPU.ORDERING.001
  design_ref:
  - HLD.MOD.L1.AXI_MPU.READ_FRONTEND
  - HLD.MOD.L1.AXI_MPU.WRITE_FRONTEND
  - LLD.MOD.AXI_MPU.ERR_RESP
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.AXI_MPU.ERR_RESP.001
    name: local_decerr
    type: error_injection
    description: 非法 read/write 本地 DECERR；RID/RVALID/RRESP/RLAST 完整；W beat 被 consume；无
      hang、无部分写入
    priority: must
    tier: regression
    implementation: verification/tc/tc_local_decerr.sv
    feature_ref:
    - FL.AXI_MPU.ERR_RESP
    design_ref:
    - LLD.MOD.AXI_MPU.ERR_RESP
    preconditions:
    - 配置 Region 拒绝某地址段
    stimulus:
    - 非法 read burst（len=3）→ 期望 4 个 DECERR beat + RLAST
    - 非法 write burst（len=3）→ 期望 W 被 consume、1 个 B DECERR
    expected_result:
    - read: RRESP=DECERR 全部 beat、RDATA=0、RLAST 正确
    - write: 无 M_AXI 写、B 返回 DECERR
    - 后续合法事务不受影响
    timeout_policy: 3000 cycles
    config_ref:
    - CFGSET.AXI_MPU.DEFAULT
    applicability:
      expr: 'true'
  coverage: []
  assertions:
  - id: ASSERT.AXI_MPU.ERR_RESP.001
    name: denied_eventual_decerr
    feature_ref:
    - FL.AXI_MPU.ERR_RESP
    design_ref:
    - LLD.MOD.AXI_MPU.ERR_RESP
    property: 每个被接受的 denied transaction 最终收到本地 DECERR 响应（read 全 beat / write B）
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  - id: ASSERT.AXI_MPU.ERR_RESP.002
    name: no_hang
    feature_ref:
    - FL.AXI_MPU.ERR_RESP
    design_ref:
    - LLD.MOD.AXI_MPU.ERR_RESP
    property: 被拒绝事务在有限周期内完成本地响应，READY 不被永久拉低
    severity: error
    verification_method: assertion
    applicability:
      expr: 'true'
  config_coverage: []
- id: FL.AXI_MPU.VIOLATION
  name: Violation_Logging
  description: VIOL_* 寄存器捕获（FIRST_ERROR_STICKY）、VIOL_COUNT（saturating）、IRQ（sticky+W1C）
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.VIOLATION.001
