    name: random_traffic
    type: random
    description: 随机混合流量（合法/非法、read/write、burst、多 ID、随机 backpressure）压力验证
    priority: should
    tier: extended
    implementation: verification/tc/tc_random_traffic.sv
    feature_ref:
    - FL.AXI_MPU.OUTSTANDING
    design_ref:
    - LLD.MOD.AXI_MPU.READ
    - LLD.MOD.AXI_MPU.WRITE
