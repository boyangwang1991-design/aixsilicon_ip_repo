- id: FL.AXI_MPU.OUTSTANDING
  name: Multiple_Outstanding
  description: 多 outstanding read/write 支持；permission check 不降级；ordering 保持
  priority: must
  req_ref:
  - LRS.FUNC.AXI_MPU.OUTSTANDING.001
