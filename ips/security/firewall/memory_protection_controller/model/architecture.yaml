  name: v1.0_no_fusa_mechanism
  protects:
  - 无（V1.0 baseline 不要求 ISO 26262 机制）
  detection_strategy: 未来 Profile 可增加配置寄存器 parity / Region table parity / lockstep checker / violation escalation / fault injection
    / safety interrupt
  req_ref:
  - LRS.SAFE.AXI_MPU.SAFETY.001
