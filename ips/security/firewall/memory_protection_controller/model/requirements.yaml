- id: LRS.SEC.AXI_MPU.ATTACK.001
  category: SEC
  feature: attack_surface
  priority: P0
  status: active
  source_ref:
  - SRC-001
  - SRC-004
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: IP 必须重点防范：未授权 Master access、Non-secure→Secure Region、 Unprivileged→Privileged Region、Write→Read-only Region、instruction
    access→NX Region、Burst crossing protection boundary、forged Secure AxPROT、invalid Master ID、configuration tampering、Region
    overlap ambiguity、default allow、AXI denied transaction deadlock。
