- id: LRS.INTF.AXI_MPU.AXI_SLAVE.001
  category: INTF
  feature: axi_slave_interface
  priority: P0
  status: active
  source_ref:
  - SRC-001
  - SRC-002
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: IP 应提供符合 AXI4 Full 协议规范的从接口 `S_AXI`，支持独立的 AR/R 与 AW/W/B 通道以及完整的 AXI burst（INCR/FIXED/WRAP）。配置接口 `APB4` 与受保护的
    AXI datapath 必须独立。
  acceptance_criteria:
  - AXI4 协议断言检查通过；
  - '`S_AXI` 支持合法 burst 的地址握手与数据握手。'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.AXI_MPU.AXI_SLAVE.002
  category: INTF
  feature: axi_slave_interface
  priority: P1
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - review
  description: '`S_AXI` 与 `M_AXI` 接口位宽应匹配 Generator 参数：`ADDR_WIDTH`、`DATA_WIDTH`、 `ID_WIDTH`。'
  acceptance_criteria:
  - 生成 RTL 的端口位宽与 Generator 参数一致。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.AXI_MPU.AXI_MASTER.001
  category: INTF
  feature: axi_master_interface
  priority: P0
  status: active
  source_ref:
  - SRC-001
  - SRC-002
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: IP 应提供符合 AXI4 Full 协议规范的 `M_AXI` 主接口。合法访问的 AR/AW/W 信号应 转发至 `M_AXI`，来自下游的 R/B 响应应返回至 `S_AXI`。
  acceptance_criteria:
  - 合法事务在 `M_AXI` 上完整出现且 `S_AXI` 收到正确响应；
  - 非法事务不出现在 `M_AXI`（断言：Denied AR/AW shall never reach M_AXI）。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.AXI_MPU.APB_CFG.001
  category: INTF
  feature: apb_config_interface
  priority: P0
  status: active
  source_ref:
  - SRC-001
  - SRC-003
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - assertion
  description: IP 应提供符合 APB4 协议规范的配置从接口，支持对 Region 配置、Master Attribute、 全局控制/状态、Violation 状态与中断寄存器的读写访问。APB 数据宽度应为 32 位。
  acceptance_criteria:
  - APB4 协议断言检查通过；
  - 配置寄存器可经 APB4 正确读写（受 Lock 保护的寄存器除外）。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.INTF.AXI_MPU.IRQ.001
  category: INTF
  feature: irq_interface
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: has_irq == true
  verify_method:
  - simulation
  - assertion
  description: 当 `HAS_IRQ=1` 时，IP 应提供电平型中断输出 `IRQ`。当 violation interrupt enable 置位且发生 protection violation 时置位，采用 sticky 中断并由软件
    W1C 清除。
  acceptance_criteria:
  - 使能后 violation 触发 `IRQ=1`；
  - 软件 W1C 清除后 `IRQ` 回到 0（无新 violation 时）。
  - '文档版本: v1.0*'
  - '创建日期: 2026-09-09*'
  - '创建者: IP Development Suite - 01-lrs-author*'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.DEFAULT_DENY.001
  category: FUNC
  feature: default_deny
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: IP 应采用 `Default Deny + Explicit Allow` 策略：未匹配任何有效 Region 的访问 默认拒绝，不得允许。Reset 后所有可编程 Region 默认 disabled。
  acceptance_criteria:
  - 无 Region 命中时访问被拒绝；
  - Reset 后任意访问（含合法 Region 范围内）均被拒绝，直到软件配置 Region；
  - 断言：`No unmatched access may be allowed under DEFAULT_DENY`。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.DEFAULT_DENY.002
  category: FUNC
  feature: default_deny
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - review
  - formal
  description: 权限判断应独立建模以下维度：Address、Master Identity、Security State、 Privilege State、Operation Type。最终权限 `ALLOW = region_match
    && master_allowed && master_security_valid && security_allowed && privilege_allowed && operation_allowed`。不得将 Master 与
    Security State 直接编码为组合权限矩阵。
  acceptance_criteria:
  - 五个独立维度均可独立导致拒绝；
  - 任一维度为假时 `ALLOW=0`。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.REQ_CONTEXT.001
  category: FUNC
  feature: request_context
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: 每个 AXI transaction 应被转换成统一内部 Request Context，至少包含 address、 read_write、axi_id、master_id、secure、privileged、instruction、burst_type、
    burst_len、burst_size、burst_start、burst_end。Read 使用 AR 通道信号，Write 使用 AW 通道信号。
  acceptance_criteria:
  - Read 与 Write 均能正确构建 Request Context；
  - burst_start/burst_end 正确反映完整 burst 地址范围。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.MASTER_ID.001
  category: FUNC
  feature: master_identity
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - review
  description: AXI `AxID` 默认不得作为 Master Identity。IP 应提供独立 Master Context （`MASTER_ID`）或通过系统定义的 AXI USER sideband 传递。Master
    ID 位宽由 `MASTER_ID_WIDTH` 决定。
  acceptance_criteria:
  - 权限判定使用 `request.master_id` 而非 `AxID`；
  - 配置可通过 AXI USER sideband 或独立输入指定 Master ID。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.MASTER_SEC_ATTR.001
  category: FUNC
  feature: master_security_attr
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: has_master_attr == true
  verify_method:
  - simulation
  - formal
  description: IP 应为每个 Master 维护 `SECURE_CAPABLE` 与 `NONSECURE_CAPABLE` 属性。若 `request.secure == 1` 而 `MASTER_ATTR[master_id].SECURE_CAPABLE
    == 0`，访问必须 拒绝。Master Security Attribution 与 Region Security Permission 是两个独立检查 阶段。
  acceptance_criteria:
  - Secure 请求被非 Secure-capable Master 发出时拒绝；
  - Non-secure 请求被非 Non-secure-capable Master 发出时拒绝；
  - 两阶段检查独立可验证。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.REGION.001
  category: FUNC
  feature: region_model
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - review
  description: 每个 Protection Region 应至少包含：`REGION_ENABLE`、`REGION_BASE`、 `REGION_LIMIT`、`MASTER_MASK`、`SECURE_ALLOW`、`NONSECURE_ALLOW`、
    `PRIVILEGED_ALLOW`、`UNPRIVILEGED_ALLOW`、`READ_ALLOW`、`WRITE_ALLOW`、 `EXECUTE_ALLOW`、`REGION_LOCK`。
  acceptance_criteria:
  - 每个 Region 可通过 APB4 完整配置上述字段；
  - 字段间相互独立。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.REGION.002
  category: FUNC
  feature: region_model
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: Region 地址模型应采用 `BASE + LIMIT` 模式，Region match 条件为 `REGION_BASE <= ADDRESS <= REGION_LIMIT`。Region 必须满足 `BASE
    <= LIMIT`； 非法 Region 配置（`BASE > LIMIT`）不得导致未定义硬件行为，应视为 Region disabled。
  acceptance_criteria:
  - 地址在 `[BASE, LIMIT]` 内命中；
  - '`BASE > LIMIT` 时 Region 视为 disabled（不命中）。'
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.REGION.003
  category: FUNC
  feature: region_match
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: 对 Region `i`，`region_match[i] = REGION_ENABLE[i] && address >= REGION_BASE[i] && address <= REGION_LIMIT[i]`。所有
    Region 的匹配应可并行计算。
  acceptance_criteria:
  - 使能与地址范围均为真时命中；
  - 边界地址（`BASE`/`LIMIT` 本身）命中。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.REGION.004
  category: FUNC
  feature: region_priority
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: 允许 Region overlap。Region 优先级固定为 `Lowest Region Index Wins`：若一个 transaction 同时命中多个 Region，`selected_region =
    最小索引命中 Region`。该规则 必须确定且不可依赖综合实现。
  acceptance_criteria:
  - overlap 时命中最小索引 Region；
  - 任意综合/实现下优先级结果一致。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.BURST.001
  category: FUNC
  feature: burst_protection
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: Burst transaction 必须同时满足完整 burst 地址范围位于 Region 内，即 `burst_start >= REGION_BASE && burst_end <= REGION_LIMIT`。不得只判断
    `ARADDR/AWADDR` 首地址。
  acceptance_criteria:
  - 首地址在 Region 内但 burst 跨越边界的访问被拒绝；
  - 完整 burst 在 Region 内的访问允许。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.BURST.002
  category: FUNC
  feature: burst_protection
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: 若 burst 跨越 Region 边界，默认应 `DENY WHOLE TRANSACTION`。不得允许 "部分 beat 合法、部分 beat 非法"的 transaction 进入下游。IP 应支持 INCR、FIXED、
    WRAP 三种 burst 的地址范围计算。
  acceptance_criteria:
  - 跨边界 burst 整体拒绝（无 beat 进入下游）；
  - INCR/FIXED/WRAP 均正确计算地址范围并检查。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.PERM_MASTER.001
  category: FUNC
  feature: master_permission
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: 每个 Region 应包含 `MASTER_MASK[MASTER_NUM-1:0]`。 `master_allowed = MASTER_MASK[request.master_id]`。非法 Master ID
    （`master_id >= MASTER_NUM`）必须被拒绝。
  acceptance_criteria:
  - '`MASTER_MASK` 对应位为 1 时允许；'
  - 非法 Master ID 拒绝。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.PERM_SECURITY.001
  category: FUNC
  feature: security_permission
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - formal
  description: Region 应独立支持 `SECURE_ALLOW` 与 `NONSECURE_ALLOW`，可表达 Secure-only、 Non-secure-only、Both、Neither 四种策略。Region Security
    Permission 不负责判断 Master 是否具有声明该 Security State 的资格（该判断由 Master Security Attribution 完成）。
  acceptance_criteria:
  - Secure 请求命中 `SECURE_ALLOW=0` Region 时拒绝；
  - Non-secure 请求命中 `NONSECURE_ALLOW=0` Region 时拒绝；
  - 四种策略组合均正确。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.PERM_PRIVILEGE.001
  category: FUNC
  feature: privilege_permission
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: 使用 `AxPROT[0]` 判定 Privilege。Region 应独立提供 `PRIVILEGED_ALLOW` 与 `UNPRIVILEGED_ALLOW`，可表达 Privileged-only、Unprivileged-only、Both、None。
  acceptance_criteria:
  - Privileged 请求命中 `PRIVILEGED_ALLOW=0` Region 时拒绝；
  - Unprivileged 请求命中 `UNPRIVILEGED_ALLOW=0` Region 时拒绝。
  trace:
    hld_ref: []
    test_ref: []
- id: LRS.FUNC.AXI_MPU.PERM_OP.001
  category: FUNC
  feature: operation_permission
  priority: P0
  status: active
  source_ref:
  - SRC-001
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  description: Region 应提供 `READ_ALLOW`、`WRITE_ALLOW`、`EXECUTE_ALLOW`。Read transaction 应 要求 `READ_ALLOW`；Write transaction
