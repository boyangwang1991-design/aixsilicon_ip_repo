    direction: output
    width: 1
    clock: pclk
    reset: preset_n
  req_ref:
  - LRS.INTF.SPI_MASTER.IF.002
- id: HLD.IF.EXT.SPI_MASTER.SPI
  name: SPI
  scope: external
  protocol: SPI
  role: master
  owner_module: HLD.MOD.SPI_MASTER.ENGINE
  signals:
  - name: spi_sclk_o
    direction: output
    width: 1
    clock: pclk
    reset: preset_n
  - name: spi_mosi_o
    direction: output
    width: 1
    clock: pclk
    reset: preset_n
  - name: spi_miso_i
    direction: input
    width: 1
    clock: pclk
    reset: preset_n
  - name: spi_cs_n_o
    direction: output
    width: NUM_CS
    clock: pclk
    reset: preset_n
  req_ref:
  - LRS.INTF.SPI_MASTER.IF.002
- id: HLD.IF.EXT.SPI_MASTER.IRQ
  name: IRQ
  scope: external
  protocol: event
  role: master
  owner_module: HLD.MOD.SPI_MASTER.CSR
  signals:
  - name: irq_o
    direction: output
    width: 1
    clock: pclk
    reset: preset_n
  req_ref:
  - LRS.INTF.SPI_MASTER.IF.002
