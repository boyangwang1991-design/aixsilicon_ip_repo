schema_version: '2.0'
ip_name: spi_master
interfaces:
- id: HLD.IF.EXT.SPI_MASTER.APB
  name: APB
  scope: external
  protocol: APB4
  role: slave
  owner_module: HLD.MOD.SPI_MASTER.CSR
  signals:
  - name: pclk
    direction: input
    width: 1
    clock: pclk
    reset: preset_n
  - name: preset_n
    direction: input
    width: 1
    clock: pclk
    reset: preset_n
  - name: psel
    direction: input
    width: 1
    clock: pclk
    reset: preset_n
  - name: penable
    direction: input
    width: 1
    clock: pclk
    reset: preset_n
  - name: pwrite
    direction: input
    width: 1
    clock: pclk
    reset: preset_n
  - name: paddr
    direction: input
    width: 12
    clock: pclk
    reset: preset_n
  - name: pwdata
    direction: input
    width: 32
    clock: pclk
    reset: preset_n
  - name: pstrb
    direction: input
    width: 4
    clock: pclk
    reset: preset_n
  - name: pprot
    direction: input
    width: 3
    clock: pclk
    reset: preset_n
  - name: prdata
    direction: output
    width: 32
    clock: pclk
    reset: preset_n
  - name: pready
    direction: output
    width: 1
    clock: pclk
    reset: preset_n
