- id: LLD.FSM.GPIO.MAILBOX
  module_ref: LLD.MOD.GPIO.MAILBOX
  hld_ref:
  - HLD.MOD.GPIO.MAILBOX
  encoding: binary
  reset_state: RECOVER
  illegal_state_handling: 回到RECOVER；保留传输token和载荷，排空旧应答后才允许新命令
  states:
  - RECOVER
  - READY
  - BUSY
  transitions:
  - from: RECOVER
    to: READY
    condition: 同步填充完成且inflight=0且ack=req
  - from: READY
    to: BUSY
    condition: 合法命令接受
  - from: BUSY
    to: READY
    condition: 匹配应答返回
  - from: BUSY
    to: BUSY
    condition: 超时或AON停钟
  - from: READY
    to: RECOVER
    condition: 主暖复位
  - from: BUSY
    to: RECOVER
    condition: 主暖复位
