config:
- id: HLD.CFG.WATCHDOG.DEFAULT_CFG
  config_ref: PARAM.WATCHDOG.DEFAULT_CFG
  affects:
    modules:
    - HLD.MOD.WATCHDOG.BUS
    - HLD.MOD.WATCHDOG.CHANNEL
    - HLD.MOD.WATCHDOG.SAFETY
  architecture_effect: 按每通道完整逻辑配置初始化活动/暂存与保护值；客户端默认及覆盖项在构建时展开并验证。
  req_ref:
  - LRS.CFG.WATCHDOG.DEFAULT_CFG.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.AUTO_START_MASK
  config_ref: PARAM.WATCHDOG.AUTO_START_MASK
  affects:
    modules:
    - HLD.MOD.WATCHDOG.INTEGRATION
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 选定 POR 释放后独立启动通道，必须有合法 DEFAULT_CFG，不依赖 pclk。
  req_ref:
  - LRS.CFG.WATCHDOG.AUTO_START_MASK.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.NO_STOP_MASK
  config_ref: PARAM.WATCHDOG.NO_STOP_MASK
  affects:
    modules:
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 决定启动后不可软件停止的通道，动态默认覆盖全部已实现通道。
  req_ref:
  - LRS.CFG.WATCHDOG.NO_STOP_MASK.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.HARD_CFG_LOCK_MASK
  config_ref: PARAM.WATCHDOG.HARD_CFG_LOCK_MASK
  affects:
    modules:
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 设定 POR 配置锁初值；锁只影响配置控制，不取消已有合法服务。
  req_ref:
  - LRS.CFG.WATCHDOG.HARD_CFG_LOCK_MASK.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.NUM_CHANNELS
  config_ref: PARAM.WATCHDOG.NUM_CHANNELS
  affects:
    modules:
    - HLD.MOD.WATCHDOG.INTEGRATION
    - HLD.MOD.WATCHDOG.BUS
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 复制独立监督通道与逐通道状态/快照，扩大选择与请求汇总；不得改变单通道计时周期。
  req_ref:
  - LRS.CFG.WATCHDOG.NUM_CHANNELS.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.COUNTER_WIDTH
  config_ref: PARAM.WATCHDOG.COUNTER_WIDTH
  affects:
    modules:
    - HLD.MOD.WATCHDOG.CHANNEL
    - HLD.MOD.WATCHDOG.SAFETY
  architecture_effect: 调整计时/阈值/Deadline 和独立保护路径位宽；软件高低字容器与地址保持稳定，拒绝高于实现宽度的配置。
  req_ref:
  - LRS.CFG.WATCHDOG.COUNTER_WIDTH.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.PRESCALE_WIDTH
  config_ref: PARAM.WATCHDOG.PRESCALE_WIDTH
  affects:
    modules:
    - HLD.MOD.WATCHDOG.CHANNEL
    - HLD.MOD.WATCHDOG.SAFETY
  architecture_effect: 调整分频合法空间与独立相位保护，配置截断禁止。
  req_ref:
  - LRS.CFG.WATCHDOG.PRESCALE_WIDTH.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.NUM_CLIENTS
  config_ref: PARAM.WATCHDOG.NUM_CLIENTS
  affects:
    modules:
    - HLD.MOD.WATCHDOG.BUS
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 调整每通道客户端状态与配置规模；仍要求整表原子快照与固定命令时限。
  req_ref:
  - LRS.CFG.WATCHDOG.NUM_CLIENTS.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.SOURCE_WIDTH
  config_ref: PARAM.WATCHDOG.SOURCE_WIDTH
  affects:
    modules:
    - HLD.MOD.WATCHDOG.BUS
    - HLD.MOD.WATCHDOG.TRANSPORT
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 调整可信身份负载宽度与授权比较，不生成额外身份可信性。
  req_ref:
  - LRS.CFG.WATCHDOG.SOURCE_WIDTH.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.SYNC_STAGES
  config_ref: PARAM.WATCHDOG.SYNC_STAGES
  affects:
    modules:
    - HLD.MOD.WATCHDOG.INTEGRATION
    - HLD.MOD.WATCHDOG.TRANSPORT
  architecture_effect: 调整同步释放/控制传递和时限预算；不直接同步多位负载。
  req_ref:
  - LRS.CFG.WATCHDOG.SYNC_STAGES.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.SUPPORT_TOKEN_QA
  config_ref: PARAM.WATCHDOG.SUPPORT_TOKEN_QA
  affects:
    modules:
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 裁剪增强服务算法与 token 状态，未实现模式返回 UNSUPPORTED。
  req_ref:
  - LRS.CFG.WATCHDOG.SUPPORT_TOKEN_QA.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.SUPPORT_SUPERVISION
  config_ref: PARAM.WATCHDOG.SUPPORT_SUPERVISION
  affects:
    modules:
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 裁剪 GROUP/ALIVE/FLOW，基础 SINGLE 保留；不能因裁剪重排地址。
  req_ref:
  - LRS.CFG.WATCHDOG.SUPPORT_SUPERVISION.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.SUPPORT_HW_EVENT
  config_ref: PARAM.WATCHDOG.SUPPORT_HW_EVENT
  affects:
    modules:
    - HLD.MOD.WATCHDOG.DISPATCH
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 决定硬件服务来源是否存在；启用时与邮箱共享公平仲裁，关闭时不接受该路径。
  req_ref:
  - LRS.CFG.WATCHDOG.SUPPORT_HW_EVENT.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.SAFETY_EN
  config_ref: PARAM.WATCHDOG.SAFETY_EN
  affects:
    modules:
    - HLD.MOD.WATCHDOG.SAFETY
    - HLD.MOD.WATCHDOG.CHANNEL
    - HLD.MOD.WATCHDOG.TRANSPORT
  architecture_effect: 控制增强独立检测与保护；普通监督与最终保持不随增强关闭而消失。
  req_ref:
  - LRS.CFG.WATCHDOG.SAFETY_EN.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.ALLOW_RUNTIME_UPDATE
  config_ref: PARAM.WATCHDOG.ALLOW_RUNTIME_UPDATE
  affects:
    modules:
    - HLD.MOD.WATCHDOG.CHANNEL
  architecture_effect: 决定 RUN 计时配置是否可进入 pending；无条件保留禁用态完整配置提交。
  req_ref:
  - LRS.CFG.WATCHDOG.ALLOW_RUNTIME_UPDATE.001
  applicability:
    expr: 'true'
- id: HLD.CFG.WATCHDOG.DIAG_INJECT_EN
  config_ref: PARAM.WATCHDOG.DIAG_INJECT_EN
  affects:
    modules:
    - HLD.MOD.WATCHDOG.BUS
    - HLD.MOD.WATCHDOG.SAFETY
  architecture_effect: 控制受保护诊断注入入口；生产默认关闭。未实现的检测对象不得用无效注入宣称诊断通过。
  req_ref:
  - LRS.CFG.WATCHDOG.DIAG_INJECT_EN.001
  applicability:
    expr: 'true'
