features:
- id: FL.WATCHDOG.ALIVE
  name: 固定周期存活监督
  description: 固定周期存活监督的可执行正确性证明
  priority: must
  req_ref:
  - LRS.FUNC.WATCHDOG.SUP.004
  - LRS.FUNC.WATCHDOG.SUP.005
  - LRS.FUNC.WATCHDOG.SUP.006
  design_ref:
  - LLD.MOD.WATCHDOG.CHANNEL
  applicability:
    expr: 'true'
  proof_methods:
  - simulation
  - assertion
  testcases:
  - id: TC.WATCHDOG.ALIVE.001
    name: alive
    type: boundary
    description: 固定周期存活监督
    priority: must
    tier: regression
    proof_kind: uvm
    implementation: verification/tc/tc_alive.sv
    feature_ref:
    - FL.WATCHDOG.ALIVE
    req_ref:
    - LRS.FUNC.WATCHDOG.SUP.004
    - LRS.FUNC.WATCHDOG.SUP.005
    - LRS.FUNC.WATCHDOG.SUP.006
    design_ref:
    - LLD.MOD.WATCHDOG.CHANNEL
    preconditions:
    - POR完成；采用参数空间的合法配置；依据当前能力选择正向或UNSUPPORTED负向场景
    stimulus:
    - MIN/MAX事件计数边界与溢出；TIMEOUT当拍服务；BOOT首周期；PRETIMEOUT时部分客户端欠报；持续高速报到。
    expected_result:
    - 按固定边沿窗口分桶，边界先评价旧桶；合格自动换周期；边界事件返回EPOCH_BOUNDARY且不计入；欠报/过报准确记录。
    timeout_policy: 仿真10ms/1000000 WDT边沿，进程600秒；静态每配置1800秒，超时失败
    config_ref:
    - CFGSET.WATCHDOG.STANDARD
    - CFGSET.WATCHDOG.SAFETY
    - CFGSET.WATCHDOG.SUPERVISOR
    - CFGSET.WATCHDOG.PC_MATRIX
    applicability:
      expr: 'true'
  coverage:
  - id: COV.WATCHDOG.ALIVE.001
    name: alive_scenarios
    type: functional
    description: 计数MIN-1/MIN/MAX/MAX+1×边界事件×BOOT/RUN；饱和。
    feature_ref:
    - FL.WATCHDOG.ALIVE
    design_ref:
    - LLD.MOD.WATCHDOG.CHANNEL
    applicability:
      expr: 'true'
  assertions: []
  config_coverage: []
