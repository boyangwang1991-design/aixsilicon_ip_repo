    req_ref:
    - LRS.INTF.WATCHDOG.BUS.001
    - LRS.INTF.WATCHDOG.BUS.002
    - LRS.INTF.WATCHDOG.BUS.003
    - LRS.INTF.WATCHDOG.PORTS.001
    - LRS.REG.WATCHDOG.ACCESS.001
    - LRS.REG.WATCHDOG.IDENTITY.001
    design_ref:
    - LLD.MOD.WATCHDOG.BUS
