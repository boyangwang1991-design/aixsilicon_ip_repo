- id: LRS.CFG.WATCHDOG.PAR.003
  category: CFG
  feature: par
  priority: P0
  status: active
  source_ref:
  - watchdog_contract.md:WDT-PAR-003
  applicability:
    expr: 'true'
  verify_method:
