  description: 每通道计数、分频相位、服务状态、故障和升级期限独立。允许共享 APB/CDC 和诊断汇总，但不得因其他通道等待或故障而停止本通道计时。
  acceptance_criteria:
  - 制造其他通道忙、故障与恢复，本通道的到期边沿和升级期限均不变化。
