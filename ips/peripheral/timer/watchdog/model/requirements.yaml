- id: LRS.CFG.WATCHDOG.NUM_CHANNELS.001
  category: CFG
  feature: num_channels
  priority: P0
  status: active
  source_ref:
  - watchdog_contract.md:§3.2
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - static
  description: '`NUM_CHANNELS` 应配置独立监督通道数，合法值为 `1～16`，默认 `1`。非法输入应拒绝，不能通过截断或静默降级改变配置语义。'
  acceptance_criteria:
  - 默认实例读回/体现 `NUM_CHANNELS=1`；合法值域端点及代表中间点可构建。
  - 越界或非枚举值在生成/编译阶段报错；功能关闭时仍检查未支持访问的拒绝行为。
