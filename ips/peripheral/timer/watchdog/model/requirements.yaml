- id: LRS.CFG.WATCHDOG.DEFAULT_CFG.001
  category: CFG
  feature: default_cfg
  priority: P0
  status: active
  source_ref:
  - watchdog_contract.md:§3.2、§6、§16.5
  applicability:
    expr: 'true'
  verify_method:
  - simulation
  - static
  description: 每个通道应具有完整合法静态 DEFAULT_CFG。自动启动通道的默认配置必须在构建阶段校验，包含服务/监督模式、阈值、策略及全部必需客户端条件。默认 BOOT_EN=1，默认服务算法为双密钥；具体时间由实例声明，不能假定一个固定时长适用于所有时钟。
  acceptance_criteria:
  - 逐通道检查 DEFAULT_CFG 满足原契约 §16.5 全部适用约束。
  - 自动启动选中但默认配置不合法必须构建失败，不得静默关闭通道。
  trace:
    hld_ref: []
    test_ref: []
