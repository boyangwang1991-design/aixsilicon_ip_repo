  description: 从高到低按以下顺序处理，互斥状态更新只能执行最高有效项： 1. POR 初始化。 2. 自身致命完整性/冗余故障；最终升级到期。 3. 当前监督超时、服务违规、检查点 Deadline 违规；同拍发生的各原因全部置位。
    4. 可信恢复事件；不得覆盖第 2/3 项本拍新故障。 5. 完整合法服务/刷新；含已批准待提交配置的边界切换。 6. 合法 START/STOP；STOP 不得覆盖本拍超时。 7. 授权暂停进入/退出。 8. 普通计数、预警、诊断清除。
    进入暂停的该边沿仍执行到期判断；退出暂停的边沿只恢复状态，下一边沿恢复递增。暂停前已锁存故障不得暂停升级。硬件置位与 W1C 同拍时硬件置位优先。
