# Unified repo CI: scan every FuseSoC core under ips/ and run lint.
name: IP Unified CI

on:
  # CI disabled (2026-08): local-first workflow; restore push/pull_request/
  # release triggers to re-enable.
  workflow_dispatch:

jobs:
  lint-all-cores:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FuseSoC
        run: pip install fusesoc

      - name: Lint every core in ips/
        run: |
          fusesoc library add aixsilicon_ip_repo .
          failed=0
          for core in $(find ips -name '*.core'); do
            echo "Linting $core"
            name=$(grep '^name:' "$core" | head -1 | sed 's/name:[ ]*//')
            fusesoc run --target lint "${name}:latest" || failed=1
          done
          exit $failed

  validate-index:
    runs-on: ubuntu-latest
    needs: lint-all-cores
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate registry.yaml (SSOT consistency)
        run: |
          python3 scripts/build_ip_registry.py --check

      - name: Check README status overview is in sync
        run: |
          python3 scripts/update_registry_readme.py --check
