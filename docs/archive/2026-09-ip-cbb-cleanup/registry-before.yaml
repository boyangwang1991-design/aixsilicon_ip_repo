# 本文件是 AIXSILICON IP 目录唯一 SSOT（由 scripts/build_ip_registry.py 治理）。
# 字段: id/name/domain/subdomain/type/priority/status/maturity/version/interfaces/description/path
# 修改入口: 编辑 scripts/data/*.py 清单后运行 'python3 scripts/build_ip_registry.py --generate' 重新生成。
# status=implemented/released 表示物理目录存在且已交付；planned 条目仅为规划候选。
# 边界: IP 必须对外提供独立集成合同（如 CSR/地址图、中断、系统策略或产品级接口）；通用构件归 CBB。
